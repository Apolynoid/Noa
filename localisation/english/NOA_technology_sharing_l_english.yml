l_english:
 youkai_mountain_tech_sharing_name:0 "Youkai Mountain Technology Exchange"
 youkai_mountain_tech_sharing_desc:0 "The Youkai Mountain Technology Exchange is a technology exchange organization formed by the Democratic Alliance led by the Tengu Republic and the Kappa Republic, aiming to promote the technological development of democratic countries throughout Gensokyo."
 scarlet_imperial_academy_name:0 "Scarlet Imperial Academy of Sciences"
 scarlet_imperial_academy_desc:0 "The Scarlet Imperial Academy of Sciences is a research institution under the Scarlet Empire, dedicated to raising the overall technological level of the Empire and its allies."
 gekokujyo_tech_mutual_aid_committee_name:0 "Gekokujou Technology Mutual Aid Committee"
 gekokujyo_tech_mutual_aid_committee_desc:0 "The Gekokujou Technology Mutual Aid Committee was proposed by the Insurgency Alliance and exists as a subordinate body of the Gekokujou Revolutionary Movement. It is a technology exchange organization dedicated to helping the weak across Gensokyo improve their technology, thereby advancing the Gekokujou movement in Gensokyo."
