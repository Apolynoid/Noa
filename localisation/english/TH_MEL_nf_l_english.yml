MEL_te_shu_zuo_wu_ying_yong:0 "Special Crop Application"
MEL_te_shu_zuo_wu_ying_yong_desc:0 "The special geographical location of the Southwest allows the local area to produce crops with special effects. By using these special crops in a targeted manner, we can gain a certain advantage in war. Building §Yplantations§! increases the number of special crops harvested each §Yharvest cycle§!. At the same time, building plantations in undeveloped areas not only costs less but also helps develop the region. When applying special crops, each deployment consumes §Yone unit§! of special crops regardless of the number of troops under the §Ygeneral§!.\n\nOur current stockpile of §Yspecial crops§!:\n£toxic_crops_texticon §YSpecial Crops§!: [?MEL_crop_num]"
