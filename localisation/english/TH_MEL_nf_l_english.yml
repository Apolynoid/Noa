MEL_zheng_zhi_beng_kui_idea:0 "Political Collapse"
MEL_zheng_zhi_beng_kui_idea_desc:0 "Unlike the other countries of Gensokyo, our country has never established an effective administrative system. Social and political operations depend heavily on Medicine's personal authority and the army's direct control over society, which has severely affected social stability and administrative capacity."
