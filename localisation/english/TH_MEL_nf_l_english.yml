MEL_ling_lan_jun_guo_zhu_yi_idea:0 "Suzuran Militarism"
MEL_ling_lan_jun_guo_zhu_yi_idea_desc:0 "Due to the chaotic situation in the Southwest, military construction receives extremely high priority in our country. Not only do social production and personnel allocation prioritize military needs, but the army also directly controls our political situation, and society regards enlistment as the best path for personal advancement."
