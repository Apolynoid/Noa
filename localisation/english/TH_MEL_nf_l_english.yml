MEL_bo_ruo_de_min_yong_gong_ye_idea_desc:0 "Our country has long made military construction the top priority while neglecting civilian industry. This neglect directly resulted in a lack of sufficient experience in basic industrial construction and a failure to cultivate enough relevant technical personnel."
