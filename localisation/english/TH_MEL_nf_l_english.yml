MEL_DAWN_DESC:0 "The 138 Youkai Mountain War shattered the social order of the Suzuran region, and Medicine rose from the chaos. Relying on her personal prestige, a small armed force, and knowledge of applying the Southwest's special crops, she became the de facto ruler of the Suzuran region, and during the Human Punishment War declared the nominal unification of the region. However, the widespread presence of local powerholders forced Medicine to rule through the army, and the army, at her behest, intervened heavily in politics and consumed most social resources, leaving the administrative system chronically hollow and the political machinery of the Suzuran region near collapse. Externally, not only does the expansion of the Deity Faith Alliance threaten Suzuran, but other powers in the Southwest are also watching for their chance. Can Medicine weather threats at home and abroad and truly secure her throne in this turbulent Southwest?"
introduce_MEL_page1:0 "Even though it was not the main battlefield, the 138 §YYoukai Mountain War§! still had a huge impact on the Suzuran region. A flood of war refugees and deserters shattered the social order of the region, and uncontrolled ghosts from Hell made the situation even worse. They formed all kinds of armed groups and bandit organizations in the region. Conflicts among these violent groups almost never ceased, and the area descended into near anarchy. But §Y[MEL.GetLeader]§! keenly seized the opportunity. Soon, relying on her prestige, a small armed force, and knowledge of applying the Southwest's §Yspecial crops§!, she integrated the other violent groups and became the de facto ruler of the Suzuran region. Taking advantage of the §YHuman Punishment War§!, when Gensokyo's major powers had no time for the Southwest, Medicine declared the founding of §Y[MEL.GetName]§! in the Suzuran region, nominally unifying it.\n\nYet Medicine's rule is undoubtedly fragile. The first problem she faces is the §Ychaotic political situation§! of the Suzuran region. Although the region is nominally unified, local powerholders remain widespread, and Medicine has to rule through the army. The army, at Medicine's behest, intervenes heavily in politics, giving the regime the character of §Ymilitary government rule§!, which brings low political capacity due to a lack of administrative officials. This also causes social resources to tilt heavily toward the army; citing the chaos in the Southwest, the army seizes most of the region's resources, allowing §Y[MEL.GetName]§! to maintain a military capability entirely out of proportion to its size. This in turn affects social norms: joining the army becomes almost the only path for personal advancement, the administrative bureaucracy is even more neglected, and political operations nearly collapse. Meanwhile, the region's already weak industrial capacity is forced to tilt further toward military industry, leaving civilian industry almost undeveloped.\n\nThe situation in the Southwest has indeed become complex. After the war, §Y[AKI.GetName]§! received aid from §Y[SCA.GetName]§! and became the strongest power in the Southwest, with many voices at home supporting expansion into the region. Other Southwest powers all face the question of how to resist §Y[AKI.GetName]§!'s expansion, but repeated negotiations between Suzuran and these small Southwest powers to form a defense alliance against §Y[AKI.GetName]§! all failed because the interests of the parties could not be balanced. Now, war with §Y[AKI.GetName]§! is close at hand, and other powers are eyeing the Southwest as well. Can Medicine's ambitions survive the guns outside and the blades within, and truly secure her throne in the Southwest?"
