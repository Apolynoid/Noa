 sp_race_norcturnal_intuition:0 "Nocturnal Intuition"
 sp_race_norcturnal_intuition_desc:0 "Drawing on their instincts and spirit power, beast youkai can better perceive their surroundings at night. By systematically applying this trait to our battle plans, our warriors will gain a greater advantage in night combat."
 sp_race_aggressive_nature:0 "Aggressive Nature"
 sp_race_aggressive_nature_desc:0 "Our nature as grassroots youkai makes us crave battle. By properly channeling this nature, we can bring out greater combat effectiveness in our warriors."
 sp_race_special_operation:0 "Special Operations"
 sp_race_special_operation_desc:0 "Even with diminished strength, the youkai race still retains its pursuit of individual power. By properly channeling this and applying advanced equipment, our warriors will be able to demonstrate formidable individual combat capability on the battlefield."
 sp_race_tengu_kamikaze:0 "Tengu Divine Wind"
 sp_race_tengu_kamikaze_desc:0 "The tengu race is born with a pursuit of speed. We should incorporate this trait into military training so that our warriors gain better mobility on the battlefield and an advantage in difficult terrain."
 sp_race_deification:0 "Divine Manifestation"
 sp_race_deification_desc:0 "Gods can bestow blessings upon the people under their rule by manifesting their divinity. This can be used both to bless crops for a bountiful harvest and to better arrange military plans."
 sp_race_nature_intergration:0 "Natural Integration"
 sp_race_nature_intergration_desc:0 "Fairies are beings born from nature, and thus are naturally close to it. This gives us a natural advantage in material transport and construction planning."

