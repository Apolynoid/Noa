AKI_ren_yu_shen_de_ge_he_idea_desc:0 "Besides the eight million gods, the human villages at the foot of Youkai Mountain are also an important part of our country. However, a serious divide remains between humans and gods, especially in the composition of the army, which severely weakens our army's command and combat capability."
