l_english:
AKI_DAWN_DESC:0 "The Deity Faith Alliance was attacked and swiftly occupied by the Scarlet Empire during the 138 Youkai Mountain War, suffering severe war trauma and losing a great deal of territory—territory seized by fairies who broke away from the Imperial Army after the war and later founded the Southwest Fairy Union. Within the Alliance, the humans and gods who had suffered heavily in the Youkai Mountain War formed the Witherers, a paramilitary organization hostile to the Scarlet Empire, with Shizuha Aki as its leader. The worsening land annexation problem after the war allowed the Witherers to expand further, becoming the Alliance's main source of instability. Post-war aid funds from the Scarlet Devil Mansion were seen as an olive branch from the Empire, but this further enraged the Witherers, whose activities shifted to street violence and political assassinations. The Alliance's survival in the Southwest is undergoing a severe test..."
introduce_AKI_page1:0 "The foot of Youkai Mountain has always been a place where humans and gods live together: the eight million gods provide divine protection to humans, and humans offer faith in return. After the Great Barrier Crisis, the original settlements at the foot of the mountain united to form the §Y[AKI.GetName]§!, ruled alternately by the two Aki goddesses. However, the §Y138 Youkai Mountain War§! shattered this balance. To break through the Tengu defense line by surprise, the §Y[SCA.GetName]§! attacked the nominally neutral §Y[AKI.GetName]§!, swiftly occupying the entire territory of the §Y[AKI.GetName]§! and not withdrawing from the foot of Youkai Mountain until the Scarlet Devil Mansion won the war.\n\nThe Youkai Mountain War not only cost the §Y[AKI.GetName]§! the region now held by the §Y[SGS.GetName]§!—a region occupied by fairies who broke away from the Scarlet Devil Mansion's army during the war, later joined by fairies fleeing the flames of the §YHuman Punishment War§! from the Magic Forest—but also inflicted severe war trauma on the §Y[AKI.GetName]§!. Unsurprisingly, a paramilitary organization hostile to the §Y[SCA.GetName]§! arose within the Alliance: the §YWitherers§!. With §Y$AKI_sizuha$§! as its leader and humans and gods who suffered heavily in the Youkai Mountain War as its core, the organization swore revenge against the Scarlet Devil Mansion. On the other hand, the war worsened the Alliance's §Yland annexation§! problem. The war bankrupted many peasants, who had to sell ownership of land in occupied areas to less war-torn regions, further deepening the wealth gap. In the end, land concentrated in the hands of a few, and the many tenant farmers strongly resented the state of §Yland annexation§!; some joined the §YWitherers§!, becoming the Alliance's main source of instability.\n\nAfter the §YHuman Punishment War§! ended, the §Y[SCA.GetName]§!, considering the importance of stability in the Southwest to the Empire, used reparations from the §Y[HUM.GetName]§! to provide the §Y[AKI.GetName]§! with a large sum of aid funds and low-interest loans, in effect compensation for the §YYoukai Mountain War§!. Many in the Alliance saw this as an olive branch from the §Y[SCA.GetName]§!, and the new investment eased the Alliance's instability, so the current ruler §Y$AKI_szh$§! shifted to a policy of cooperation with the Scarlet Devil Mansion. But the §YWitherers§! saw this as a grave betrayal; the disappointed §Y$AKI_sizuha$§! renounced the leadership of the §Y[AKI.GetName]§!, and the §YWitherers§!' activities turned to street violence and political assassinations.\n\nWhether the hard-to-contain §Yland annexation§! problem or the violent actions of the §YWitherers§! organization, both gravely threaten the Alliance's administrative capacity and stability—and the solutions to these problems and their outcomes will determine whether the §Y[AKI.GetName]§! can survive in the Southwest of Gensokyo..."
# 国策 national focus
AKI_ying_dui_tu_di_jian_bing:0 "Address Land Annexation"
AKI_ying_dui_tu_di_jian_bing_desc:0 "Due to the Alliance's long agricultural tradition, most of the land within the Alliance is controlled by a small number of people, and the many landless peasants are dissatisfied with the state of land annexation, becoming the Alliance's main source of instability. This problem must be solved."
