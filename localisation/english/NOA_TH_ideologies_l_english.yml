l_english:
 gekokujyoism:0 "Gekokujouism"
 gekokujyoism_desc:0 "Gekokujouism is not a strictly defined concept; it is mainly an umbrella term used by others, especially the opponents of Seija Kijin, to describe the conduct and philosophy of Seija Kijin and the Insurgency Alliance she leads. Specifically, Gekokujouism encompasses challenging the established order of Gensokyo and seeking to change the status quo and build a new order belonging to the weak. \n§YUnder this ideology, increasing or decreasing Idealism will be easier.§!"
