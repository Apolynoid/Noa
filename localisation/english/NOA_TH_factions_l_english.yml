l_english:
 territorial_integrity_goal_name:0 "Territorial Integrity"
 territorial_integrity_goal_desc:0 "Protecting the territorial integrity of member states is our foremost goal."
 spread_of_radicalism_goal_name:0 "Spread of Radicalism"
 spread_of_radicalism_goal_desc:0 "The Old Order has loomed over Gensokyo for far too long. We must do whatever it takes to free Gensokyo from its shackles, by force if necessary."
 unity_of_radicalism_goal_name:0 "Radical Unity"
 unity_of_radicalism_goal_desc:0 "To oppose the existing order of the Great Youkai, we must strengthen cooperation among allied nations and recruit more allies."
 containment_of_upheaval_goal_name:0 "Containment of Upheaval"
 containment_of_upheaval_goal_desc:0 "These so-called changemakers only create more chaos in Gensokyo. We must put an end to their unrealistic fantasies."
 arsenal_of_democracy_goal_name:0 "Arsenal of Democracy"
 arsenal_of_democracy_goal_desc:0 "Democracies must arm themselves with sufficient weapons, and we must be ready to supply them."
 NOA_industrial_research_goal_name: "Research $jianzaojishu151$"
 NOA_a_military_base_goal_desc: "Defending our security requires weapons. In order to produce them in large quantities, we need a strong military industry."
 stall_the_radicalist_threat_in_netherworld_goal_name: "Stall the Radicalist Threat in the Netherworld"
 stall_the_radicalist_threat_in_netherworld_goal_desc: "The radicalist rebels in the Netherworld gravely threaten the peace and stability of Gensokyo. This problem must be resolved once and for all."
 spread_radicalism_in_netherworld_goal_name:0 "Spread Radicalism in the Netherworld"
 spread_radicalism_in_netherworld_goal_desc:0 "The Netherworld Revolutionary Front has risen up against the Old Order in the Netherworld. We must help them win the civil war."
 war_on_authority_goal_name:0 "Declare War on the Old Powers"
 war_on_authority_goal_desc:0 "The old powers are nothing but a burden on the new Gensokyo. It is time for them to leave the stage."
 war_on_changemaker_goal_name:0 "Declare War on the Changemakers"
 war_on_changemaker_goal_desc:0 "These so-called changemakers only undermine the harmony of Gensokyo. They must be eliminated."
 army_expansion_goal_name: "Expand the Army"
 army_expansion_goal_desc: "A practical, down-to-earth army is what matters most. We need a strong army. Only then can we truly ensure our survival."
 defeat_of_changemaker_goal_name: "Defeat the Changemakers"
 defeat_of_changemaker_goal_desc: "To defeat the changemakers across the world, we must first eliminate those in our own region."
 defeat_of_authority_goal_name: "Eliminate the Old Powers"
 defeat_of_authority_goal_desc: "Our foremost task is to thoroughly purge every last foothold of the old powers on the continent."

