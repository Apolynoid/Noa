TKM_fu_sang_shen_gao_neng_ling_qi_te_xing_desc:0 "道具原本依赖万宝槌的魔力才能维持付丧神化。万宝槌的魔力消失后，付丧神的领袖$TKM_raiko$从外界寻找到了替代万宝槌的魔力来源，付丧神才能继续维持存在。然而，这一魔力来源由于大结界危机逐渐变的不稳定。幸运的是，$TKM_raiko$立即敏锐的意识到伊奘诺物质中提取出的§Y高能灵气§!是十分优秀的魔力来源，并立即主导研制出了通过消耗§Y高能灵气§!维持并增强道具付丧神化的魔力转换装置。\n\n为了便于能量运输，高能灵气将被提炼成$TKM_sp_bead_icon$的形式才能用于魔力转换装置。随着对这一魔力转换路径的研究逐步深入，提炼同等效果的$TKM_sp_bead_icon$所需要的高能灵气在未来有可能减少，从而更高效的利用高能灵气资源。投入$TKM_sp_bead_icon$不足对我们的工业生产与军事都会产生不利影响，而投入足够的$TKM_sp_bead_icon$可以使付丧神发挥出超越平均水准的能力。\n\n高能灵气对付丧神的影响每月结算，同时$TKM_sp_bead_icon$的投入在结算时生效。如果没有足够的$TKM_sp_bead_icon$，魔力转换装置将会发生故障，当月将§R完全无法正常转换魔力§!，还需要消耗额外的资源维修。此外，由于$TKM_sp_bead_icon$分配制度的复杂性，每个月只能调整§Y一次§!工业或军事的$TKM_sp_bead_icon$投入等级，且一次只能调节一个等级。\n\n当前提炼一个$TKM_sp_bead_icon$需要的高能灵气：§Y[?TKM.TKM_energy_per_sp_bead]§!\n仓库中的$TKM_sp_bead_icon$数量/仓库上限：§Y[?TKM.TKM_sp_bead_num]§!/[?TKM.TKM_sp_bead_storage]\n每月结算时自动进行$TKM_sp_bead_icon$转换：[TKM_is_auto_sp_bead_conversion_on]\n工业$TKM_sp_bead_icon$投入等级/等级上限：§Y[?TKM.TKM_industrial_feature_level]§!/[?TKM.TKM_industrial_feature_upper_bound]\n军事$TKM_sp_bead_icon$投入等级/等级上限：§Y[?TKM.TKM_military_feature_level]§!/[?TKM.TKM_military_feature_upper_bound]\n每月维持当前$TKM_sp_bead_icon$投入等级需要消耗的$TKM_sp_bead_icon$数量：§Y[?TKM.TKM_monthly_sp_bead_cost]§!"

