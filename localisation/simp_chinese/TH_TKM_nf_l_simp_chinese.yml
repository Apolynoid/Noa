TKM_bo_ruo_de_gong_ye_idea_template:0 "在上一次战争中，我们最早作为人类的军事工业基地而存在。而当我们从人类手中获得独立以后，我们不得不面对我国在民用工业方面的严重缺陷"
TKM_ren_lei_de_bao_hu_zhe_idea:0 "人类的保护者"
TKM_ren_lei_de_bao_hu_zhe_idea_desc:0 "人类战败后，人类村落几乎完全丧失了军事能力，在战后协议中我们理所应当的成为了人类的保护者。除了保护人类村落的独立性以外，我们也能从这一特殊关系中获取一定的利益。"
