TKM_bu_wen_ding_de_xin_sheng_zheng_quan_idea:0 "不稳定的新生政权"
TKM_bu_wen_ding_de_xin_sheng_zheng_quan_idea_desc:0 "我们从人类手中赢得宝贵的独立的时间并不长，国内对于付丧神的未来发展方向仍然没有形成共识，这无疑会影响我国的社会稳定与行政能力。"
