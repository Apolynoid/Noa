TKM_li_yong_fu_sang_shen_de_te_dian_desc:0 "万宝槌的魔力消失后，我们的领袖$TKM_raiko$为了维持付丧神的存在，从外界寻找到了替代万宝槌的魔力来源，然而这一魔力来源随着大结界危机而变得不稳定。我们必须寻找替代品，而伊奘诺物质中提取出的高能灵气将成为优秀的魔力来源。"
