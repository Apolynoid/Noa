TKM_wei_tuo_shi_zhi_hui:0 "委托式指挥"
TKM_wei_tuo_shi_zhi_hui_desc:0 "我国在幻想乡所处的地缘环境决定了我国将不可避免的被卷入军事冲突中。为了应对这一形式，传统的指挥-执行条令体系已经不再能满足多变的战争形势的需要。委托式指挥将决定任务具体执行方案的权力交给前线指挥人员，有利于应对前线复杂多变的局势。"

