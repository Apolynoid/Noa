l_simp_chinese:
yyk.101.t:0 "冥界的命运"
yyk.101.d:0 "自幻想乡建立以来，冥界作为死者的世界，一直由居住在白玉楼的$YYK_yyk$统治。在大结界危机以前，冥界也只是死者迈向下一个轮回的中转站。\n\n然而，大结界危机与随之而来的幻想乡巨变也严重冲击了冥界的秩序。幻想乡的旧有秩序迅速崩塌，$SEJ_sej$所领导的[SEJ.GetName]的崛起使得下克上主义快速在幻想乡的草根妖怪中传播，而[CIR.GetName]成立后，其他种族也纷纷提出了自己的激进理论。人类战争后，大量死者涌入冥界，也为冥界带来了幻想乡的激进主义。这些来自幻想乡的幽灵同时也为冥界的幽灵带来了有关幻想乡妖怪科学发展的消息，她们讲述的幻想乡的发展水平与冥界停滞的生产水平之间的差距给幽灵们留下了深刻的印象，从而种下了对$YYK_oldorder_party_long$统治不满的种子。\n\n大结界危机后，幽灵和骚灵间的差距逐渐缩小，许多骚灵也选择来到冥界，这其中包括了$UND_kana$。在反对$YYK_oldorder_party_long$统治的组织$YYK_fandong_party_long$成立后，$UND_kana$很快被推举为组织的领袖。白玉楼方面自然不会坐以待毙，然而$YYK_fandong_party_long$仍然成功的在白玉楼的追查与镇压中生存下来，等待时机的到来。\n\n现在，$YYK_fandong_party_long$已经积蓄了足够的力量，而$YYK_oldorder_party_long$也不会束手就擒。冥界的命运在此刻发生分歧，而最终……"
yyk.101.1:0 "$YYK_yyk$的统治必须结束"
yyk.101.2:0 "$YYK_yyk$的统治将会继续"

yyk.102.t:0 "$YYK_fandong_party_long$对军队的渗透行为"
yyk.102.d:0 "$YYK_fandong_party_long$正在对我们的军队进行渗透，许多士兵与低层军官受到了她们的蛊惑，军队的忠诚发生了动摇。"
yyk.102.1:0 "我们必须确保军队忠诚"

yyk.103.t:0 "$YYK_fandong_party_long$针对武器库的袭击"
yyk.103.d:0 "$YYK_fandong_party_long$的暴徒针对我们的武器储备进行了一场进行策划的袭击，有证据表明部分负责武器管理的人员暗中为她们提供了援助。"
yyk.103.1:0 "我们必须保护武器库的安全"

yyk.104.t:0 "$YYK_oldorder_party_long$加强了对军队的控制"
yyk.104.d:0 "$YYK_oldorder_party_long$针对军队中激进事业的支持者进行了清洗，我们在军队中的渗透行动不得不停止。"
yyk.104.1:0 "糟糕"

yyk.105.t:0 "冥界内战爆发"
yyk.105.d:0 "在大结界危机以前，冥界也只是死者迈向下一个轮回的中转站，一直由居住在白玉楼的$YYK_yyk$统治。然而，大结界危机与随之而来的幻想乡巨变严重冲击了冥界的秩序，冥界逐渐产生了不满于$YYK_oldorder_party_long$统治的，称之为$YYK_fandong_party_long$的势力。\n\n这一组织原本仅作为地下组织存在，然而最近，组织的领袖$UND_kana$号召冥界的激进支持者拿起武器反对$YYK_yyk$的统治，$YYK_fandong_party_long$迅速占据了激进支持者较多的区域，而$YYK_oldorder_party_long$很快对此作出反应，声称将“尽快消灭叛乱分子”，冥界内战就此爆发。\n\n幻想乡许多势力都将本次冥界内战视为未来不可避免的大战的预演，并公开支持内战的相关方。此次内战的结果无疑将影响幻想乡的未来。"
yyk.105.1:0 "为冥界的未来而战！"
yyk.105.2:0 "这是彻底粉碎颠覆分子的好机会！"
yyk.105.3:0 "我们必须支持冥界的革命势力！"
yyk.105.4:0 "我们不能容忍颠覆势力破坏冥界秩序！"
yyk.105.5:0 "似乎冥界也并不平静"

yyk.106.t:0 "冥界内战结束"
yyk.106.d:0 "旷日持久的冥界内战最终以我们的胜利而告终，然而这场胜利绝不是毫无代价的，冥界在内战中几乎完全被摧毁，社会和生产秩序都遭到了严重的破坏。此外，被我们击败的对手也不会就这么束手就擒，我们仍然需要很长时间来处理这些问题。"
yyk.106.1:0 "我们仍有许多事情要做"

yyk.107.t:0 "冥界内战结束"
yyk.107.d_kna_victory:0 "旷日持久的冥界内战结束了。尽管还有残存的抵抗，$YYK_oldorder_party_long$最终向$YYK_fandong_party_long$投降，$YYK_fandong_party_long$赢得了内战的胜利。\n\n出于对$YYK_oldorder_party_long$统治的不满，$YYK_fandong_party_long$从一个地下组织逐渐成长为能够公开挑战$YYK_oldorder_party_long$的势力，并最终在内战中击败了$YYK_oldorder_party_long$。组织的领袖$UND_kana$针对内战的胜利发表了一篇激动人心的演讲，并号召冥界积极投入战后重建。\n\n内战无疑给冥界带来的巨大的创伤，也许只有时间能够治愈。据悉，$YYK_fandong_party_long$正在讨论战后重建与对冥界未来规划的有关事宜。"
yyk.107.d_yko_victory:0 "旷日持久的冥界内战结束了。尽管还有残存的抵抗，$YYK_fandong_party_long$最终向$YYK_oldorder_party_long$投降，$YYK_oldorder_party_long$赢得了内战的胜利。\n\n冥界的地下组织$YYK_fandong_party_long$由于对$YYK_oldorder_party_long$的不满，公开挑战$YYK_oldorder_party_long$的统治。然而，$YYK_oldorder_party_long$仍然在内战中取胜。白玉楼的统治者$YYK_yyk$谴责了$YYK_fandong_party_long$对冥界造成的伤害，并再次强调的秩序的重要性。\n\n内战无疑给冥界带来的巨大的创伤，也许只有时间能够治愈。据悉，$YYK_oldorder_party_long$正在讨论战后重建与对冥界未来规划的有关事宜。"
yyk.107.d_default:0 "$bug_report_tt$"
yyk.107.1:0 "我们胜利了！"
yyk.107.2:0 "幻想乡革命再进一步"
yyk.107.3:0 "必须重视激进分子的威胁"
yyk.107.4:0 "然而革命之河仍然流淌"
yyk.107.5:0 "秩序重归冥界"

yyk.108.t:0 "冥界内战结束"
yyk.108.d:0 "我们选择在冥界内战中支持的派系赢得了内战，我国军队从战场上得到的经验将对我国的军事建设起到重要作用。"
yyk.108.1:0 "祝贺她们！"

yyk.109.t:0 "冥界内战结束"
yyk.109.d:0 "我们选择在冥界内战中支持的派系赢得了内战，我国军队从战场上得到的经验将对我国的军事建设起到重要作用。"
yyk.109.1:0 "祝贺她们！"

yyk.110.t:0 "反对者抵抗被消灭"
yyk.110.d:0 "我们境内的反对者抵抗基本被消灭，冥界再次成为了不可分割的整体。"
yyk.110.1:0 "太好了"

yyk.111.t:0 "冥界内战结束"
yyk.111.d:0 "旷日持久的冥界内战结束了。尽管还有残存的抵抗，$YYK_oldorder_party_long$最终向$YYK_fandong_party_long$投降，$YYK_fandong_party_long$赢得了内战的胜利。\n\n出于对$YYK_oldorder_party_long$统治的不满，$YYK_fandong_party_long$从一个地下组织逐渐成长为能够公开挑战$YYK_oldorder_party_long$的势力，并最终在内战中击败了$YYK_oldorder_party_long$。组织的领袖$UND_kana$针对内战的胜利发表了一篇激动人心的演讲，并号召冥界积极投入战后重建。\n\n内战无疑给冥界带来的巨大的创伤，也许只有时间能够治愈。据悉，$YYK_fandong_party_long$正在讨论战后重建与对冥界未来规划的有关事宜。"
yyk.111.1:0 "我们胜利了！"
yyk.111.2:0 "幻想乡革命再进一步"
yyk.111.3:0 "必须重视激进分子的威胁"

yyk.112.t:0 "冥界内战结束"
yyk.112.d:0 "旷日持久的冥界内战结束了。尽管还有残存的抵抗，$YYK_fandong_party_long$最终向$YYK_oldorder_party_long$投降，$YYK_oldorder_party_long$赢得了内战的胜利。\n\n冥界的地下组织$YYK_fandong_party_long$由于对$YYK_oldorder_party_long$的不满，公开挑战$YYK_oldorder_party_long$的统治。然而，$YYK_oldorder_party_long$仍然在内战中取胜。白玉楼的统治者$YYK_yyk$谴责了$YYK_fandong_party_long$对冥界造成的伤害，并再次强调的秩序的重要性。\n\n内战无疑给冥界带来的巨大的创伤，也许只有时间能够治愈。据悉，$YYK_oldorder_party_long$正在讨论战后重建与对冥界未来规划的有关事宜。"
yyk.112.1:0 "我们胜利了！"
yyk.112.2:0 "然而革命之河仍然流淌"
yyk.112.3:0 "秩序重归冥界"

kna.101.t:0 "激进支持者发动叛乱"
kna.101.d:0 "我们境内的部分激进支持者得到[KNA.GetName]的资助，在境内发起了公然叛乱！"
kna.101.1:0 "立即处理她们！"

kna.102.t:0 "西行寺家领导人的处置"
kna.102.d:0 "我们在冥界内战中取得了胜利，现在我们应当如何处置西行寺家的将领们？"
kna.102.1:0 "也许她们能帮助我们"
kna.102.2:0 "新冥界没有给她们的位置！"

kna.103.t:0 "[KNA.GetName]请求同盟"
kna.103.d:0 "在经历了冥界内战后，[KNA.GetName]的领导人[KNA.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
kna.103.1:0 "我们将并肩作战"
kna.103.2:0 "革命不需要她们"

kna.104.t:0 "[GEK.GetName]拒绝了同盟请求"
kna.104.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
kna.104.1:0 "我们也许只能依靠自己"

yko.101.t:0 "对军队的清洗"
yko.101.d:0 "随着内战的爆发，仍留在军队中的不忠诚分子成为了巨大的威胁，我们必须通过一场清洗解决军队的不忠诚问题。"
yko.101.1:0 "这是必要的代价"

yko.102.t:0 "叛乱领导人的处置"
yko.102.d:0 "我们在冥界内战中取得了胜利，现在我们应当如何处置叛乱的领导人？"
yko.102.1:0 "我们可以再给她一个机会"
yko.102.2:0 "我们不需要叛乱分子！"