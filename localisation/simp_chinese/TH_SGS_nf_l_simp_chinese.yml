SGS_xi_nan_yao_jing_ge_ming_jun_idea:0 "西南妖精革命军"
SGS_xi_nan_yao_jing_ge_ming_jun_idea_desc:0 "我国军队中的许多士兵来自经历过妖怪山战争的红魔馆军队，她们有着丰富的作战经验与坚定的作战意志，随时准备为保卫西南妖精领地的自由与和平而战。"
