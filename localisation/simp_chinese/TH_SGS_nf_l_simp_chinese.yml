GetSGS_lingshifaanzhengbing_1:0"\n§Y妖精征兵法案§!\n咱们的兵员暂时性不足了，咱们要紧急的填充一些妖精来进入我们这里，但是条件不好就没有妖精想要进入，所以在法案生效期间，咱们要给他们很多福利与补贴\n\n生活消费品工厂：§Y+8.0%§!\n适役人口修正：§G+15%§!\n适役人口：§Y1.00%§!"
GetSGS_lingshifaanzhengbing_2:0""
GetSGS_lingshifaangongye_1:0"\n§Y紧急工业法案§!\n咱们的工厂现在出现了一些人员短缺，咱们现在需要添加一些工厂的妖精，但是这样的话咱们就要牺牲一些其他的东西了\n\n适役人口修正：§R-15%§!\n工厂产出：§G+10.00%§!\n§Y民用工厂§!修建速度：§G+10.00%§!\n免费维修速度：§G+15.00%§!"
GetSGS_lingshifaangongye_2:0""
GetSGS_jingjijingling_1:0"\n§Y紧急禁令§!\n在咱们的领土里有一些坏蛋再搞破坏，一些人建议我们要戒严，比如让他们晚上禁止出栏什么什么的，来让那群家伙难以搞破坏和伤人\n\n适役人口修正：§R-15%§!\n工厂产出：§R-5.00%§!\n稳定度：§G+15.00%§!\n抵抗目标：§G-5%§!\n抵抗下降速度：§G+25%§!"
GetSGS_jingjijingling_2:0""
GetSGS_zhengshoufaan_1:0"\n§Y征收法案§!\n咱们最近需要征用一些东西来达成咱们的工业目标，但是为了防止他们有一些意见，因此咱们要把很多的事情用来处理他们的问题，让他们不会因为我们的一些财政紧缩挨饿或者是被其他妖精欺负\n\n稳定度：§G-5.00%§!\n生活消费品工厂：§Y-8.0%§!\n政治点数：§R-25%§!\n补给范围：§G+20%§!\n§Y基础设施§!修建速度：§G+10.00%§!"
GetSGS_zhengshoufaan_2:0""
GetSGS_zhengzhijizhongfaan_1:0"\n§Y政治集中法案§!\n我们现在的政治改革无法迅速实行，我们应该寻找一个办法来加速改革，我们需要更多的人力来帮忙参与政治...\n\n稳定度：§G+5.00%§!\n生活消费品工厂：§Y+2.0%§!\n政治点数：§G+25%§!\n适役人口修正：§R-10%§!"
GetSGS_zhengzhijizhongfaan_2:0""
GetSGS_yurenleijiaohao_1:0"\n§Y与人类交好§!\n我们需要更多的影响人类来帮助我们，我们现在要集中一些政治资源来进行外交工作\n\n稳定度：§R-5.00%§!\n政治点数：§R-5%§!\n每日人类影响力基础变化：§G0.03§!"
