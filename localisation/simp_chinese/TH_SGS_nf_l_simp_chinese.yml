SGS_jianlixinanyihuidasha_category_desc:0"固然，在军事意义上，我们已经统一了西南，但在过度扩张之后，我们的行政效率低下致使地方叛乱不断。当下，我们迫切地需要一个行政总部来巩固西南妖精联合在这一地区的行政影响力。不过，那个“日耳曼尼亚大厦”的大小实在过于夸张了，当下要建造如此巨大的工程对我们来说是不切实际的，但我们出色的工程师已经成功地将图纸缩小到了原来的五分之一，这使得我们的建造计划在理论上可以进行，而且，纵使这一建筑被等比例缩小了，但其规模对于幻想乡来说依然堪称奇观。当我们的国会大厦建成之后，整个西南，不，整个幻想乡都将以敬畏的姿态仰慕着我们伟大的事业\n\n修建进度：§Y[?SGS_jiandasha]§!%\n\n目前每周修建§Y[?SGS_jiandasha_meizhou]§!%\n\n目前增益效果：\n[GetSGS_xiudashaxiaoguo]"

