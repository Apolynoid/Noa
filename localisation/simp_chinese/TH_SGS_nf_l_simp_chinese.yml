SGS_jiquandu_category:0"集权"
SGS_jiquandu_category_desc:0"虽然妖精之间是平等的，但是每个妖精都有不同的行事准则，为了确保权力的集中，我们不得不与其他的派系展开合作。虽然我们妖精至上党在政府中话语权更高，妖精实业派所掌握的资本力量更不容小觑，与其合作虽然能有效集中权力，但使她们逐渐掌握权力的风险不亚于与虎谋皮。我们在与其合作时需要注意不让其掌握太多的力量。\n\n影响力：\n§g妖精至上党§!：§Y[?SGS_yaojingzhishangdang]§!%\n§C妖精实业团§!：§Y[?SGS_yaojingshiyetuan]§!%\n\n每周集权度增加：§Y[?SGS_jiquandu_meizhou]§!%\n\n集权度：§Y[?SGS_jiquandu]§!%\n\n目前集权度带来的效果：\n[GetSGS_jiquanxiaoguo]"

