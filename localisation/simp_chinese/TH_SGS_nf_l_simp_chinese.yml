SGS_jiefangyaojingtongbao_category:0"解放妖精同胞"
SGS_jiefangyaojingtongbao_category_desc:0"在西南，我们妖精已经翻身做了主人，建立了自己的国家。但是在幻想乡的其他地方，还有广大的妖精同胞在受到压迫，我们将解放幻想乡的所有妖精，完成妖精统一的大业。"

