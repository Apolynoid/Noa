SGS_DAWN_DESC:0 "在妖怪山战争中脱离红魔馆军队的妖精士兵与在人类惩罚战争中逃离故土的妖精难民在幻想乡西南会合，占领了一片原属于神明信仰联盟的土地，并受到雾之湖妖精联合体建立的鼓舞，建立了自己的妖精国家——今天被称为西南妖精联合。然而，两次战争带来的对战争的抵触与西南紧张局势所要求的战备政策相互冲突，此外，这片土地极低的工业化水平，也使西南妖精联合的国防准备雪上加霜。而神明信仰联盟公然宣称要夺回西南的土地，西南周边的其他势力也对这片土地虎视眈眈。西南妖精联合的妖精们能在战火中保卫这个新生的妖精国家的独立吗？"
introduce_SGS_page1:0 "§Y[SGS.GetName]§!原本是§Y[AKI.GetName]§!的领地，在138季的§Y妖怪山战争§!中，许多§Y[SCA.GetName]§!的妖精士兵因无法忍受僵化的指挥和极高伤亡率而脱离军队，在因战争废弃的土地上定居，这片区域即是今天的§Y[SGS.GetName]§!。妖怪山战争结束后，§Y[AKI.GetName]§!多次发动小规模冲突尝试夺回领土，但均被训练有素的妖精军队击退，经受战争摧残的§Y[AKI.GetName]§!也无力承担全面战争，§Y[SGS.GetName]§!区域事实上从§Y[AKI.GetName]§!独立。而在之后的§Y人类惩罚战争§!中，§Y[SEJ.GetName]§!与§Y魔法森林§!的冲突使得南雾之湖的大量妖精不得不作为战争难民离开，其中一部分，包括§Y光之三妖精§!，流亡到了西南，与先前脱离红魔馆的妖精会合。这两批妖精居民构成了今天§Y[SGS.GetName]§!的主要居民来源。§Y[CIR.GetName]§!的成立对西南的妖精也产生了巨大影响，她们开始模仿联合体的政治体制建立起了自己的国家与社会，同时推举在妖精中享有较高声望的§Y[SGS.GetLeader]§!作为领袖，§Y[SGS.GetName]§!从而正式成立，成为了幻想乡西南的第一个妖精国家。\n\n然而§Y[SGS.GetName]§!的成立并不是麻烦的结束。面对西南的复杂局势，妖精们必须建立一支常备军，这支常备军将仿照§Y[CIR.GetName]妖精革命军§!建立，称为§Y西南妖精革命军§!。由于§Y[SGS.GetName]§!居民中有许多前红魔馆士兵，这支军队的建立起初并没有遇到多少麻烦；但仅靠志愿者不足以满足国防需求，而真正的麻烦来自推行义务兵役制——过往战争的阴影仍然困扰着§Y[SGS.GetName]§!的居民，义务兵役制的推行受到了极大阻碍。另一方面，§Y[SGS.GetName]§!所占据的土地上几乎没有什么工业，尽快工业化以满足国防需求成为所有派系的共识。\n\n时间走向146季，§Y[AKI.GetName]§!公然宣称要夺回西南的土地，一场战争在所难免，而妖精们还没有为未来做好准备，决定§Y[SGS.GetName]§!未来发展方向的§Y西南妖精紧急会议§!即将召开。妖精们能在西南的混乱中保卫自己脆弱的新生国家吗？"
