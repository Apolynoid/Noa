SGS_bu_shou_huan_ying_de_wai_lai_shi_li_idea:0 "不受欢迎的外来势力"
SGS_bu_shou_huan_ying_de_wai_lai_shi_li_idea_desc:0 "作为一个新生国家，我国不仅得不到幻想乡的普遍承认，同时在国境内统治能力也受到广泛质疑。这无疑严重影响了社会的稳定与政府的行政能力。"
