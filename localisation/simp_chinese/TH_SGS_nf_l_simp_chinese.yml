SGS_zaitaiyanghuatianhuodong_category:0"在[YUK.GetName]的活动"
SGS_zaitaiyanghuatianhuodong_category_desc:0"统一西南幻想乡后，我们必须继续增强妖精在这片地区的影响力，从而扩大妖精的生存空间，并获取我们所需的资源、人力，与我们最迫切需要的“政治盟友”。[SGS.GetLeader]元首已经决定将扩张目标选定为太阳花田，我们所进行的每次行动都会帮助起义军在战斗开始的时候更具有优势，但这也会花费相当的资源——为了妖精的未来，这都是值当的。\n\n已有理念省份数量最大为§Y5§!，目前已有理念省份数量为§Y[?SGS_linianshengfen]§!\n\n可支援[YS1.GetName]§Y12§!支部队，目前已支援§Y[?SGS_junduishuliang]§!支部队"

SGS_chuanbolinian_decision:0"在§Y[FROM.GetName]§!传播理念"
SGS_chuanbolinian_decision_desc:0"向[YUK.GetName]国内传播我们的理念，同时[YUK.GetName]可以抵制传播。\n\n拥有§Y理念§!的地块将在未来我们挑起的起义中§G站在起义军一方§!"

SGS_xinaoyizu_category:0"对国内异族进行洗脑宣传"
SGS_xinaoyizu_category_desc:0"即便妖精已经统一西南幻想乡，我们的内部依然有不少势力对[SGS.GetLeader]元首的政策指手画脚，我们需要将这些异见者的思想掰正，并使他们的存在与言论对我们的治理更加有利，当然，至于用什么手段就不那么重要了。"

