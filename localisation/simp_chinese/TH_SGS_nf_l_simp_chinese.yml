SGS_zhongzulianhe_category_desc:0"在幻想乡中，单纯的妖精力量是远远不够的。而在西南，我们妖精群体始终是少数。为了更快速的统一西南，我们可以将部分其余种族的人才吸纳进政府部门，发挥他们的特长，以此来表达我们对种族平等的决心。联合西南所有的种族，成为一个国家，一个种族。\n\n各种族联合度：\n\n§Y草根妖怪：§G[?SGS_caogenyaoguai]%§!§!\n§Y神明：§G[?SGS_shenming]%§!§!\n§Y天狗：§G[?SGS_tiangou]%§!§!\n§Y河童：§G[?SGS_hetong]%§!§!\n§Y妖怪：§G[?SGS_yaoguai]%§!§!\n§Y妖精：§G[?SGS_yaojing]%§!§!\n§Y幽灵：§G[?SGS_youling]%§!§!\n§Y法师：§G[?SGS_fashi]%§!§!\n§Y人类：§G[?SGS_renlei]%§!§!\n§Y妖兽：§G[?SGS_yaoshou]%§!§!"

