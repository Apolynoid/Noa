SGS_DAWN_DESC:0"来自魔法森林的三月精，在战争毁了她们的家园后，被迫走上流亡的道路，并且在途中结实了不少“志同道合”的同胞。利用擅长的恶作剧占领了一处人类村落之后，内部却对将来的策划产生了新的分歧。在她们的周围，作为邻居的铃兰部落主动抛出同盟的橄榄枝，而不远处的神明信仰联盟正在疯狂扩张。独立的人类军阀，不安分的幽灵，每一个势力都盘算着在这混乱的时刻将对方的地盘纳为己有……这群独处异乡的妖精们正在迎来一个危机四伏的未来。"

