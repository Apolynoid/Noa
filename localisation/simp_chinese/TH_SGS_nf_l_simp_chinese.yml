SGS_chao_xin_xing_ji_hua_desc:0 "我国糟糕的工业水平完全无法应对西南的严峻形势。通过从预备役抽调人力用于一系列工业建设计划，我们能在最短时间内提升我国的工业水平，作为未来进一步工业发展的基础。然而，毫无疑问的，这样的快速建设会带来远超常规建设的伤亡……"
