SGS_zhan_zheng_de_yin_ying_idea:0 "战争的阴影"
SGS_zhan_zheng_de_yin_ying_idea_desc:0 "西南的这片妖精领地的主要居民构成是脱离红魔馆军队的前红魔馆士兵和在人类惩罚战争中躲避战乱的逃难者，战争的阴影仍然在她们心中挥之不去。"
