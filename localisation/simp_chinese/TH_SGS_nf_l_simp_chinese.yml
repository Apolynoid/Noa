SGS_xinanhuanxiangxianggongyehua_category:0"西南幻想乡工业化"
SGS_xinanhuanxiangxianggongyehua_category_desc:0"经过不懈的努力，我们妖精终于成为了西南唯一的政权。为了确保西南不在回到从前各方割据乱战的时代，我们必须确保自己拥有足够的实力，西南一直都是一片荒凉的土地，除了大片大片的原始土地以外一无所有，而对于一个强大的国家来说工业化是无法避免的问题。现如今国家处于内忧外患当中，建立属于我们的工业化只能靠我们自己。恰好的是在我们控制下的无缘冢有不少从外界流落来的工业废品，我们可以尝试收集并修复它们，以此来扩充我们的工业。\n\n目前工业化阶段：§Y[GetSGS_gongyehuanjieduan]§!\n[GetSGS_gongyehuajingdu]\n\n§C电量§!：§Y[?SGS_dianliang]§!\n\n§O废品量§!：§Y[?SGS_feipingliang]§!\n§g工业机械储备§!：§Y[?SGS_gongyejixie]§!"

