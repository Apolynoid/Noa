#decision
SGS_chao_xin_xing_ji_hua_category:0 "超新星计划"
SGS_chao_xin_xing_ji_hua_category_desc:0 "§Y超新星计划§!是旨在改善我国工业能力薄弱现状的一系列建设计划的总称。计划通过从预备役中抽调一部分人力用于工业建设，快速建立起基本的工业体系，从而为进一步的工业发展打下基础。建设计划只能在已经得到§Y充分勘探§!的地区执行。\n然而，计划紧凑的工期与我国基础建设能力的薄弱两者结合，导致建设过程中可能出现远超常规建设过程的§R伤亡率§!。由于这一计划成为了我国经济的焦点，公众会对建设过程中的伤亡感到§R不满§!，且随着每次建设过程中的伤亡人数增加而§R急剧增加§!。\n幸运的是，对于已经得到勘探而§Y未充分发展§!的地区，公众更能理解在这些地区建设所带来的伤亡。在这些地区的建设不仅造成的不满§G更低§!，而且还能改善当地的发展状况。\n\n当公众不满超过§Y100§!时，计划将迫于公众压力而中止。中止计划将§R同时中止§!所有正在进行中的建设计划。\n因公众不满导致计划中止时，还会造成§R稳定度损失§!。\n当前§R公众不满§!：§Y[?SGS_total_public_discontent]§!"
