l_simp_chinese:
 swe.5.t:0 "无缘冢的外界物品"
 swe.5.d:0 "无缘冢地区和外界的结界很稀薄，在这次危机发生以后，这里的外界物品的数量变得更多。尽管现在的幻想乡有必要接触一部分外界的东西，但这其中也有许多不利的东西。因此，我们有必要控制这一地区，虽然这并非我们作为贤者的主要职责，但为了幻想乡，需要筛选那些对幻想乡有利的物品。或许我们有必要征求一下当地妖怪的意见。"
 swe.5.1:0 "询问一下当地的妖怪。"
 swe.5.2:0 "不要干涉幻想乡的自然发展。"

 swe.6.t:0 "幻想乡的贤者想要控制无缘冢"
 swe.6.d:0 "幻想乡的贤者给我们发话，希望将无缘冢地区转交给她们，她们显然是想控制获取外界的物品的交通要道。所以我们应该怎么做？"
 swe.6.1:0 "贤者不应该随意干涉幻想乡的一切！"
 swe.6.2:0 "我们还是相信贤者的做法吧。"

 swe.7.t:0 "当地的妖怪拒绝了我们的建议"
 swe.7.d:0 "她们拒绝了我们的建议，想要独占当地的外界物品。我们应该怎么办？"
 swe.7.1:0 "为了幻想乡，我们不惜与她们为敌！"
 swe.7.2:0 "不要给幻想乡的人们留下不好的印象。"

 swe.8.t:0 "[OKI.GetName]对无缘冢地区的废品的控制"
 swe.8.d:0 "由于外界废品对幻想乡的不确定性，这次一直隐藏于幻想乡幕后的[OKI.GetName]，也就是[OKI.GetLeader]所领导的势力决定对幻想乡进行干涉。据说这不是她的主要职责，但在幻想乡的危机之下，她还是做出了这些改变。然而她试图控制外界废品来减少对幻想乡的负面的影响的行为，与当地的妖怪发生了一些不好的状况。。。"
 swe.8.1:0 "这是"贤者"吗?"
 swe.8.2:0 "这做得很对。"
 swe.8.3:0 "但我们也不想被贤者们过多的干扰。"

sw.101.t:0 "[state_to_explore.GetName]得到自发勘探"
sw.101.d:0 "我国志愿者自发完成了对[state_to_explore.GetName]地区的勘探，并向我们分享了这一区域的地形细节。"
sw.101.1:0 "感谢她们！"

sw.102.t:0 "西南爆发冲突"
sw.102.d:0 ""
sw.102.1:0 "神明将统治整个西南！"
sw.102.2:0 "神明在西南的统治到此为止了！"
sw.102.3:0 "意料之中"

sw.103.t:0 "[AKI.GetName]赢得西南冲突"
sw.103.d:0 ""
sw.103.1:0 "神明与信仰的胜利！"
sw.103.2:0 "看来神明在西南的统治依旧稳固"

sw.104.t:0 "反秋神联盟赢得西南冲突"
sw.104.d:0 ""
sw.104.1:0 "神明的统治结束了!"
sw.104.2:0 "出乎意料"

sw.106.t:0 "$southwest_mutual_defense_treaty$解散"
sw.106.d:0 "随着共同敌人的消失，为抵御共同敌人所组建的联盟的基础也消失了。"
sw.106.1:0 "就这样吧"

sw.107.t:0 "$southwest_mutual_defense_treaty$解散"
sw.107.d:0 ""
sw.107.1:0 "我们必须为自己而战"
sw.107.2:0 "而西南的未来仍在迷雾中"

sw.109.t:0 "西南霸权争夺"
sw.109.d:0 "国内统一西南的呼声越来越高，西南多个相互冲突的政权并立的局势不可能长久维持下去，一场战争在所难免。"
sw.109.1:0 "我们必须尽快做好准备"

sw.111.t:0 "西南冲突扩大化"
sw.111.d:0 ""
sw.111.1:0 "西南只能有一个胜利者！"
sw.111.2:0 "变换莫测的西南局势"

sw.112.t:0 "[SGS.GetName]赢得西南霸权"
sw.112.d:0 ""
sw.112.1:0 "我们胜利了！"
sw.112.2:0 "看来西南的胜利者暂时决定了"

sw.113.t:0 "[ZYD.GetName]赢得西南霸权"
sw.113.d:0 ""
sw.113.1:0 "我们胜利了！"
sw.113.2:0 "看来西南的胜利者暂时决定了"

sw.114.t:0 "[MEL.GetName]赢得西南霸权"
sw.114.d:0 ""
sw.114.1:0 "我们胜利了！"
sw.114.2:0 "看来西南的胜利者暂时决定了"
