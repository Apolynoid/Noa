l_simp_chinese:
sw.101.t:0 "[state_to_explore.GetName]得到自发勘探"
sw.101.d:0 "我国志愿者自发完成了对[state_to_explore.GetName]地区的勘探，并向我们分享了这一区域的地形细节。"
sw.101.1:0 "感谢她们！"

sw.102.t:0 "西南爆发冲突"
sw.102.d:0 "近日，[AKI.GetName]宣布，为了夺回在妖怪山战争中失去的领土，同时结束西南的混乱状态，[AKI.GetName]将采取武力手段统一西南。[AKI.GetName]与反秋神联盟之间的战线各处已经发生交火。\n\n西南在大结界危机后就一直处于低烈度的冲突中，[AKI.GetName]在妖怪山战争中损失了大量领土，对西南的控制力也遭到削弱，西南各势力趁机相互斗争，争夺西南的资源与统治权。在[SCA.GetName]的支持下，[AKI.GetName]迅速从战争创伤中恢复，并准备好成为西南唯一的统治者。\n\n幻想乡各势力纷纷向支持的西南势力派出援助，但普遍对反秋神联盟战胜[AKI.GetName]的可能性感到悲观。"
sw.102.1:0 "神明将统治整个西南！"
sw.102.2:0 "神明在西南的统治到此为止了！"
sw.102.3:0 "意料之中"

sw.103.t:0 "[AKI.GetName]赢得西南冲突"
sw.103.d:0 "近日，西南的冲突宣告结束，[AKI.GetName]成功击败了反秋神联盟，不仅夺回了丢失的领土，还彻底消灭了西南的威胁，成为了西南唯一的统治者。\n\n[AKI.GetName]在[SCA.GetName]的支持下迅速从妖怪山战争的创伤中恢复，并重新成为了西南地区实力最雄厚的势力。正如幻想乡所预计的，[AKI.GetName]击溃了西南的反对势力，登上了西南统治者的宝座。然而[AKI.GetName]的麻烦并没有就此消失，她们不仅需要尽快处理国内的反对声音，同时还要提防西南外的势力趁虚而入。不过不管怎么说，这场胜利对于[AKI.GetName]都是值得庆祝的。\n\n幻想乡的旧有强权纷纷向[AKI.GetLeader]发去了祝贺。"
sw.103.1:0 "神明与信仰的胜利！"
sw.103.2:0 "看来神明在西南的统治依旧稳固"

sw.104.t:0 "反秋神联盟赢得西南冲突"
sw.104.d:0 "近日，西南的冲突宣告结束，反秋神联盟击败了[AKI.GetName]，成功维护了自身的独立。\n\n[AKI.GetName]在[SCA.GetName]的支持下迅速从妖怪山战争的创伤中恢复，并重新成为了西南地区实力最雄厚的势力。出乎所有人的意料，反秋神联盟挫败了[AKI.GetName]的攻势，并进一步击溃了她们的军队，[AKI.GetName]不得不向反秋神联盟投降。然而反秋神联盟的麻烦并没有就此消失，随着共同敌人的消失，西南各个势力间的微妙平衡迅速瓦解，角逐西南最终统治权的战争不可避免。不过不管怎么说，这场胜利对于反秋神联盟都是值得庆祝的。\n\n幻想乡的新兴势力纷纷向各自支持的势力发去了祝贺。"
sw.104.1:0 "神明的统治结束了!"
sw.104.2:0 "出乎意料"

sw.106.t:0 "$southwest_mutual_defense_treaty$解散"
sw.106.d:0 "随着共同敌人的消失，为抵御共同敌人所组建的联盟的基础也消失了。"
sw.106.1:0 "就这样吧"

sw.107.t:0 "$southwest_mutual_defense_treaty$解散"
sw.107.d:0 "随着西南冲突的结束，[AKI.GetName]被击败，因防御[AKI.GetName]而建立的$southwest_mutual_defense_treaty$失去了存在的意义，近日正式宣告解散。\n\n$southwest_mutual_defense_treaty$在[AKI.GetName]进攻西南的压力下成立，目的在于更好的协调反秋神联盟成员间的军事协作。然而，随着[AKI.GetName]威胁的解除，西南各势力间争夺统治权的战争在所难免，这一临时性的防御联盟迅速瓦解了。西南的各势力都在紧张的为下一场战争做准备，同时还要提防来自西南以外的挑战者。\n\n幻想乡的各势力正在重新挑选心仪的西南代理人，西南势力也在尽力争取幻想乡强权的支持，外交上的战争先于军事冲突开始了。"
sw.107.1:0 "我们必须为自己而战"
sw.107.2:0 "而西南的未来仍在迷雾中"

sw.109.t:0 "西南霸权争夺"
sw.109.d:0 "国内统一西南的呼声越来越高，西南多个相互冲突的政权并立的局势不可能长久维持下去，一场战争在所难免。"
sw.109.1:0 "我们必须尽快做好准备"

sw.111.t:0 "西南冲突扩大化"
sw.111.d:0 "在战胜神明信仰联盟后，西南各势力间的停战近日被打破，各国前线已经发生交火，争夺西南统治权的战争开始了。\n\n大结界危机后，西南长期处于分裂状态中，各势力间的冲突与战争时常发生。虽然神明信仰联盟统一西南的尝试失败了，但在幻想乡逐渐变得复杂动荡的局势下，西南急需得到统一成为了西南所有势力的共识。在短暂的休战期后，决定西南最终胜利者的战争终于在近日打响了。各方势力都在尽可能完成战争动员与争取外部支持，而幻想乡各强权的人员与武器援助也在源源不断的流向西南。\n\n这场战争的胜利者也许能决定西南的未来，又或者西南的局势未来还将有新的变数？"
sw.111.1:0 "西南只能有一个胜利者！"
sw.111.2:0 "变换莫测的西南局势"

sw.112.t:0 "[SGS.GetName]赢得西南霸权"
sw.112.d:0 "西南混战近日走向尾声，随着最后的反对势力投降，有组织的抵抗已经不复存在，[SGS.GetName]成为了西南混战最终的胜利者。\n\n大结界危机后，西南长期处于分裂状态中，各势力间的冲突与战争时常发生。即使神明信仰联盟统一西南的尝试失败了，西南仍然没有迎来和平，而是陷入了另一场混战中。最终，[SGS.GetName]成功战胜了所有敌人，成为了西南混战的赢家。尽管幻想乡的局势依然动荡，[SGS.GetName]国内仍然举行了盛大的仪式来庆祝这场来之不易的胜利。\n\n支持[SGS.GetName]的部分势力向[SGS.GetName]送去了官方祝贺，而幻想乡其他势力的态度尚不明确。据传闻称，[SGS.GetName]正在与盟友暗中商讨西南的未来规划。"
sw.112.1:0 "我们胜利了！"
sw.112.2:0 "看来西南的胜利者暂时决定了"

sw.113.t:0 "[ZYD.GetName]赢得西南霸权"
sw.113.d:0 "西南混战近日走向尾声，随着最后的反对势力投降，有组织的抵抗已经不复存在，[ZYD.GetName]成为了西南混战最终的胜利者。\n\n大结界危机后，西南长期处于分裂状态中，各势力间的冲突与战争时常发生。即使神明信仰联盟统一西南的尝试失败了，西南仍然没有迎来和平，而是陷入了另一场混战中。最终，[ZYD.GetName]成功战胜了所有敌人，成为了西南混战的赢家。尽管幻想乡的局势依然动荡，[ZYD.GetName]国内仍然举行了盛大的仪式来庆祝这场来之不易的胜利。\n\n支持[ZYD.GetName]的部分势力向[ZYD.GetName]送去了官方祝贺，而幻想乡其他势力的态度尚不明确。据传闻称，[ZYD.GetName]正在与盟友暗中商讨西南的未来规划。"
sw.113.1:0 "我们胜利了！"
sw.113.2:0 "看来西南的胜利者暂时决定了"

sw.114.t:0 "[MEL.GetName]赢得西南霸权"
sw.114.d:0 "西南混战近日走向尾声，随着最后的反对势力投降，有组织的抵抗已经不复存在，[MEL.GetName]成为了西南混战最终的胜利者。\n\n大结界危机后，西南长期处于分裂状态中，各势力间的冲突与战争时常发生。即使神明信仰联盟统一西南的尝试失败了，西南仍然没有迎来和平，而是陷入了另一场混战中。最终，[MEL.GetName]成功战胜了所有敌人，成为了西南混战的赢家。尽管幻想乡的局势依然动荡，[MEL.GetName]国内仍然举行了盛大的仪式来庆祝这场来之不易的胜利。\n\n幻想乡各方势力的态度尚不明确，但均对于这一结果感到惊讶。据传闻称，[MEL.GetName]内部正在讨论西南的未来规划。"
sw.114.1:0 "我们胜利了！"
sw.114.2:0 "看来西南的胜利者暂时决定了"

sw.115.t:0 "[YUK.GetName]介入西南"
sw.115.d:0 "近日，[YUK.GetLeader]发表声明，考虑到西南局势的影响，[YUK.GetName]将介入西南局势，以保障幻想乡西南地区的和平。[YUK.GetName]与西南之间的战争已经打响，前线上已经发生交火。\n\n即使在大结界危机后，[YUK.GetName]仍然没有参与到幻想乡的混战中，坚持置身事外。但西南的混乱显然挑动了[YUK.GetName]敏感的神经，[YUK.GetLeader]声称，出于对西南局势的担忧，[YUK.GetName]最终不得不决定采取武力措施彻底解决西南问题。战争各方将这场战争称为“解决西南问题的最终之战”，但士兵似乎普遍对此感到悲观。\n\n考虑到西南先前的历次战争，这场战争似乎并不让人意外。幻想乡各方势力目前尚未对此作出评论。"
sw.115.1:0 "向西南进军！"
sw.115.2:0 "我们会给她们教训！"
sw.115.3:0 "西南棋局的新玩家"

sw.116.t:0 "[YUK.GetName]在西南取得胜利"
sw.116.d:0 "在漫长的战争后，西南终于迎来了暂时的平静。西南的战争终于告一段落，[YUK.GetName]战胜了所有敌人，有组织的抵抗已经全部消失。\n\n自从大结界危机以来，西南长期处于分裂状态中，各势力间的冲突与战争时常发生。而人类惩罚战争后，西南更是连续陷入多场大规模战争，西南势力与周边势力为了西南的统治权陷入了旷日持久的争斗。现在，随着[YUK.GetName]的胜利，饱受战争创伤的西南终于可以迎来短暂的休息了。[YUK.GetLeader]承诺将会尽快完成战争重建，并呼吁幻想乡各方势力援助西南的重建工程。\n\n考虑到幻想乡的当前局势，幻想乡各方势力显然有比西南更重要的事情关心。"
sw.116.1:0 "理所应当的胜利"
sw.116.2:0 "西南的新主人"

sw.117.t:0 "[SW_final_survivor]击败[YUK.GetName]"
sw.117.d:0 "在漫长的战争后，西南终于迎来了暂时的平静。西南的战争终于告一段落，[SW_final_survivor]战胜了所有敌人，有组织的抵抗已经全部消失。\n\n自从大结界危机以来，西南长期处于分裂状态中，各势力间的冲突与战争时常发生。而人类惩罚战争后，西南更是连续陷入多场大规模战争，西南势力与周边势力为了西南的统治权陷入了旷日持久的争斗。现在，随着[SW_final_survivor]的胜利，饱受战争创伤的西南终于可以迎来短暂的休息了。[SW_final_survivor]发言人承诺将会尽快完成战争重建，并呼吁幻想乡各方势力援助西南的重建工程。\n\n考虑到幻想乡的当前局势，幻想乡各方势力显然有比西南更重要的事情关心。"
sw.117.1:0 "我们对西南的统治坚不可摧！"
sw.117.2:0 "挑战者的失败"
