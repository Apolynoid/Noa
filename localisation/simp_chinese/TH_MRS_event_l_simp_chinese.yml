l_simp_chinese:
# 魔法之森魔女大会（召开魔女大会）
mrs.101.t:0 "魔法之森魔女大会"
mrs.101.d:0 "由于我们在人类复权战争中战败，魔法之森不得不接受十分苛刻的停战条件，从而使我们目前陷入了十分不利的局面。当务之急是选举出能够领导魔法之森走出危机的领导人，即“大魔女”。目前，大魔女的候选人有三位：\n\n矢田寺成美主张魔法使与魔法之森中的其他种族建立平等关系，让其他种族真正融入魔法之森中，但她的这一想法遭到了来自先天魔法使的批评，认为是鬼人正邪“下克上”思想的魔法森林化。\n雾雨魔理沙主张维持现状，并尽可能的使魔法之森置身于幻想乡的纷争之外。虽然许多人对这一想法并不赞同，但魔理沙的威望仍然为她赢得了许多支持者。\n爱丽丝·玛格特罗伊德主张通过改良手段解决魔法之森的问题，通过保留其他种族的自治权逐步稳固魔法森林的事态。然而，一些激进主张者对这一过于温和与缓慢的进程感到不满，并质疑这一主张的可行性。\n\n现在魔女大会即将闭幕，会上推举出的大魔女是..."
mrs.101.1:0 "雾雨魔理沙"
mrs.101.2:0 "矢田寺成美"
mrs.101.3:0 "爱丽丝·玛格特罗伊德"

# 爱丽丝叛乱
mrs.102.t:0 "爱丽丝·玛格特罗伊德公开叛乱！"
mrs.102.d:0 "在一系列的谈判破裂后，人偶师爱丽丝·玛格特罗伊德公开表示[MRS.GetLeader]没有能力作为魔法之森的大魔女领导魔法之森，并公然发起叛乱拒绝接受[MRS.GetLeader]的领导。一场内战似乎不可避免..."
mrs.102.1:0 "叛徒！"
mrs.102.2:0 "（作为人偶师协会继续游戏）"

# 成美叛乱
mrs.103.t:0 "矢田寺成美公开叛乱！"
mrs.103.d:0 "在一系列的谈判破裂后，地藏矢田寺成美公开表示[MRS.GetLeader]没有能力作为魔法之森的大魔女领导魔法之森，并公然发起叛乱拒绝接受[MRS.GetLeader]的领导。一场内战似乎不可避免..."
mrs.103.1:0 "叛徒！"
mrs.103.2:0 "（作为魔法之森联合体继续游戏）"

# 成美 与爱丽丝谈判（尝试接触爱丽丝）（兽道战争胜利）
mrs.104.t:0 "尝试与爱丽丝接触"
mrs.104.d:0 "在谈判中，爱丽丝·玛格特罗伊德提出了暂时保留部分先天魔法使特权，以温和手段推进种族平等化的要求。"
mrs.104.1:0 "我们会接受她们的要求"
mrs.104.2:0 "绝不可能！"

# 成美 与爱丽丝谈判（尝试接触爱丽丝）（兽道战争失败）
mrs.105.t:0 "尝试与爱丽丝接触"
mrs.105.d:0 "在谈判中，爱丽丝·玛格特罗伊德对我们在兽道战争中的表现感到愤怒，并拒绝进行任何进一步的谈判。"
mrs.105.1:0 "那就这样吧"

# 爱丽丝 与成美谈判（尝试接触成美）（兽道战争胜利）
mrs.106.t:0 "尝试与成美接触"
mrs.106.d:0 "在谈判中，矢田寺成美提出了尽快推进激进的种族平等政策，并进一步减少先天魔法使特权的要求。"
mrs.106.1:0 "我们会接受她们的要求"
mrs.106.2:0 "绝不可能！"

# 爱丽丝 与成美谈判（尝试接触成美）（兽道战争失败）
mrs.107.t:0 "尝试与成美接触"
mrs.107.d:0 "在谈判中，矢田寺成美对我们在兽道战争中的表现感到愤怒，并拒绝进行任何进一步的谈判。"
mrs.107.1:0 "那就这样吧"

# 避免内战
mrs.108.t:0 "内战的风险消失了"
mrs.108.d:0 "尽管魔法之森数次处于内战的边缘，我们仍然成功的通过谈判与妥协避免了内战。"
mrs.108.1:0 "太好了"

# 内战准备
mrs.111.t:0 "魔法之森陷入紧张对峙"
mrs.111.d:0 "近日，由于不满于现任大魔女的部分政策，魔法之森内的一部分激进分子公开宣布反对[MRS.GetLeader]的统治。魔法之森已经陷入紧张对峙状态，一场内战似乎不可避免。\n\n当事各方均拒绝对现状发表看法。"
mrs.111.1:0 "该来的总会来的"
mrs.111.2:0 "她们能不能消停会？"

# 内战爆发
mrs.112.t:0 "魔法之森爆发内战"
mrs.112.d:0 "随着魔法之森对峙局势的发展，魔法之森的各方势力最终选择通过内战的形式解决问题。近日，魔法之森内战打响，这对整个幻想乡局势的影响还有待观察。\n\n这场战争是否能如交战各方所想象的，成为终结魔法之森混乱的战争，亦或者只是另一场混乱的开端？\n\n我们拭目以待。"
mrs.112.1:0 "我们会取得胜利！"
mrs.112.2:0 "果然..."

# 内战结束
mrs.113.t:0 "魔法之森内战结束"
mrs.113.d:0 "经历了漫长的内战后，和平终于回到了魔法之森。随着最后一支敌对武装缴械投降，这场内战的胜利者终于可以将执政重心转移到战后的重建上。\n\n然而，可以想到的是，内战的余波不会这么轻易的散去，胜利者仍需要足够的时间来抚平内战给魔法之森带来的伤痕。"
mrs.113.1:0 "我们胜利了！"
mrs.113.2:0 "结束了"

# 民兵解散
mrs.114.t:0 "民兵组织解散"
mrs.114.d:0 "随着魔法之森内战的结束，动员起来的民兵开始陆续返回自己的工作岗位。"
mrs.114.1:0 "让我们欢迎英雄归来"

# 民兵志愿者
mrs.115.t:0 "志愿者组建民兵"
mrs.115.d:0 "随着魔法之森局势趋于紧张，一部分我们的支持者自发的组建了民兵部队并愿意参与战斗。"
mrs.115.1:0 "欢迎！"

# 魔理沙 与成美谈判（争取成美支持）（兽道战争失败）（未支持爱丽丝）
mrs.116.t:0 "尝试与成美接触"
mrs.116.d:0 "在谈判中，矢田寺成美要求尽快推进激进的种族平等政策，并彻底取消先天魔法使特权。"
mrs.116.1:0 "我们最好做出忍让"
mrs.116.2:0 "这太过分了"

# 魔理沙 与爱丽丝谈判（争取爱丽丝支持）（兽道战争失败）（未支持成美）
mrs.117.t:0 "尝试与爱丽丝接触"
mrs.117.d:0 "在谈判中，爱丽丝·玛格特罗伊德要求保留部分先天魔法使特权，渐进推进种族平等化。"
mrs.117.1:0 "我们最好做出忍让"
mrs.117.2:0 "这太过分了"

# 民兵志愿者
mrs.118.t:0 "志愿者组建民兵"
mrs.118.d:0 "随着魔法之森局势趋于紧张，一部分我们的支持者自发的组建了民兵部队并愿意参与战斗。"
mrs.118.1:0 "欢迎！"

# 内战 傀儡离开
mrs.122.t:0 "附庸国脱离控制"
mrs.122.d:0 "由于国内形势动荡不安，我们的附庸国开始脱离我们的控制。"
mrs.122.1:0 "可恶！"

# 内战 傀儡离开（傀儡）
mrs.123.t:0 "脱离宗主国[MRS.GetName]控制"
mrs.123.d:0 "由于[MRS.GetName]国内局势不断恶化，我们有机会趁机脱离宗主国[MRS.GetName]的控制。"
mrs.123.1:0 "太好了！"

# 内战 傀儡回归
mrs.124.t:0 "附庸国回归控制"
mrs.124.d:0 "局势平息后，在我们的压力下，曾经的附庸国同意重新回归我们的势力圈。"
mrs.124.1:0 "太好了！"

# 内战 傀儡回归（傀儡）
mrs.125.t:0 "回归宗主国控制"
mrs.125.d:0 "魔法之森内战结束后，宗主国向我们施加压力，我们不得不重新成为附庸国。"
mrs.125.1:0 "只能这样"

# SEJ NAR请求加入同盟
mrs.126.t:0 "[MRS.GetName]请求同盟"
mrs.126.d:0 "[MRS.GetName]的领导人[MRS.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
mrs.126.1:0 "我们将并肩作战"
mrs.126.2:0 "革命不需要她们"

# SEJ 请求被拒绝
mrs.128.t:0 "[GEK.GetName]拒绝了同盟请求"
mrs.128.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
mrs.128.1:0 "我们也许只能依靠自己"

# SCA MRS请求加入同盟
mrs.130.t:0 "[MRS.GetName]请求同盟"
mrs.130.d:0 "[MRS.GetName]的领导人[MRS.GetLeader]请求加入我们的阵营，希望共同恢复幻想乡的稳定与和平。"
mrs.130.1:0 "我们欢迎她们加入"
mrs.130.2:0 "我们不能答应这项请求"

# 请求被拒绝
mrs.131.t:0 "[SCA.GetName]拒绝了同盟请求"
mrs.131.d:0 "尽管我们尽了最大的努力，[SCA.GetName]仍然拒绝与我们构建同盟关系的请求。"
mrs.131.1:0 "我们也许只能依靠自己"

# HKR MRS请求联邦
mrs.132.t:0 "[MRS.GetName]请求构建联邦"
mrs.132.d:0 "我们的旧盟友，[MRS.GetName]的领导人[MRS.GetLeader]表示，希望我们两国能够构建一个联邦，以求在乱世的幻想乡中求得生存。"
mrs.132.1:0 "就像大结界战争前那样！"
mrs.132.2:0 "我们不能答应这项请求"

# 请求被拒绝
mrs.133.t:0 "[HKR.GetName]拒绝了联邦请求"
mrs.133.d:0 "也许是我们的要求过于激进，[HKR.GetName]不愿意与我们构成联邦。"
mrs.133.1:0 "真遗憾"

# 联邦请求被同意
mrs.136.t:0 "[HKR.GetName]同意了联邦请求"
mrs.136.d:0 "[HKR.GetName]同意了与我们组建联邦的请求，我们将在同一面旗帜下并肩作战。"
mrs.136.1:0 "就像之前那样！"

# TKM MRS请求加入同盟
mrs.137.t:0 "[MRS.GetName]请求同盟"
mrs.137.d:0 "[MRS.GetName]的领导人[MRS.GetLeader]请求加入我们的阵营，希望共同为一个和平、进步的幻想乡而努力。"
mrs.137.1:0 "我们欢迎她们加入"
mrs.137.2:0 "我们不能答应这项请求"

# 请求被拒绝
mrs.138.t:0 "[TKM.GetName]拒绝了同盟请求"
mrs.138.d:0 "尽管我们尽了最大的努力，[TKM.GetName]仍然拒绝与我们构建同盟关系的请求。"
mrs.138.1:0 "我们也许只能依靠自己"

mrs.139.t:0 "[MRS.GetName]的建立"
mrs.139.d:0 "近日，博丽神社宣布接受了魔法森林方面的联邦提议，两国将整合成为一个联邦，即[MRS.GetName]。相关发言人声称，两国联邦化的尝试将有助于弥合幻想乡的裂痕。\n\n在大结界危机以前，博丽巫女与$MRS_mrs$一直致力于解决异变，维护幻想乡的稳定，然而大结界的波动与人类复权战争彻底改变了幻想乡，博丽神社与魔法森林均在战后遭到制裁，两位异变解决者的威望也一落千丈。如今，两国重新考虑联邦化事宜，也许会让许多幻想乡国家回想起大结界危机前的幻想乡，许多国家发来了礼节性的祝贺。\n\n相关的政权合并与移交的文书工作仍在进行中。联邦的民众正在庆祝新联邦的成立。而其他国家将其视为恢复旧日幻想乡的注定失败的尝试。"
mrs.139.1:0 "我们将在幻想乡并肩而立"
mrs.139.2:0 "似乎有些东西是不变的"