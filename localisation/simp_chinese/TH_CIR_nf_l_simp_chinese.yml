CIR_lian_he_ti_zheng_zhi_zhuang_kuang_idea_desc:0 "[CIR.GetName]，作为幻想乡的一个新兴政权，作为从[SCA.GetName]赢得独立，而在政治上又不愿采用帝国的旧制度的国家，需要一定的时间和努力来建立一个稳定的政治体系。"
