l_simp_chinese:
NTR_DAWN_DESC:0 "天狗在妖怪山战争中的失败震惊了整个幻想乡，而对战争结果与天魔彻底失望的天狗发起了革命，建立了天狗共和国。河童作为天狗的传统盟友，在受到天魔的出卖后，也开始对旧有等级制度产生了强烈的不信任。受到天狗革命的鼓舞，河童中的革命派也宣布了河童共和国的成立，并同样宣称自己为代表河童的唯一合法政府。\n然而，正如天狗革命一样，河童革命也由于守矢神社和天界的支持未能彻底完成，形成了河童共和国和河童长老会两个势力对峙的局面。作为天狗共和国的兄弟共和国，河童共和国的命运又将走向何方？"
