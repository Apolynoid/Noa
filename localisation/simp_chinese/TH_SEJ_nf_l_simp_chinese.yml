SEJ_xia_ke_shang_yong_bu_ting_xie:0 "下克上永不停歇"
SEJ_xia_ke_shang_yong_bu_ting_xie_desc:0 "在先前的战争中，我们已经战胜了看似不可战胜的敌人，向全幻想乡展示了叛乱同盟的伟大力量。现在，全幻想乡的压迫者们都将在同盟面前发抖，而同盟的每一个人都会团结在下克上的旗帜之下！"
SEJ_quan_huan_xiang_xiang_xia_ke_shang:0 "全幻想乡下克上"
SEJ_quan_huan_xiang_xiang_xia_ke_shang_desc:0 "我们虽然在叛乱同盟内初步实践了下克上理念，但我们的目光与脚步绝不能仅仅局限在叛乱同盟的边界以内。我们必须向幻想乡与其他世界仍在坚持反抗的弱者提供必要的支援。"
