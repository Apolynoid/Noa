SEJ_chu_li_fan_dui_pai_desc:0 "虽然我们在政治斗争中取得了胜利，但是与我们意见相左的反对派绝不会就此善罢甘休。无论用何种手段，我们必须尽快处理这些反对派带来的问题，[SEJ.GetName]才能开始处理其他的有关事务。"
