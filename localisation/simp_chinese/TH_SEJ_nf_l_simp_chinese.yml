SEJ_gekokujyo_movement_buff_tooltip_delayed:0 "§L下克上革命运动是由叛乱同盟发起的合作组织，旨在从经济与军事上促进反对现有大妖怪秩序的国家间的合作。革命运动成员国通过下辖的经济、军事、科技交流组织进行沟通，最终目的是强化各成员国的经济军事能力，将激进理念传播至全乡。§!"
