SEJ_jian_chi_xia_ke_shang_dao_lu:0 "坚持下克上道路"
SEJ_jian_chi_xia_ke_shang_dao_lu_desc:0 "叛乱同盟是为了保护幻想乡的弱者，推翻大妖怪，实现下克上理想而建立的，过去是，现在是，将来也是。叛乱同盟将坚持下克上的理念，永远做幻想乡受压迫者的坚实堡垒。"
SEJ_zheng_tong_xia_ke_shang_dao_lu:0 "正统下克上道路"
SEJ_zheng_tong_xia_ke_shang_dao_lu_desc:0 ""
SEJ_fen_hua_yao_guai_zhong_zu_pai:0 "分化妖怪种族派"
SEJ_fen_hua_yao_guai_zhong_zu_pai_desc:0 "显然，并不是叛乱同盟中的每一个妖怪都理解我们的下克上理念。许多妖怪只是把联盟看作是又一个妖怪种族的国家，其中一些妖怪甚至公开表达了对下克上理念的不认同。不过，通过争取一部分愿意接受我们理念的种族派妖怪，我们能够大幅削弱种族派的影响力。"
