SEJ_xia_ke_shang_tong_meng_desc:0 "想要下克上的火炬传递下去，我们就不能只将目光限定在[SEJ.GetName]内。我们必须向全幻想乡乃至其他世界传递下克上的理念，必要时给予与我们理念相同或者相近的盟友必要的支持，才能真正实现彻底的下克上。"
