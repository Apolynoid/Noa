SEJ_pan_luan_tong_meng_nei_zhan_desc:0 "为了实现妖怪种族复兴的理想，一次彻底的内战是不可避免的。通过充分的事前准备与合理的策略，加上足够的勇气与信念，我们能够在不利条件下赢得这场内战。\n\n内战开始时的§A新规§!支持率决定了联盟中愿意在内战中支持我们的区域比例，而§Y军队渗透率§!决定了现存军队中愿意支持我们的比例。\n现在的§Y军队渗透率§!：[?SEJ.SEJ_army_infiltration]%。"
