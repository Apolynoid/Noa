SEJ_faction_leader_tt:0 "§Y下克上革命运动-阵营领袖§!\n阵营中每个其他尚未投降或流亡的国家（当前有[?SEJ.SEJ_faction_member_num|.0Y]个）都将为你提供加成（上限为20）。当阵营成员发生变动时，加成变化可能需要一周生效。\n当前加成为：\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：[?SEJ.SEJ_leader_buff_building|.1%+]\n$MODIFIER_CONSUMER_GOODS_FACTOR$：[?SEJ.SEJ_leader_buff_consumer|.1%Y]\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：[?SEJ.SEJ_leader_buff_factory|.1%+][SEJ_get_leader_military_buff_tt]"
SEJ_faction_member_tt:0 "§Y下克上革命运动-成员国§!\n阵营中每个其他尚未投降或流亡的国家（当前有[?SEJ.SEJ_faction_member_num|.0Y]个）都将为你提供加成（上限为10）。当阵营成员发生变动时，加成变化可能需要一周生效。\n当前加成为：\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：[?SEJ.SEJ_member_buff_building|.1%+]\n$MODIFIER_CONSUMER_GOODS_FACTOR$：[?SEJ.SEJ_member_buff_consumer|.1%Y]\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：[?SEJ.SEJ_member_buff_factory|.1%+][SEJ_get_member_military_buff_tt]"
