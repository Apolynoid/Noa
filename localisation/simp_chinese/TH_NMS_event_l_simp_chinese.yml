l_simp_chinese:
nms.101.t:0 "[NMS.GetName]的派系斗争"
nms.101.d:0 "[NMS.GetName]在人类惩罚战争中作为妖怪联军的主要成员，为妖怪联军的胜利做出了巨大贡献，也因此在战后成为了幻想乡的主要势力。然而，也正是因为如此，[NMS.GetName]在战后几乎失去了所有人类信徒，而不得不大量吸收妖怪进入[NMS.GetName]。因此，虽然[NMS.GetName]原本是一个修习佛法的寺庙，但许多被吸纳的妖怪并不认同佛教理念，只是单纯被[NMS.GetName]的强大所吸引。她们与原本就在[NMS.GetName]中修行，认同佛法理念的妖怪在理念上产生了冲突，命莲寺因此分为了两大派系。\n\n改良派指的是认同佛法理念的妖怪派系，她们支持$NMS_bkr$的佛教理念，同时也认为仍然存在妖人和平的可能性，并愿意在战后保持与人类的接触，试图通过吸收人类的科技力量维护[NMS.GetName]的稳定。\n\n种族派则指被[NMS.GetName]的强大所吸引的妖怪，她们以$NMS_murasa$为领袖，相较于佛教理念，她们对如何利用[NMS.GetName]的强大实力扩大影响力更感兴趣，她们虽然名义上仍然支持$NMS_bkr$，但却在根本理念上与改良派相左。\n\n随着宗教危机的进一步加剧，两派之间的摩擦逐渐升温……"
nms.101.1:0 "[NMS.GetName]的未来立于悬崖之上"

nms.102.t:0 "改良派发起内战"
nms.102.d:0 "由于对我们现在实施政策的不满，改良派发起了一场叛乱并公开挑战我们的合法性。"
nms.102.1:0 "糟糕"

nms.103.t:0 "种族派发起内战"
nms.103.d:0 "由于对我们现在实施政策的不满，种族派发起了一场叛乱并公开挑战我们的合法性。"
nms.103.1:0 "糟糕"

nms.104.t:0 "内战中敌对领导人的处置"
nms.104.d:0 "我们赢得了内战，并俘获了敌对方的领导人，现在我们需要决定如何处置她们。"
nms.104.1:0 "我们仍然欢迎她们"
nms.104.2:0 "新的[NMS.GetName]不需要她们"

nms.105.t:0 "[NMS.GetName]请求同盟"
nms.105.d:0 "[NMS.GetName]的领导人[NMS.GetLeader]请求加入我们的阵营，希望共同恢复幻想乡的稳定与和平。"
nms.105.1:0 "我们欢迎她们加入"
nms.105.2:0 "我们不能答应这项请求"

nms.106.t:0 "[SCA.GetName]拒绝了同盟请求"
nms.106.d:0 "尽管我们尽了最大的努力，[SCA.GetName]仍然拒绝与我们构建同盟关系的请求。"
nms.106.1:0 "我们也许只能依靠自己"

nms.107.t:0 "[NMS.GetName]希望与我国展开合作"
nms.107.d:0 "[NMS.GetName]的领导人[NMS.GetLeader]希望与我国签订一份互不侵犯条约，同时举行两国间的技术交流活动。"
nms.107.1:0 "一份有趣的提议"
nms.107.2:0 "我们不能冒这种风险"

nms.108.t:0 "[SCA.GetName]同意签订条约"
nms.108.d:0 "在我们的努力下，[SCA.GetName]同意与我国签订互不侵犯条约，并做好了技术交流的准备。"
nms.108.1:0 "各取所需"

nms.109.t:0 "[SCA.GetName]拒绝签订条约"
nms.109.d:0 "尽管我们尽了最大的努力，[SCA.GetName]仍然拒绝与我们签订互不侵犯条约。"
nms.109.1:0 "这只能说明她们另有所谋"

nms.110.t:0 "[SRB.GetName]问题的解决方案"
nms.110.d:0 "[SRB.GetName]作为与我们信仰不同的宗教势力，在幻想乡也有一定的影响力，现在我们应当如何处理与[SRB.GetName]之间的关系？"
nms.110.1:0 "重新请求组建联邦"
nms.110.2:0 "要求她们臣服"
nms.110.3:0 "武力是唯一的解决方案"

nms.111.t:0 "[NMS.GetName]希望与我们重新组建联邦"
nms.111.d:0 "[NMS.GetName]的领导人[NMS.GetLeader]希望与我国重新组建联邦，以便共同恢复幻想乡的稳定与和平。"
nms.111.1:0 "我们会共同维护幻想乡的和平"
nms.111.2:0 "联邦已经是过去时了"

nms.112.t:0 "[NMS.GetName]要求我们臣服"
nms.112.d:0 "[NMS.GetName]的领导人[NMS.GetLeader]要求我国臣服，成为[NMS.GetName]的保护国。"
nms.112.1:0 "我们最好不要招惹她们"
nms.112.2:0 "我们决不承认此等侮辱"

nms.113.t:0 "[SRB.GetName]拒绝了我们的要求"
nms.113.d:0 "尽管我们尽了最大的努力，[SRB.GetName]仍然拒绝了我们合理的提议。"
nms.113.1:0 "她们清楚这意味着什么"

nms.114.t:0 "[SRB.GetName]同意组建联邦"
nms.114.d:0 "[SRB.GetName]同意了我们组建联邦的提议，现在正在进行政权的移交准备工作。"
nms.114.1:0 "为联邦友谊三呼万岁！"

nms.115.t:0 "[SRB.GetName]同意接受我们的保护"
nms.115.d:0 "[SRB.GetName]同意接受我们的保护，现在她们加入了我国的势力范围。"
nms.115.1:0 "[NMS.GetName]的伟大胜利"

nms.116.t:0 "命莲寺改良派发起内战"
nms.116.d:0 "由于对政治诉求在[NMS.GetName]政府中未得到足够重视的不满，[NMS.GetName]的改良派号召支持者质疑[NMS.GetName]政府的合法性，并挑战[NMS.GetName]政府的权威，改良派的支持者与[NMS.GetName]政府支持者之间的内战已经爆发。\n\n[NMS.GetName]虽然在上次战争中获得了胜利，但也因此失去了大量人类信徒，从而引发了宗教危机，使原本和平的[NMS.GetName]社会分裂为了改良派与种族派两派。两派间的相互争斗严重影响了[NMS.GetName]的稳定，也导致了[NMS.GetName]政府行政能力的下降。\n\n现任[NMS.GetName]政府的领导人公开谴责了这种分裂行为，并希望能在短期内“平定叛乱”。其他国家对此尚未发表意见。"
nms.116.1:0 "胜利是属于我们的！"
nms.116.2:0 "看来命莲寺的和平只是假象"

nms.117.t:0 "命莲寺种族派发起内战"
nms.117.d:0 "由于对政治诉求在[NMS.GetName]政府中未得到足够重视的不满，[NMS.GetName]的种族派号召支持者质疑[NMS.GetName]政府的合法性，并挑战[NMS.GetName]政府的权威，种族派的支持者与[NMS.GetName]政府支持者之间的内战已经爆发。\n\n[NMS.GetName]虽然在上次战争中获得了胜利，但也因此失去了大量人类信徒，从而引发了宗教危机，使原本和平的[NMS.GetName]社会分裂为了改良派与种族派两派。两派间的相互争斗严重影响了[NMS.GetName]的稳定，也导致了[NMS.GetName]政府行政能力的下降。\n\n现任[NMS.GetName]政府的领导人公开谴责了这种分裂行为，并希望能在短期内“平定叛乱”。其他国家对此尚未发表意见。"
nms.117.1:0 "胜利是属于我们的！"
nms.117.2:0 "看来命莲寺的和平只是假象"

nms.118.t:0 "改良派最终在[NMS.GetName]取得权力"
nms.118.d:0 "[NMS.GetName]内的派系斗争以改良派的胜利而告终，失败的种族派在[NMS.GetName]政府中已经失去影响力，不再能对改良派造成实质意义上的威胁，改良派完全取得了[NMS.GetName]政府的掌控。\n\n自上次大战以来，改良派与种族派之间的斗争一直是[NMS.GetName]国内政治环境的主题，双方均有为数不小的支持者，在重要政治议题上几乎针锋相对，甚至地方上时不时会出现双方支持者之间的武装冲突。然而这种冲突终于迎来了结束，改良派领导人[NMS.GetLeader]成为了[NMS.GetName]的领导者，并宣称要为幻想乡重新带来久违的和平。\n\n改良派的支持者在庆祝这次胜利，幻想乡的一些旧有强权也对[NMS.GetName]发去了祝贺。"
nms.118.1:0 "我们要重新为幻想乡带来和平！"
nms.118.2:0 "不过是伪装罢了"
nms.118.3:0 "有趣"

nms.119.t:0 "种族派最终在[NMS.GetName]取得权力"
nms.119.d:0 "[NMS.GetName]内的派系斗争以种族派的胜利而告终，失败的改良派在[NMS.GetName]政府中已经失去影响力，不再能对种族派造成实质意义上的威胁，种族派完全取得了[NMS.GetName]政府的掌控。\n\n自上次大战以来，改良派与种族派之间的斗争一直是[NMS.GetName]国内政治环境的主题，双方均有为数不小的支持者，在重要政治议题上几乎针锋相对，甚至地方上时不时会出现双方支持者之间的武装冲突。然而这种冲突终于迎来了结束，种族派领导人[NMS.GetLeader]成为了[NMS.GetName]的领导者，并宣称要在幻想乡为[NMS.GetName]争取到应有的地位。\n\n种族派的支持者在庆祝这次胜利，幻想乡的一些旧有强权对此表示担忧。"
nms.119.1:0 "我们要在幻想乡赢得应有的地位！"
nms.119.2:0 "大妖怪露出了伪装下的本性"
nms.119.3:0 "有趣"

nms.120.t:0 "命莲寺改良派赢得内战"
nms.120.d:0 "[NMS.GetName]的内战最终以改良派的胜利而告终，种族派的抵抗尚未完全消除，但种族派领导人已经与改良派完成了投降条件的谈判，并呼吁残余种族派支持者放下武器停止抵抗。\n\n自上次大战以来，改良派与种族派之间的斗争一直是[NMS.GetName]国内政治环境的主题，双方均有为数不小的支持者，在重要政治议题上几乎针锋相对，最终由于政治诉求在政府中长期得不到重视，其中一派决定公开挑战[NMS.GetName]政府，并很快演变为全面内战。而现在，这场席卷全[NMS.GetName]的内战终于落下了帷幕。\n\n[NMS.GetName]国内的改良派纷纷走上街头庆祝这场来之不易的胜利。"
nms.120.1:0 "这是我们的胜利！"
nms.120.2:0 "尘埃落定"

nms.121.t:0 "命莲寺种族派赢得内战"
nms.121.d:0 "[NMS.GetName]的内战最终以种族派的胜利而告终，改良派的抵抗尚未完全消除，但改良派领导人已经与种族派完成了投降条件的谈判，并呼吁残余改良派支持者放下武器停止抵抗。\n\n自上次大战以来，改良派与种族派之间的斗争一直是[NMS.GetName]国内政治环境的主题，双方均有为数不小的支持者，在重要政治议题上几乎针锋相对，最终由于政治诉求在政府中长期得不到重视，其中一派决定公开挑战[NMS.GetName]政府，并很快演变为全面内战。而现在，这场席卷全[NMS.GetName]的内战终于落下了帷幕。\n\n[NMS.GetName]国内的种族派纷纷走上街头庆祝这场来之不易的胜利。"
nms.121.1:0 "这是我们的胜利！"
nms.121.2:0 "尘埃落定"

nms.122.t:0 "[NMS.GetName]加入[SCA.GetFactionName]"
nms.122.d:0 "近日，[NMS.GetName]与[SCA.GetName]共同宣布，[NMS.GetName]将加入由[SCA.GetName]主导的军事同盟[SCA.GetFactionName]，两国发言人声称这将有助于维护幻想乡的稳定与秩序。\n\n[NMS.GetName]在平息国内的派系斗争问题后，在外交上逐渐倾向[SCA.GetName]，最终，两国在一系列的谈判与商讨后，通过签订一系列条约，正式决定了[NMS.GetName]将成为[SCA.GetFactionName]的重要成员，从而进一步拉近两国间的外交关系。\n\n相关外交程序仍在进行中，但两国显然对此十分重视。[SCA.GetFactionName]的其他成员国均表示正在计划公开访问[NMS.GetName]。"
nms.122.1:0 "我们将共同维护幻想乡的秩序！"
nms.122.2:0 "我们对大妖怪之间的勾结没有兴趣"
nms.122.3:0 "幻想乡势力的天平开始倾斜"

nms.123.t:0 "[NMS.GetName]建立[NMS.GetFactionName]"
nms.123.d:0 "近日，[NMS.GetName]宣布，[NMS.GetName]将建立自己的军事同盟[NMS.GetFactionName]，[NMS.GetName]发言人声称这将有助于维护幻想乡的稳定与秩序。\n\n[NMS.GetName]在平息国内的派系斗争问题后，在外交上逐渐倾向[SCA.GetName]。然而出乎意料，[NMS.GetName]没有选择加入[SCA.GetName]的阵营，而是建立了自己的军事同盟。[NMS.GetName]发言人声称这将不会影响两国间的友谊，[NMS.GetName]与[SCA.GetName]两国间仍将保持友好关系，但[SCA.GetName]方面对此的担忧显而易见。\n\n幻想乡其他国家显然将这一行为视为[NMS.GetName]对幻想乡现有势力的挑战，幻想乡的平衡也许就此被打破。"
nms.123.1:0 "我们将维护幻想乡的秩序！"
nms.123.2:0 "大妖怪无聊的权力游戏"
nms.123.3:0 "[NMS.GetName]宣告自身地位的尝试"

nms.124.t:0 "[NMS.GetName]的建立"
nms.124.d:0 "近日，神灵庙宣布接受了命莲寺方面的联邦提议，两国将整合成为一个联邦，即[NMS.GetName]。相关发言人声称两国联邦化的尝试将有助于弥合幻想乡的裂痕，缓解幻想乡的紧张氛围，然而其他国家对这一说法表示质疑。\n\n早在上次大战前，两国就进行过一次构建联邦的尝试，但最终由于理念不同而失败，并在上次大战中站在了对立面。然而，此次联邦提议表明，两国成功的克服了过去的不合，试图在新的幻想乡中寻找新的出路。\n\n相关的政权合并与移交的文书工作仍在进行中。联邦的民众纷纷上街，庆祝新联邦的成立。"
nms.124.1:0 "联邦友谊万岁！"
nms.124.2:0 "宗教间的差异真的可以弥合吗？"

nms.125.t:0 "[NMS.GetName]挑战[SCA.GetName]霸权"
nms.125.d:0 "来自雾之湖西部的消息：[NMS.GetName]单方面终结了与[SCA.GetName]的友好关系，向[SCA.GetName]宣战，两国之间已经进入战争状态。\n\n自人类战争以后，[NMS.GetName]在外交上一直与[SCA.GetName]保持友好关系，幻想乡许多国家将两国视作事实上的盟友。然而这种关系现在已经不复存在，[NMS.GetName]似乎对于[SCA.GetName]在幻想乡的领导地位感到不满，决心通过战争夺取幻想乡霸权。[SCA.GetName]方面对突如其来的战争感到震惊，并公开对[NMS.GetName]破坏幻想乡秩序的行为进行了谴责。\n\n目前，两国的盟友已经开始了战争动员，这场战争也许将彻底改变幻想乡的局势。"
nms.125.1:0 "背信弃义！"
nms.125.2:0 "幻想乡的霸权是时候易主了！"
nms.125.3:0 "幻想乡再度陷于战火"
