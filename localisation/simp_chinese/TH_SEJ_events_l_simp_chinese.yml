l_simp_chinese:
sej.101.t:0 "集体化状况得到改善"
sej.101.d:0 "随着时间发展，我们的集体化状况得到了改善。"
sej.101.1:0 "非常好"

sej.102.t:0 "反对派表示抗议"
sej.102.d:0 "尽管我们取得了[SEJ.GetName]的领导权，但是我们的反对者并没有就此消失，她们仍然能对我们造成许多麻烦。"
sej.102.1:0 "我们必须尽快行动"

sej.103.t:0 "$SEJ_smm$请求庇护"
sej.103.d:0 "由于[SEJ.GetName]内部的变化，$SEJ_smm$不得不离开[SEJ.GetName]，现在她请求我国政府为她提供庇护。"
sej.103.1:0 "我们将提供她所要求的庇护"
sej.103.2:0 "我们担负不起这个风险"

sej.104.t:0 "[SEJ.GetName]邀请我们举行联合军事演习"
sej.104.d:0 "[SEJ.GetName]希望同我们举行一场联合军事演习，这对我们两国的军事水平都有好处。"
sej.104.1:0 "这将对我们两国都有好处"
sej.104.2:0 "这没有必要"

sej.105.t:0 "联合演习要求得到同意"
sej.105.d:0 "我们进行联合军事演习的提议得到了同意。"
sej.105.1:0 "好的"

sej.106.t:0 "联合演习要求被拒"
sej.106.d:0 "我们进行联合军事演习的提议被拒绝了。"
sej.106.1:0 "那就这样吧"

sej.107.t:0 "[SEJ.GetName]的支援"
sej.107.d:0 "我们的盟友，[SEJ.GetName]，愿意就我国的军事现状给予帮助。"
sej.107.1:0 "太好了"

sej.108.t:0 "[SEJ.GetName]希望与我们签订一份互助条约"
sej.108.d:0 "[SEJ.GetName]希望与我国签订一份互助条约，希望能与我国进行军事民用科技方面的交流。"
sej.108.1:0 "这将对我们两国都有好处"
sej.108.2:0 "这没有必要"

sej.109.t:0 "[CIR.GetName]同意签订互助条约"
sej.109.d:0 "来自[CIR.GetName]方面的消息，[CIR.GetName]愿意签订与我国的互助条约，并已经做好了与我国进行军事以及民用方面科技交流的准备。"
sej.109.1:0 "我们两国将携手并进！"

sej.110.t:0 "[CIR.GetName]拒绝签订互助条约"
sej.110.d:0 "来自[CIR.GetName]方面的消息，[CIR.GetName]不愿意签订与我国的互助条约。"
sej.110.1:0 "那就这样吧"

sej.111.t:0 "[SEJ.GetName]邀请我们加入科技互助委员会"
sej.111.d:0 "[SEJ.GetName]邀请我们加入科技互助委员会，委员会中的各国将相互共享部分科技，共同促进下克上事业的发展。"
sej.111.1:0 "这将对我们两国都有好处"
sej.111.2:0 "这没有必要"

sej.112.t:0 "科技互助邀请得到同意"
sej.112.d:0 "我们加入科技互助委员会的邀请得到了同意。"
sej.112.1:0 "好的"

sej.113.t:0 "科技互助邀请遭到拒绝"
sej.113.d:0 "我们加入科技互助委员会的邀请被拒绝了。"
sej.113.1:0 "那就这样吧"

sej.114.t:0 "$SEJ_sej$稳固了在[SEJ.GetName]政治局的领导地位"
sej.114.d:0 "近日，处于僵局的[SEJ.GetName]政局问题似乎最终得到了解决：$SEJ_sej$在政治局中得到了多数支持，稳定了她在政治局的地位。\n\n[SEJ.GetName]自创立以来就是传播幻想乡下克上思想的基地，但在人类惩罚战争以后，[SEJ.GetName]的政治状况似乎陷入了僵局，又由于[SEJ.GetName]在战争中与大妖怪与旧有强权结盟的行为，[SEJ.GetName]在幻想乡传播下克上思想的能力也似乎被大大削弱。不过，$SEJ_sej$承诺，她将继续坚持下克上革命信念，让[SEJ.GetName]与整个幻想乡重新拾起下克上的信念。\n\n其他激进国家与组织已经对$SEJ_sej$发去了祝贺，而一些旧有强权则对此不置可否。"
sej.114.1:0 "众望所归"
sej.114.2:0 "意料之中"
sej.114.3:0 "她们还想弄出什么乱子？"

sej.115.t:0 "[SEJ.GetName]宣布将在全幻想乡传播下克上思想"
sej.115.d:0 "近日，[SEJ.GetName]向全幻想乡发表声明，声称为了保卫下克上革命的成果，[SEJ.GetName]将扩张下克上革命运动同盟的范围，并为全幻想乡以及其他世界所有愿意加入下克上激进事业的国家与革命运动提供必要的援助。\n\n[SEJ.GetName]有扩张下克上理念影响范围的雄心这件事在幻想乡内并不是秘密，然而，自从上次人类惩罚战争以来，幻想乡许多其他国家都认为[SEJ.GetName]传播下克上思想的能力已经被极大的削弱了，现在看来，在处理完国内事务以后，[SEJ.GetName]的影响力已经得到了恢复。\n\n其他激进国家与组织都对[SEJ.GetName]的这份声明表示了赞同，而显然幻想乡的一些旧有强权对此感到了威胁。"
sej.115.1:0 "下克上的火星愈发旺盛"
sej.115.2:0 "有趣"
sej.115.3:0 "必须阻止她们这种疯狂！"

sej.116.t:0 "$SEJ_smm$赢得了在[SEJ.GetName]政治局的领导地位"
sej.116.d:0 "近日，处于僵局的[SEJ.GetName]政局问题似乎最终得到了解决：$SEJ_smm$在政治局中得到了多数支持，成功的赢得了在政治局的领导地位。\n\n[SEJ.GetName]自创立以来就是传播幻想乡下克上思想的基地，但在人类惩罚战争以后，[SEJ.GetName]的政治状况似乎陷入了僵局，又由于[SEJ.GetName]在战争中与大妖怪与旧有强权结盟的行为，[SEJ.GetName]在幻想乡传播下克上思想的能力也似乎被大大削弱。$SEJ_smm$承诺，她将改革下克上的理念，使[SEJ.GetName]成为更加融入幻想乡的政权。\n\n其他激进国家与组织对此表示担忧，而一些旧有强权似乎对重新与[SEJ.GetName]接触产生了兴趣。"
sej.116.1:0 "但愿下克上事业不要受到影响"
sej.116.2:0 "有趣的发展"
sej.116.3:0 "也许这就是叛乱的终结？"
sej.116.4:0 "叛乱同盟的新时代"

sej.117.t:0 "[SEJ.GetName]宣布将解散$SEJ_gekokujyo_revolutionary_movement$"
sej.117.d:0 "近日，[SEJ.GetName]向全幻想乡发表声明，声称出于对幻想乡目前状况的考虑，[SEJ.GetName]将解散$SEJ_gekokujyo_revolutionary_movement$。\n\n[SEJ.GetName]一直有扩张下克上理念影响范围的雄心，然而，自从上次人类惩罚战争以来，幻想乡许多其他国家都认为[SEJ.GetName]传播下克上思想的能力已经被极大的削弱了，现在看来，在处理完国内事务以后，$SEJ_smm$似乎并不准备继续传播下克上理念，而$SEJ_gekokujyo_revolutionary_movement$的解散则更像是对国内的保守派做出的让步。\n\n其他激进国家与组织对此表达了她们的愤怒，而幻想乡的一些旧有强权似乎松了口气。"
sej.117.1:0 "这是对下克上事业的背叛！"
sej.117.2:0 "她们真的就这么散了？"
sej.117.3:0 "明智的决定"
sej.117.4:0 "这下那些妖怪应该满意了"

sej.118.t:0 "组建新的革命同盟"
sej.118.d:0 "由于近期[SEJ.GetName]领导层与政策的变动，原先由[SEJ.GetName]领导的下克上阵营已经宣告解散。我们必须接过革命的旗帜，建立一个新的革命阵营。"
sej.118.1:0 "革命的火焰不会就此熄灭！"

sej.119.t:0 "$SEJ_sej$希望加入我们的事业"
sej.119.d:0 "由于对[SEJ.GetName]现行政策的不满，$SEJ_sej$选择离开[SEJ.GetName]，现在她希望加入我国政府，为我们的事业继续奋斗。"
sej.119.1:0 "欢迎！"
sej.119.2:0 "也许这并不是一个好主意"

sej.120.t:0 "[SEJ.GetName]愿意承认我们的领导地位"
sej.120.d:0 "来自[SEJ.GetName]方面的消息，出于对幻想乡形势的考虑，[SEJ.GetName]愿意承认我国在幻想乡的领导地位，同时希望与我国结成同盟。"
sej.120.1:0 "她们做出了正确的选择"
sej.120.2:0 "我们没必要与她们结盟"

sej.121.t:0 "[YKR.GetName]同意与我国结盟"
sej.121.d:0 "来自[YKR.GetName]方面的消息，[YKR.GetName]十分乐意与我国结盟。"
sej.121.1:0 "这样[SEJ.GetName]在幻想乡的地位就上升了"

sej.122.t:0 "[YKR.GetName]拒绝与我国结盟"
sej.122.d:0 "来自[YKR.GetName]方面的消息，[YKR.GetName]拒绝与我国结盟。"
sej.122.1:0 "这又是哪一出？"

sej.123.t:0 "[SEJ.GetName]承认[YKR.GetName]的领导地位"
sej.123.d:0 "近日，[SEJ.GetName]发表声明，声称出于对幻想乡目前状况的考虑，[SEJ.GetName]将承认[YKR.GetName]在幻想乡的领导地位，两国之间已经结成了同盟。\n\n[SEJ.GetName]自从成立以来就以下克上理念为指导理论，与[YKR.GetName]所代表的大妖怪势力关系一直十分紧张。然而，自从$SEJ_smm$获得[SEJ.GetName]的领导权以来，[SEJ.GetName]的外交方针逐渐倾向重新接触幻想乡的旧有强权。\n\n这份声明不出所料的在幻想乡引起了极大的震动。其他激进国家与组织纷纷指责[SEJ.GetName]的行为是对下克上事业的背叛，而幻想乡的旧有强权对此显然感到满意，她们中的许多甚至已经开始向[SEJ.GetName]发表祝贺，并声称正在“重新考虑与[SEJ.GetName]的关系”。\n\n显然，这一声明与随之而来的两国同盟将永久性的改变幻想乡的形势发展，而这种变化是好是坏仍有待时间检验。"
sej.123.1:0 "叛徒！"
sej.123.2:0 "这就是下克上的结果？"
sej.123.3:0 "她们终于学会幻想乡的规则了"
sej.123.4:0 "这是[SEJ.GetName]外交的一大步！"

sej.124.t:0 "[SEJ.GetName]希望我们停止骚扰边界"
sej.124.d:0 "来自[SEJ.GetName]方面的消息，[SEJ.GetName]希望我们停止对她们边界的骚扰。相对应的，如果我们同意，她们愿意做出适当的补偿。"
sej.124.1:0 "我们接受她们的条件"
sej.124.2:0 "我们拒绝接受"

sej.125.t:0 "[WHR.GetName]同意我国提出的条件"
sej.125.d:0 "来自[WHR.GetName]方面的消息，[WHR.GetName]接受我国提出的条件，现在我国不会受到[WHR.GetName]的骚扰了。"
sej.125.1:0 "明智的决定"

sej.126.t:0 "[WHR.GetName]拒绝我国提出的条件"
sej.126.d:0 "来自[WHR.GetName]方面的消息，[WHR.GetName]拒绝我国提出的条件。"
sej.126.1:0 "她们明白这意味着什么"

sej.127.t:0 "幻想乡大战"
sej.127.d:0 "来自雾之湖东部的消息：[SCA.GetName]与[SEJ.GetName]之间的紧张关系终于被打破，两国之间已经进入战争状态。\n\n在此之前，[SCA.GetName]的主要敌人是在上一次战争中赢得独立的[CIR.GetName]。然而，现在[CIR.GetName]已经被击败，并已经不再成为一个威胁。然而，[SEJ.GetName]与[SCA.GetName]之间的战争最后仍被证明是不可避免的。考虑到两国及其盟友的范围与实力，这次战争的规模甚至可能会超越上一次人类战争。\n\n目前，两国的盟友已经开始了战争动员，幻想乡的命运将决定于这次战争的胜负。"
sej.127.1:0 "这帮叛乱分子终究没有什么不同！"
sej.127.2:0 "[SEJ.GetName]才是幻想乡真正的霸主！"
sej.127.3:0 "战争即地狱"

sej.129.t:0 "叛乱同盟的现状"
sej.129.d:0 "[SEJ.GetName]，这个由$SEJ_sej$创建的国家，最初只是魔法森林北部的没落妖怪们的松散联盟。然而，在$SEJ_sej$的领导下，草根妖怪们开始意识到，结界危机与以往的异变不同，这将是草根妖怪们的机会。结界危机导致了全幻想乡的动荡，而为了在这场风暴中生存，[SEJ.GetName]松散的联盟形式显然是不够的，草根妖怪们必须组建一个国家，并赋予国家的行政机构执行机能所必须的权力，于是[SEJ.GetName]就这样成为了魔法森林北部的新兴国家，成为了所有草根妖怪，幻想乡所有弱者、不起眼者、受压迫者的祖国。\n\n然而，在人类惩罚战争中，我们虽然取得了对魔法使，乃至对人类的胜利，但同盟与大妖怪结盟的外交政策无疑在国内引起了巨大的争议。许多妖怪开始反思接受人类与[TEG.GetName]的橄榄枝，成立一个针对幻想乡旧有强权的联盟是否是一个更优的选择，更有一些妖怪已经质疑[SEJ.GetName]是否已经偏离了建立时的目标——打倒幻想乡的旧强权，为全幻想乡的受压迫者争取权利。\n\n在战后，$SEJ_sej$多次强调与大妖怪的结盟不过是权宜之计，并强调与魔法使战争的必要性。$SEJ_sej$进一步强调[SEJ.GetName]将永远是全幻想乡所有受压迫者的剑与盾。无论如何……"
sej.129.1:0 "大妖怪们肆意妄为的时代结束了！"

sej.130.t:0 "叛乱同盟爆发内战"
sej.130.d:0 "出乎所有人意料的事情发生了：[SEO.GetName]内部发生了内战，妖怪种族主义的军队与下克上军队之间的战争已经爆发。\n\n[SEO.GetName]是由$SEJ_sej$创立的联盟，以传播下克上思想，打破幻想乡的旧有秩序为目标。$SEJ_sej$的这一理念不出所料的吸引了许多小妖怪的支持。然而，许多妖怪把[SEO.GetName]视作另一个草根妖怪的国家，[SEO.GetName]内部逐渐出现了对于$SEJ_sej$的下克上理念不认同的声音。现在，$RMI_rmi$所领导的妖怪种族主义者已经公开挑战$SEJ_sej$，[SEO.GetName]陷入战争之中。\n\n这场内战对于下克上理念，乃至对于整个幻想乡的影响只能由时间决定。"
sej.130.1:0 "胜利是属于我们的！"
sej.130.2:0 "下克上不会就这么结束！"
sej.130.3:0 "终究还是一群乌合之众"

sej.131.t:0 "工厂遭到破坏"
sej.131.d:0 "妖怪种族主义者混入了我们的工厂，对我们各地的工厂生产造成了破坏！"
sej.131.1:0 "糟糕"

sej.132.t:0 "妖怪种族主义者赢得叛乱同盟内战"
sej.132.d:0 "随着最后一支下克上军队的投降，妖怪种族主义者赢得了[SEJ.GetName]内战的胜利，各地仍有少量残存的抵抗，但大规模的敌对行动已经停止。\n\n目前，下克上革命党的领袖$SEJ_sej$和$SEJ_smm$已经逃离[SEJ.GetName]。下克上理念在这场战争中受到了严重打击，在[SEJ.GetName]的政治舞台上几乎已经丧失了所有影响力，而妖怪种族主义者与她们所代表的妖怪复兴理念将在[SEJ.GetName]未来的政治中占有统治地位。\n\n[SEJ.GetLeader]声称，新的领导团队将会更多的注重于“恢复妖怪往日的荣耀”，而种族主义者已经开始在街道上庆祝胜利了。"
sej.132.1:0 "我们向着妖怪复兴目标又前进了一步！"
sej.132.2:0 "下克上不会就这么结束！"
sej.132.3:0 "这帮叛乱分子自己放着就垮了"

sej.133.t:0 "下克上领导人的出逃"
sej.133.d:0 "在我们击败了激进派的军队后，激进派的领袖，$SEJ_sej$和$SEJ_smm$，已经逃出了同盟，各自逃到了其他国家避难。"
sej.133.1:0 "她们已经不重要了"

sej.134.t:0 "下克上革命党赢得叛乱同盟内战"
sej.134.d:0 "随着最后一支妖怪种族主义军队的投降，下克上革命党赢得了[SEJ.GetName]内战的胜利，各地仍有少量残存的抵抗，但大规模的敌对行动已经停止。\n\n目前，妖怪种族主义方的领袖$RMI_rmi$与$NIB_nib$已经被逮捕，她们将会被交由战后重建法庭进行审判。妖怪种族主义在这场战争中受到了严重打击，在[SEJ.GetName]的政治舞台上几乎已经丧失了所有影响力，而下克上革命党与她们所代表的下克上理念仍然将在[SEJ.GetName]占有统治地位。\n\n[SEJ.GetLeader]声称希望人民尽快走出内战的阴影，并鼓励[SEJ.GetName]的人民加快内战重建的步伐。"
sej.134.1:0 "[SEJ.GetName]仍然是下克上的剑与盾！"
sej.134.2:0 "这是下克上的伟大胜利！"
sej.134.3:0 "不过是回光返照罢了"

sej.135.t:0 "种族主义叛乱领导人的处置"
sej.135.d:0 "我们成功镇压了种族主义者的叛乱，现在我们应该如何处理这场叛乱的领导者？"
sej.135.1:0 "我们可以给她们改过自新的机会"
sej.135.2:0 "同盟不需要叛徒！"

sej.136.t:0 "[SEJ.GetName]呼吁对[?SEJ.support_target.GetName]的支援"
sej.136.d:0 "考虑到幻想乡目前的局势，我们潜在的革命盟友[?SEJ.support_target.GetName]需要我们的帮助。[SEJ.GetName]呼吁革命运动的成员国为她们提供必要的帮助。"
sej.136.1:0 "我们将为她们提供武器支援"
sej.136.2:0 "我们将为她们提供武器支援"
