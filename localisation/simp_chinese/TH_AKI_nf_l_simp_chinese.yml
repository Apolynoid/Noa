AKI_ren_yu_shen_de_ge_he_idea_desc:0 "除了八百万神明，妖怪山脚下的人类村落也是我国的重要组成部分。然而人与神之间仍然存在严重的隔阂，特别是军队构成中，这严重削弱了我国军队的指挥作战能力。"
