AKI_diao_ling_zhe_zhun_jun_shi_zu_zhi_idea:0 "凋零者准军事组织"
AKI_diao_ling_zhe_zhun_jun_shi_zu_zhi_idea_desc:0 "在妖怪山战争中，我国不仅遭受了红魔馆军队的破坏，而且也导致了南方大片领土被脱离红魔馆军队的妖精占据，即使是红魔馆方面的事后补偿也很难抹消这场战争对我国的影响。一些对红魔馆不满的人类与神明在$AKI_sizuha$的领导下成立了被称为凋零者的准军事组织。"
