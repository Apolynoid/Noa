AKI_tu_di_jian_bing_idea_desc:0 "我国经济严重依赖农业，然而土地却集中在少数人手中，大量农民被迫成为佃农，不得不缴纳大量的土地租金。这一现状引起了国内的严重不满，也严重影响了我国的生产能力。"

