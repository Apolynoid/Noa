l_simp_chinese:
AKI_DAWN_DESC:0 "神明信仰联盟在138季的妖怪山战争中被斯卡蕾特帝国攻击并迅速占领，在战争中遭受了严重的战争创伤，同时也失去了大量土地——这些土地被战后脱离帝国军的妖精占领，后来成立了西南妖精联合。联盟内在妖怪山战争中受到严重损失的人类与神明组建了仇视斯卡蕾特帝国的准军事组织凋零者，遵奉秋静叶为领袖。战争后日益严重的土地兼并问题使得凋零者进一步扩张，成为了联盟的主要不稳定因素。战后红魔馆的援助资金被视为帝国的橄榄枝，但也进一步激怒了凋零者，凋零者活动转向了街头暴力与政治暗杀。联盟在西南的存续正在经历严重考验……"
introduce_AKI_page1:0 "妖怪山山脚下一直是人与神的混居之地，八百万神明为人类提供神明的庇护，而人类提供信仰作为回报。大结界危机后，山脚下原先的聚居地联合形成了§Y[AKI.GetName]§!，由两位秋神轮流执政。然而138季的§Y妖怪山战争§!打破了这一平衡。为了出其不意的突破天狗的防线，§Y[SCA.GetName]§!向原本宣布中立的§Y[AKI.GetName]§!发动了攻击，迅速占领了§Y[AKI.GetName]§!全境，直到红魔馆赢得胜利才撤出妖怪山山脚下。\n\n妖怪山战争不仅使§Y[AKI.GetName]§!失去的如今§Y[SGS.GetName]§!所在的地区——这一地区被妖怪山战争中脱离红魔馆军队的妖精所占据，后来又加入了来自魔法森林，躲避§Y人类惩罚战争§!战火的妖精——还对§Y[AKI.GetName]§!造成了严重的战争创伤。毫不意外的，联盟内部产生了仇视§Y[SCA.GetName]§!的准军事组织§Y凋零者§!。这一组织遵奉§Y$AKI_sizuha$§!为组织领袖，以在妖怪山战争中受到严重损失的人类与神明作为组织主体，发誓要向红魔馆复仇。另一方面，战争也使得联盟的§Y土地兼并§!问题更加严重。战争使得大量农民破产，不得不向受战争波及较小地区出售被占领地区土地的所有权，而这又导致了贫富差距的进一步加深。最终大量土地集中在少数人手中，大量租种土地的佃农对§Y土地兼并§!的现状强烈不满，一部分加入了§Y凋零者§!组织，成为了联盟的主要不稳定因素。\n\n§Y人类惩罚战争§!结束后，§Y[SCA.GetName]§!考虑到西南地区稳定对帝国的重要价值，利用§Y[HUM.GetName]§!的赔款向§Y[AKI.GetName]§!提供了一大笔援助资金与低息贷款，事实上作为§Y妖怪山战争§!的补偿金。这一行为被联盟的许多人视为§Y[SCA.GetName]§!的橄榄枝，新的投资也缓解了联盟的不稳定，因此联盟当前的执政者§Y$AKI_szh$§!转向了与红魔馆合作的执政方针。而§Y凋零者§!将这一举动视为严重的背叛，失望的§Y$AKI_sizuha$§!宣布放弃§Y[AKI.GetName]§!的领导权，§Y凋零者§!组织活动转向了街头暴力与政治暗杀。\n\n无论是难以遏制的§Y土地兼并§!问题还是§Y凋零者§!组织的暴力行动都严重威胁着联盟的行政能力与稳定，而对这些问题的解决方案与解决效果，决定着§Y[AKI.GetName]§!是否能在幻想乡西南存续下去……"
# 国策 national focus
AKI_ying_dui_tu_di_jian_bing:0 "应对土地兼并"
AKI_ying_dui_tu_di_jian_bing_desc:0 "由于联盟长期以来的农业传统，联盟境内的大部分土地都被少部分人掌控，大量无地农民对土地兼并的现状不满，成为了联盟的主要不稳定因素，这一问题必须得到解决。"
