l_simp_chinese:
# 介绍
MRS_DAWN_DESC:0 "大结界危机激化了魔法森林中的种族矛盾，这些种族矛盾将魔法使引向了战争，而魔法使在复权战争中的战败标志着魔法使在新时代的没落。战后，魔法森林虽然仍然作为统一政治实体存在，但魔法使已经失去的往日的支配地位，其他种族不仅得到了期望已久的自治权，在魔女议会中也得到了相应的席位。然而战后的魔女联盟依然危机四伏，各方强权争相投资议会中自己中意的派系，希望将魔法森林纳入势力范围，进而控制魔法森林丰富的资源。雾雨魔理沙作为大魔女的地位不断在议会中受到挑战，各派系对魔法森林的未来各执己见，在魔女议会中争论不休。魔女联盟的未来仍然悬而未决……"
introduce_MRS_page1:0 "在大结界危机前，§Y魔法森林§!的主要居民是修炼魔法的人类与魔法使。魔法使虽然与魔法森林中的其他种族不时产生矛盾，但由于魔法使力量的强势，魔法森林仍掌握在魔法使组成的§Y魔女议会§!手中。然而，大结界危机彻底打破了魔法森林的势力平衡，在原有魔法森林政治体系中处于边缘状态的妖精、妖怪、付丧神纷纷要求自治，而魔法使对这些诉求的忽视导致了§Y[SEJ.GetName]§!以保护魔法森林种族自治为由的干涉。\n\n缺乏组织能力的魔法使完全无力抵挡§Y[SEJ.GetName]§!的军队，不得不向§Y[HUM.GetName]§!求助，因而被卷入了§Y复权战争§!中。随着人类在复权战争中的战败，魔法使被迫向妖怪联军投降。为了降低在魔法森林的统治压力，战后条约保留了魔法森林作为统一政治实体的地位，但在这一实体的具体管理问题上产生了冲突。最终，由§Y[SCA.GetName]§!帝国选择的领导人§Y$MRS_mrs$§!作为魔法森林新的§Y大魔女§!，同时为了满足§Y[SEJ.GetName]§!的要求设置了一系列的§Y种族自治区§!，其他种族根据条约不仅得到了期望已久的自治权，在魔女议会中也得到了相应席位，新的§Y[MRS.GetName]§!就此诞生。为了进一步切断魔法森林与人类的联系，修炼魔法的人类在种族划分上被认为更接近非人类的魔法使而不是人类，从而进一步削弱人类在幻想乡的力量。\n\n复权战争的结束并不意味着§Y[MRS.GetName]§!的和平。魔法使因战败与权力削弱而不满，其他种族则不愿放弃新得的自治权。魔法森林丰富的资源也引起了其他强权的兴趣，这些强权争相投资自己中意的派系，希望能将魔法森林纳入势力范围。各派系对魔法森林的未来也各执己见，在魔女议会中争论不休。§Y$MRS_mrs$§!的威望暂时还能维持§Y[MRS.GetName]§!表面的和平，但挑战§Y$MRS_mrs$§!统治的声音在议会中逐渐增加。§Y[MRS.GetName]§!的未来仍然悬而未决……"
# 政治线 political
MRS_zhao_kai_mo_nv_da_hui:0 "召开魔女大会"
MRS_zhao_kai_mo_nv_da_hui_desc:0 "随着我们在复权战争中的失败，魔法森林表面上的团结岌岌可危。不仅如此，对魔理沙能否继续胜任大魔女之位的质疑也此起彼伏。在这一次的魔女大会上，我们会决定下一位大魔女的最佳人选，也随之决定魔法森林未来的命运..."
