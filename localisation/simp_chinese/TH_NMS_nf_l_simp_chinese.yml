NMS_pai_xi_dou_zheng:0 "派系斗争"
NMS_pai_xi_dou_zheng_desc:0 "在宗教危机下，§9改良派§!与§A种族派§!之间的矛盾逐渐暴露出来。\n\n§9改良派§!控制着国家的经济，她们在底层群众中得到了广泛支持。§9改良派§!的不满会影响国家的经济发展与社会稳定。\n\n§A种族派§!控制着国家的军事部门，她们的支持来自军事系统。§A种族派§!的不满会影响国家的军事实力与战争支持度。\n\n§Y派系斗争§!中的每一个国策都会影响双方对当前政府的满意程度，当政策倾向过于突出时，政治诉求受到忽视的一方的不满程度将会显著影响国家整体发展，甚至于发起一场§R内战§!！发起内战的派系的所有国策都将变为不可用，已获得的相关增益也会消失。\n\n§Y注意§!：一方在政府中失去影响力并不意味着派系斗争问题的解决，其支持者的不满仍将在一段时间内持续对社会造成影响。只有当其影响随着时间彻底消失时，派系斗争问题才能结束。"
