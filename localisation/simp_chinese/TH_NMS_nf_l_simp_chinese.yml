l_simp_chinese:
NMS_DAWN_DESC:0 "命莲寺在人类惩罚战争中流失了大量人类信徒，使得妖怪彻底主导了命莲寺，因而在主战派的支持下加入了妖怪联军并成为了联军主力。因此在联军胜利后，命莲寺赢得了大量的威望与支持者，成为了西雾之湖的支配力量。然而战争的胜利使主战派——后来重组为种族派——的影响力急剧扩大，圣白莲支持的改良派不再能完全主导命莲寺政治。两派间的派系斗争日趋激烈，派系间的冲突在命莲寺境内随处可见，甚至时不时发生暴力冲突。如果派系斗争的问题得不到解决，一场内战将不可避免的撕裂命莲寺。命莲寺的理念能在动荡的幻想乡继续生存吗？"
introduce_NMS_page1:0 "§Y[NMS.GetName]§!原本是同时接待人类与妖怪的寺庙，然而由于各种原因，妖怪仍然占据主要地位。在138季的§Y妖怪山战争§!中，§Y[NMS.GetName]§!与§Y[SRB.GetName]§!组建了§Y道佛联邦§!，接纳来自妖怪山的战争难民。然而，在§Y人类惩罚战争§!中，支持妖怪的§Y[NMS.GetName]§!与支持人类的§Y[SRB.GetName]§!分道扬镳，§Y道佛联邦§!解散。§Y[NMS.GetName]§!境内的人类纷纷流向§Y[SRB.GetName]§!，或者直接加入了人类军队，使得剩下的妖怪彻底主导了§Y[NMS.GetName]§!。在主战派的支持下，§Y[NMS.GetName]§!很快加入了§Y人类惩罚战争§!，这条战线——§Y人类惩罚战争§!的西线成为了战争的主战场。经历漫长而血腥的战争后，§Y人类惩罚战争§!最终以妖怪联军的胜利而告终，§Y[NMS.GetName]§!作为妖怪联军的主力，在战争中赢得了大量威望与支持者，迅速发展成为西雾之湖的支配势力。\n\n然而§Y[NMS.GetName]§!的危机才刚刚开始。随着战争的胜利，主战派在国内的支持率与日俱增，而战争中将作为§Y[NMS.GetName]§!象征的§Y圣辇船§!作为支援武器的行为彻底引发了主战派与主和派的对立。§Y[NMS.GetLeader]§!名义上仍然是§Y[NMS.GetName]§!的领袖，但其支持的主和派却不再能完全主导§Y[NMS.GetName]§!政治。随着派系斗争日趋激烈，原本松散的主战派与主和派迅速重组成为了§Y种族派§!与§Y改良派§!。§Y种族派§!以§Y$NMS_murasa$§!为实际领袖，主要由§Y人类惩罚战争§!中的军事领导层与被§Y[NMS.GetName]§!的胜利吸引而来的支持者构成，她们主张利用§Y[NMS.GetName]§!的军事力量进一步扩张影响力。而§Y改良派§!名义上的领袖是§Y$NMS_kyouko$§!，暗地里却受到§Y$NMS_nms$§!的支持。这一派系主张通过建设与发展扩张§Y[NMS.GetName]§!的影响力，而军事力量仅需用于基本的国防需求。\n\n长期的派系斗争使得两派迅速组织化，派系的主要支持者与主要纲领也逐渐趋于确定与明晰。派系间的冲突在§Y[NMS.GetName]§!境内随处可见，甚至时不时发生暴力冲突。两派都有大量支持者，如果不能处理好派系冲突，一场内战将在所难免。§Y[NMS.GetName]§!的未来在暴雨中飘荡……"
