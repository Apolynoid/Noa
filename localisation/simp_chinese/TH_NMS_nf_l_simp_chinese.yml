NMS_di_xiao_de_gong_ye_ti_xi_idea:0 "低效的工业体系"
NMS_di_xiao_de_gong_ye_ti_xi_idea_desc:0 "相较于我们的敌人，命莲寺的工业化水平并不乐观。在命莲寺完全见不到大规模高效的工业体系的哪怕一点影子，大量工厂甚至还在采用近乎原始的生产模式。这一现状严重影响了我国的经济水平。"
