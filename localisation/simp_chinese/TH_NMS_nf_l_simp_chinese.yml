NMS_xue_xi_sheng_nian_chuan_gou_zao_desc:0 "圣辇船支援地面步兵的战术在上一次战争中被证明有效，通过大规模制造造价更低的圣辇船仿制品并投入前线作为支援，我们能为我们的士兵提供优秀的火力指引与火力支援。"
