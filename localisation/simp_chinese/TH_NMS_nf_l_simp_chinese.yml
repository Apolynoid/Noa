l_simp_chinese:
introduce_NMS_page1:0 "自从§Y[NMS.GetLeader]§!从魔界中被她的妖怪弟子所解放后，她将新的寺庙——§Y[NMS.GetFlag][NMS.GetName]§!选址在了§Y[HUM.GetFlag][HUM.GetName]§!外部，意在同时吸引妖怪和人类步入佛门，然而受限于§Y[NMS.GetFlag][NMS.GetName]§!原先就以妖怪为主，所以后来也只有妖怪加入，最终彻彻底底地变成了一个妖怪寺。\n结界危机发生初期，幻想乡的和平受到严重挑战，尤其是§Y红魔馆——妖怪山战争§!导致了大量难民，§Y[NMS.GetFlag][NMS.GetName]§!和§Y[SRB.GetFlag][SRB.GetName]§!为了宣扬各自的和平理念，意外地放下了宗教偏见，组成了§Y道佛联邦§!，吸引了那些渴望和平的幻想乡住民。然而好景并不长，其东面的§Y[HUM.GetFlag][HUM.GetName]§!力量意外暴涨并向妖怪地区野蛮扩张。在人类第一次扩张以后，§Y[NMS.GetLeader]§!为了妖怪的生存和当时的人类领导者§Y稗田阿求§!见了面，让§Y稗田阿求§!意识到自己原先善待妖怪的规划已被下层曲解，在§Y稗田阿求§!的个人威望之下，使得被征服区域的妖怪的情况开始好转，甚至变得和人类一样步入文明时代。而§Y道佛联邦§!也因此和§Y[HUM.GetFlag][HUM.GetName]§!达成了友好协定。\n然而，人类的扩张也让大量妖怪流亡者进入了§Y[NMS.GetFlag][NMS.GetName]§!，这些妖怪对着人类有着强烈的怨恨。虽然§Y[NMS.GetLeader]§!能够理解人类在了解幻想乡的本质并获得力量后的强烈反弹，但她手下那些才半步步入佛门的妖怪是无法理解的，她们被那些从原先住所驱逐出来的妖怪所影响，想起了和人类拔刀相向的过去，这一切再度重演，而她们所信赖的§Y圣大人§!在这需要其个人凝聚力的关键时刻被宗教所束缚。同时，其联邦的另一部分§Y[SRB.GetFlag][SRB.GetName]§!也开始暗中勾结人类。意识到危机的妖怪门徒们后开始自发的武装起来，怕在不久的将来§Y[NMS.GetFlag][NMS.GetName]§!也会有和人类的一战，§Y[NMS.GetLeader]§!选择了对她们睁只眼闭只眼，这使得这些完全不信教妖怪难民们获得了更多力量。而这时越来越多的人类终于开始注意这个有意在人类村落不远处聚集大量妖怪的妖怪寺，于是§Y[NMS.GetLeader]§!再度被人类误解——认为§Y[NMS.GetLeader]§!是为了像其他妖怪一样控制人类才把寺庙建在了§Y[HUM.GetFlag][HUM.GetName]§!附近，双方关系急剧恶化。\n转机出现在了人类决定向魔法森林进军之后，人类为了将魔法森林纳入势力范围而和下克上妖怪们作战，但被地理环境以及魔法使部队的本身作战能力连累，造成了人类力量暴涨的贤者§Y[YKR.GetLeader]§!这时开始号召广大妖怪们趁此机会反击人类，越来越多的妖怪加入其中。因为§Y[NMS.GetLeader]§!不想被贴上妖怪的标签，§Y[NMS.GetFlag][NMS.GetName]§!作为最关键的一员迟迟不肯下手。但她的手下§Y$NMS_murasa$§!打响了第一枪，使§Y[NMS.GetFlag][NMS.GetName]§!和§Y[HUM.GetFlag][HUM.GetName]§!开战，§Y道佛联邦§!也就此破裂，§Y[NMS.GetFlag][NMS.GetName]§!也终于加入了反击人类的队伍。\n初期，战争极度顺利，尤其是§Y[NMS.GetLeader]§!手下§Y$NMS_nue$§!的部队的妖力护盾，能够吸收使用博丽之力的子弹，使得在战争中§Y[NMS.GetFlag][NMS.GetName]§!步入上风。但在攻入§Y[HUM.GetFlag][HUM.GetName]§!主要地区后受到强烈抵抗，于是§Y$NMS_murasa$§!提出把§Y圣辇船§!开出来当作轰炸机支援地面部队，而§Y圣辇船§!也是§Y[NMS.GetFlag][NMS.GetName]§!寺庙的本体，这自然遭到了原先忠实信徒的强烈反对，然而那些妖怪难民们却对寺庙的意义熟视无睹。在主战派的强烈要求下，原先的宝船被迫作为轰炸机出现，让原来见过宝船的所有人印象深刻，虽然这给人类带来了很多恐惧，但最终§Y圣辇船§!还是被人类的防空炮摧毁了，§Y[NMS.GetFlag][NMS.GetName]§!暂时成为了没有寺庙的“§Y[NMS.GetName]§!”。\n虽然§Y[NMS.GetFlag][NMS.GetName]§!最终损失了大量妖怪和§Y圣辇船§!，但获得了大量原先妖人聚集区的土地，让爱好和平的§Y$NMS_kyouko$§!担任总督。同时搞坏了§Y圣辇船§!的§Y$NMS_murasa$§!也帮助重建了§Y[NMS.GetName]§!，但这次只是一个地面建筑了。此外，通过这次战争，§Y[NMS.GetFlag][NMS.GetName]§!获得了大量威望，原先妖怪难民许多宣布追随§Y$NMS_murasa$§!，同时也吸引了很多外来妖怪加入。但§Y[NMS.GetLeader]§!也很清楚，她们并非是为了皈依佛门而来，而是纯粹是渴望力量，宣扬暴力的妖怪。而这种妖怪，如今已经占据了§Y[NMS.GetFlag][NMS.GetName]§!的绝大多数，§Y[NMS.GetFlag][NMS.GetName]§!原先的宗教色彩，已经被强烈淡化。于是§Y[NMS.GetLeader]§!开始重新振兴佛教的地位，得到了佛教信徒以及新加入的妖人聚集区的部分支持，然而她们更希望能够抑制§Y[NMS.GetFlag][NMS.GetName]§!中的好战份子；同时这不意外地被那些新晋妖怪们所排斥，甚至认为§Y圣大人§!被人类所影响，而领导着这些新晋妖怪、最忠实§Y圣大人§!的妖怪们自然强烈反对这种说法，认为§Y圣大人§!只是被宗教所过度束缚，毕竟佛法终究是人类所写，应当进行改革来适应幻想乡的妖怪。然而暗地里，她们也各自拥兵上千，如果§Y[NMS.GetLeader]§!仍然固守原先的佛教，很有可能发生武装强制改革。\n这对于§Y[NMS.GetLeader]§!是个进退两难的时候……"
