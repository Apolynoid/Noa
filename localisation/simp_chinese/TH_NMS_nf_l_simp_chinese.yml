NMS_zong_jiao_wei_ji_idea:0 "宗教危机"
NMS_zong_jiao_wei_ji_idea_desc:0 "我们虽然取得了人类惩罚战争的胜利，但也因此失去了大量人类信徒，命莲寺的信仰急剧减少，不得不吸收大量并不能完全理解佛教教义的妖怪进入命莲寺，从而进一步加剧了宗教危机。"
