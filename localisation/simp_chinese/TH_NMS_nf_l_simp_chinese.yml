NMS_ying_dui_zong_jiao_wei_ji:0 "应对宗教危机"
NMS_ying_dui_zong_jiao_wei_ji_desc:0 "人类惩罚战争的胜利使我们失去了大量人类信徒，命莲寺的信仰急剧减少，坚持原有佛教教义的改良派与要求增强命莲寺扩张能力的种族派之间的冲突一触即发，如果我们现在开始处理这些矛盾，也许能够在事态走向不可控制之前解决这场宗教危机。"
