NMS_zheng_bian_mo_tuo_ju_le_bu_desc:0 "战场上的机动性十分重要。通过将摩托俱乐部成员整合进军队，我们将获得一支在战场上拥有极高机动性与灵活性的先锋部队，这无疑将为我们敌人的前线防御造成极大的压力。"
