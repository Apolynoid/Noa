SRB_jun_bei_xian_zhi_tiao_yue_idea:0 "军备限制条约"
SRB_jun_bei_xian_zhi_tiao_yue_idea_desc:0 "虽然我国没有直接参与上次战争，但我国与人类的贸易行为仍然引起了妖怪联军的高度不满，我国不得不接受苛刻的军备限制条款以避免妖怪联军的制裁与直接军事干涉。"
SRB_cui_ruo_de_jing_ji_idea:0 "脆弱的经济"
SRB_cui_ruo_de_jing_ji_idea_desc:0 "在我国与人类的贸易因战后对人类的制裁而中断后，我国失去了战前最重要的贸易对象，经济情况受到剧烈冲击，需要一系列强有力的经济改革措施来挽救我国的经济。"
