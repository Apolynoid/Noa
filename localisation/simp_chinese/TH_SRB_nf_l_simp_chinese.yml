SRB_wai_jiao_zheng_ce:0 "外交政策"
SRB_wai_jiao_zheng_ce_desc:0 "由于§Y《军备限制条约》§!，我国的军事与工业发展严重落后与时代。幸运的是，通过在各国之间周旋，我国可以争取到发展所需的资源。\n\n各国对我国的影响通过§Y影响力§!表现，当§Y影响力§!低于§Y0§!时，该国将§R取消§!对我国的投资，同时我国也会§R失去§!该国的投资带来的好处。部分事件及国家陷入内战或战败也会永久§R取消投资§!。各国对我国的§Y影响力§!越高，能够采取的各种§Y投资活动§!也越多；但§Y影响力§!高于§Y100§!时，该国可以利用其§Y影响力§!强制我国成为附庸，同时也会§R取消§!其他国家的投资。各国的§Y影响力§!会随着时间缓慢§Y增长§!，且§R取消投资§!的国家越多，继续投资的国家的§Y影响力§!增长就§Y越快§!。\n\n当前各国§Y影响力§!为：\n[NMS.GetNameWithFlag]:[SRB_get_NMS_influence]\n[SCA.GetNameWithFlag]:[SRB_get_SCA_influence]\n[SEJ.GetNameWithFlag]:[SRB_get_SEJ_influence]\n[TKM.GetNameWithFlag]:[SRB_get_TKM_influence]"
SRB_wai_jiao_chuang_kou_jie_shu:0 "外交窗口结束"
