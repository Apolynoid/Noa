SRB_di_xiao_de_xing_zheng_ji_gou_idea:0 "低效的行政机构"
SRB_di_xiao_de_xing_zheng_ji_gou_idea_desc:0 "神灵庙的行政机构已经严重落后于时代，各部门之间职责划分混乱，行政官员普遍不具有足够的能力。这种结构性缺陷不仅影响了行政效率，甚至影响了社会的整体稳定，彻底对当前的行政机构进行重组成为了神灵庙的当务之急。"
