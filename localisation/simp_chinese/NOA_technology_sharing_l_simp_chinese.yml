 gekokujyo_tech_mutual_aid_committee_name:0 "下克上科技互助委员会"
 gekokujyo_tech_mutual_aid_committee_desc:0 "下克上科技互助委员会是由叛乱同盟提议组建的，作为下克上革命运动的下属机构而存在的科技交流组织，旨在帮助全幻想乡的弱者提升科技水平，从而促进幻想乡的下克上运动。"