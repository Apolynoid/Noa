l_simp_chinese:
zyd.101.t:0 "[state_to_develop.GetName]得到开发"
zyd.101.d:0 "我们授权的民间组织对[state_to_develop.GetName]进行了开发，现在该区域已经建立起了可用的工厂。"
zyd.101.1:0 "非常好"

zyd.102.t:0 "[ZYD.GetName]成立"
zyd.102.d:0 "在西南的战乱结束后，作为胜利者的中有之道政府近日宣布，将原有的贸易区正式组建为[ZYD.GetName]，这标志着西南首次统一于一个中央政府之下。\n\n西南原本在幻想乡并不受到重视，与地狱直接接壤的特点也使得这一地区长期为幻想乡的强权所忽视。然而，随着大结界危机的到来，原有的地缘政治格局被打破。中有之道原本是地狱与幻想乡的贸易区，但通过充分利用贸易带来的生产优势，在同为共和政权的[TEG.GetName]的援助下，中有之道击败了西南的其他政权，成为了西南的胜利者。\n\n幻想乡其他改良政权纷纷向[ZYD.GetName]发去祝贺，而幻想乡的旧有强权，特别是[SCA.GetName]与[NMS.GetName]，对这一变化深感不安。"
zyd.102.1:0 "最终还是改良派的胜利"
zyd.102.2:0 "幻想乡的民主事业再进一步"
zyd.102.3:0 "无非又是一个短命的共和政权"
