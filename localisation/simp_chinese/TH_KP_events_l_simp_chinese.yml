l_simp_chinese:
kp.101.t:0 "河童再统一问题"
kp.101.d:0 ""
kp.101.1:0 "河童必将重新统一"

kp.103.t:0 "[conflict_state.GetName]发生准军事组织冲突"
kp.103.d:0 "由于双方准军事组织力量的发展，在[conflict_state.GetName]地区发生了街头冲突，双方均有损失。"
kp.103.1:0 "局势紧张"

kp.104.t:0 "[public_vote_state.GetName]公投改变阵营"
kp.104.d:0 "近日[public_vote_state.GetName]地区的公投结果显示，当地民众更愿意加入另一侧河童政府。政权交接正在进行。"
kp.104.1:0 "明智的决定！"
kp.104.2:0 "叛徒！"

kp.105.t:0 "[public_vote_state.GetName]公投维持现状"
kp.105.d:0 "近日[public_vote_state.GetName]地区的公投结果显示，当地民众希望维持现状。"
kp.105.1:0 "明智的决定！"
kp.105.2:0 "也许我们的宣传不够有效？"

kp.106.t:0 "[coup_state.GetName]发生政变"
kp.106.d:0 "[coup_state.GetName]地区的准军事组织发动了政变，并成功夺取了该地区的控制权。"
kp.106.1:0 "精彩！"
kp.106.2:0 "幻想乡不会容忍这种行为！"

kp.107.t:0 "[coup_state.GetName]政变被挫败"
kp.107.d:0 "[coup_state.GetName]地区的政变企图已被挫败，该地区的控制权仍掌握在原政府手中。"
kp.107.1:0 "不自量力的尝试"
kp.107.2:0 "可惜"

kp.108.t:0 "河童内战继续"
kp.108.d:0 "因外部干涉而被迫中止的河童内战再次爆发，和平时期的渗透行动已不再适用。"
kp.108.1:0 "现在由子弹发言"

kp.109.t:0 "河童再统一运动结束"
kp.109.d:0 "河童内战结束了，我们现在是唯一的合法河童政府。"
kp.109.1:0 "河童统一于我们的旗帜下！"
