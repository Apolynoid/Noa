l_simp_chinese:
tkm.101.t:0 "146季道具政治会议"
tkm.101.d:0 "付丧神在上一次战争中原本作为人类的附庸而存在，然而随着战局对人类越来越不利，一些人类开始展现出了对付丧神的不信任。随着战局的进一步恶化，人类与付丧神之间的信任变的越来越脆弱，$TKM_raiko$开始思考付丧神未来的出路。最终，通过与妖怪联军的秘密谈判，付丧神成功从人类手中赢得了独立，并在战后负责人类村落的重建与监督工作。\n\n然而，付丧神在幻想乡仍然没有真正的一席之地。从人类手中夺取了南雾之湖工业区的[SCA.GetName]仍然不感到满足，希望将付丧神的领地一并划入帝国的势力范围。西部的[NMS.GetName]声称付丧神无力履行对人类的监管工作，并要求[TKM.GetName]移交对人类的监管权。由于付丧神的存在此时依赖于高能灵气的供应，两国对[TKM.GetName]实施了贸易禁运，以此对付丧神施加压力。\n\n针对这一形势，付丧神召开了146季道具政治会议，对幻想乡的局势进行了讨论。\n$TKM_raiko$在会议中提出[TKM.GetName]应当以增强自身实力为主，提升对高能灵气的开采能力，并控制南雾之湖的高能灵气产区。\n$TKM_yatsuhashi$认为可以在外交上倒向与[SCA.GetName]和[NMS.GetName]敌对的$SEJ_gekokujyo_revolutionary_movement$，通过下克上经济圈解决高能灵气的供应问题。\n$TKM_kog$支持通过外交与贸易手段施压，通过经济手段控制部分高能灵气产区，并通过外交手段争取不满[SCA.GetName]和[NMS.GetName]的国家的贸易往来。\n\n会议最终的结果是……"
tkm.101.1:0 "堀川雷鼓在会议上维持优势"
tkm.101.2:0 "九十九八桥取得了会议的主导"
tkm.101.3:0 "多多良小伞出乎意料的胜出"

tkm.102.t:0 "$TKM_raiko$赢得[TKM.GetName]领导权"
tkm.102.d:0 "近日，[TKM.GetName]的道具政治会议落下帷幕，$TKM_raiko$维持了她在会议上的优势，保持了对[TKM.GetName]的领导权。\n\n[TKM.GetName]原本是附属于人类的工业区，在上次战争中，由于战局不利，人类对工业区中的付丧神开始展现出不信任，最终付丧神脱离人类影响加入了妖怪联军，并在战后的工业区上建立起了自己的国家[TKM.GetName]。随着道具政治会议的结束，[TKM.GetName]确定了她们新生国家未来的道路。$TKM_raiko$宣布付丧神的任务是提升国家综合实力，以[TKM.GetName]为出发点，向南雾之湖以至全幻想乡输出革新。\n\n尽管这一激进主张在幻想乡的改良势力中引起了激烈讨论，幻想乡各大改良势力仍然向$TKM_raiko$表示了祝贺。"
tkm.102.1:0 "付丧神……是敌？是友？"
tkm.102.2:0 "有趣的主张"
tkm.102.3:0 "我们也应当关注付丧神的威胁"

tkm.103.t:0 "$TKM_yatsuhashi$赢得[TKM.GetName]领导权"
tkm.103.d:0 "近日，[TKM.GetName]的道具政治会议落下帷幕，$TKM_yatsuhashi$在会议上了取得了优势，赢得了对[TKM.GetName]的领导权。\n\n[TKM.GetName]原本是附属于人类的工业区，在上次战争中，由于战局不利，人类对工业区中的付丧神开始展现出不信任，最终付丧神脱离人类影响加入了妖怪联军，并在战后的工业区上建立起了自己的国家[TKM.GetName]。随着道具政治会议的结束，[TKM.GetName]确定了她们新生国家未来的道路。$TKM_yatsuhashi$宣布[TKM.GetName]将接受下克上理念，成为幻想乡激进主义的一员，解放幻想乡的受压迫者。\n\n幻想乡的激进主义势力对这一消息感到满意，纷纷向$TKM_yatsuhashi$发去祝贺，而幻想乡旧有强权对这一结果表示了担忧。"
tkm.103.1:0 "下克上理念的影响力正在扩大"
tkm.103.2:0 "有趣"
tkm.103.3:0 "激进分子的威胁扩大了"

tkm.104.t:0 "$TKM_kog$赢得[TKM.GetName]领导权"
tkm.104.d:0 "近日，[TKM.GetName]的道具政治会议落下帷幕，$TKM_kog$出人意料的取得了对[TKM.GetName]的领导权。\n\n[TKM.GetName]原本是附属于人类的工业区，在上次战争中，由于战局不利，人类对工业区中的付丧神开始展现出不信任，最终付丧神脱离人类影响加入了妖怪联军，并在战后的工业区上建立起了自己的国家[TKM.GetName]。随着道具政治会议的结束，[TKM.GetName]确定了她们新生国家未来的道路。$TKM_kog$宣布付丧神的任务是维护南雾之湖的和平，并积极与周边国家建立起有效的贸易往来，建立一个更加繁荣的幻想乡。\n\n幻想乡的改良主义势力均向$TKM_kog$发去了祝贺，并表达了与[TKM.GetName]建立友好关系的意愿。"
tkm.104.1:0 "她们真的能成功吗？"
tkm.104.2:0 "幻想乡的革新阵营的新成员！"
tkm.104.3:0 "仍然不能对她们掉以轻心"

tkm.105.t:0 "[TKM.GetName]希望与我们进行合作"
tkm.105.d:0 "随着魔法森林的局势变化，[TKM.GetName]方面主动与我们联系，希望与我们建立合作关系——她们将在内战中援助我们，而我们在胜利后将[354.GetName]与[162.GetName]的高能灵气开采权转交给她们6年作为回报。我们应当如何对待这份提议？"
tkm.105.1:0 "我们接受这笔交易"
tkm.105.2:0 "我们仅靠自己就能赢得战争"

tkm.106.t:0 "[FROM.GetName]同意了我方提出的条件"
tkm.106.d:0 "来自[FROM.GetName]方面的消息，她们同意了我们的提议。"
tkm.106.1:0 "明智的决定"

tkm.107.t:0 "[FROM.GetName]拒绝了我方提出的条件"
tkm.107.d:0 "来自[FROM.GetName]方面的消息，她们拒绝了我们的提议。"
tkm.107.1:0 "也许还来得及寻找其他合作者"

tkm.108.t:0 "来自[TKM.GetName]的武器援助"
tkm.108.d:0 "根据我们与[TKM.GetName]达成的协议，她们为我们送来了我们需要的武器装备。"
tkm.108.1:0 "感谢她们！"

tkm.109.t:0 "来自[TKM.GetName]的军事顾问"
tkm.109.d:0 "根据我们与[TKM.GetName]达成的协议，她们向我们派遣了一支指导我国军事建设的军事顾问小组。"
tkm.109.1:0 "感谢她们！"

tkm.110.t:0 "来自[TKM.GetName]的工业援助"
tkm.110.d:0 "根据我们与[TKM.GetName]达成的协议，她们为我们提供了生产武器装备必需的设备与原料。"
tkm.110.1:0 "感谢她们！"

tkm.111.t:0 "向[TKM.GetName]转交高能灵气开采权"
tkm.111.d:0 "根据我们与[TKM.GetName]达成的协议，我们将为她们提供[354.GetName]与[162.GetName]的高能灵气开采权6年作为报酬。"
tkm.111.1:0 "感谢她们的援助！"

tkm.112.t:0 "[?TKM.TKM_magic_forest_cooperator.GetName]向我们转交资源开采权"
tkm.112.d:0 "根据我们与[?TKM.TKM_magic_forest_cooperator.GetName]达成的协议，她们为我们提供[354.GetName]与[162.GetName]的高能灵气开采权6年，作为我们在内战中支持她们的报酬。"
tkm.112.1:0 "非常好"

tkm.114.t:0 "资源开采权到期"
tkm.114.d:0 "我们在魔法森林的资源开采权已经到期，现在我们将交还[354.GetName]与[162.GetName]的高能灵气开采权。"
tkm.114.1:0 "我们已经得到了我们需要的东西"

tkm.115.t:0 "[TKM.GetName]希望与我们达成贸易协定"
tkm.115.d:0 "作为我们在复权战争中失败的战后处置，[TKM.GetName]在战后成为了我们的“保护者”。现在，来自[TKM.GetName]的代表向我们提出了一份协定，希望我们将[539.GetName]地区的高能灵气开采权租借给[TKM.GetName]，作为回报，[TKM.GetName]愿意与我们重新修订一份更加宽容的“保护”协定。我们应当如何对待这份提议？"
tkm.115.1:0 "这将是双赢的交易"
tkm.115.2:0 "我们不能接受"

tkm.116.t:0 "[HUM.GetName]同意了我们的提议"
tkm.116.d:0 "来自[HUM.GetName]方面的消息，她们同意了我们的提议。"
tkm.116.1:0 "明智的决定"

tkm.117.t:0 "[HUM.GetName]拒绝了我们的提议"
tkm.117.d:0 "来自[HUM.GetName]方面的消息，她们拒绝了我们的提议。"
tkm.117.1:0 "可惜"

tkm.119.t:0 "资源开采权到期"
tkm.119.d:0 "我们在人类村落的资源开采权已经到期，现在我们将交还[539.GetName]的高能灵气开采权。"
tkm.119.1:0 "我们已经得到了我们需要的东西"

tkm.120.t:0 "偿付战争债券"
tkm.120.d:0 "战争结束，我们必须偿还我们发行的战争债券。"
tkm.120.1:0 "我们必须证明我们给出的不是空头支票"

tkm.121.t:0 "[TKM.GetName]向[SBK.GetName]宣战"
tkm.121.d:0 "近日，随着[TKM.GetName]与[SBK.GetName]之间的局势升温，[TKM.GetName]已经向[SBK.GetName]宣战，两国军队已经在边境上对峙，边境上已经发生零星交火。\n\n自从付丧神从人类手中独立，[TKM.GetName]一直将整个南雾之湖视作自己的势力范围，而[SBK.GetName]则被视为周边的不安定因素。[TKM.GetName]在[SBK.GetName]建立之初曾经尝试要求两国合并，或通过为[SBK.GetName]提供保护换取东侧安全，但多次谈判均以失败告终。由于幻想乡局势的变化，[TKM.GetName]开始重新审视[SBK.GetName]问题，两国地缘利益与意识形态上的冲突最终导致了战争。\n\n幻想乡其他势力似乎对此结果并不感到意外，一些旧有强权对[TKM.GetName]的侵略行为表示了谴责，但似乎并没有进一步干涉的意愿。"
tkm.121.1:0 "我们必须维护南雾之湖的安全"
tkm.121.2:0 "我们绝不束手就擒！"
tkm.121.3:0 "意料之中"

tkm.122.t:0 "[SBK.GetName]接受[TKM.GetName]的保护"
tkm.122.d:0 "近日，来自[SBK.GetName]的发言人宣布，[SBK.GetName]将接受[TKM.GetName]的提议，成为[TKM.GetName]的保护国。\n\n自从付丧神从人类手中独立，[TKM.GetName]一直将整个南雾之湖视作自己的势力范围，而[SBK.GetName]则被视为周边的不安定因素。[TKM.GetName]在[SBK.GetName]建立之初曾经尝试要求两国合并，或通过为[SBK.GetName]提供保护换取东侧安全，但多次谈判均以失败告终。由于幻想乡局势的变化，[TKM.GetName]开始重新审视[SBK.GetName]问题。最终[SBK.GetName]选择接受[TKM.GetName]的保护，这也几乎意味着成为[TKM.GetName]的附庸。\n\n幻想乡其他势力对此结果略感意外，但似乎均没有进一步干涉此事的打算。"
tkm.122.1:0 "两国的友谊将维护南雾之湖的和平"
tkm.122.2:0 "但愿我们的牺牲是值得的"
tkm.122.3:0 "[TKM.GetName]的外交胜利"

tkm.123.t:0 "[TKM.GetName]请求同盟"
tkm.123.d:0 "[TKM.GetName]的领导人[TKM.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
tkm.123.1:0 "我们将并肩作战"
tkm.123.2:0 "革命不需要她们"

tkm.124.t:0 "[GEK.GetName]拒绝了同盟请求"
tkm.124.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
tkm.124.1:0 "我们也许只能依靠自己"

tkm.125.t:0 "[TKM.GetName]加入[SEJ.GetFactionName]"
tkm.125.d:0 "近日，[TKM.GetName]与[SEJ.GetName]共同宣布，[TKM.GetName]将加入[SEJ.GetFactionName]，两国发言人声称这将进一步扩大下克上理念与激进思想在幻想乡的传播，并有助于实现[SEJ.GetFactionName]解放全幻想乡受压迫者的最终目标。\n\n从[TKM.GetLeader]在道具政治会议上赢得领导职位以来，[TKM.GetName]的外交政策逐步向[SEJ.GetName]倾斜。事实上，[TKM.GetName]加入[SEJ.GetFactionName]这一结果并不令人意外。经过一系列正式程序后，[TKM.GetName]正式成为了[SEJ.GetFactionName]的重要成员。\n\n相关外交程序仍在进行中，但两国显然对此十分重视。[SEJ.GetFactionName]的其他成员国均对[TKM.GetName]表示了欢迎与祝贺。"
tkm.125.1:0 "下克上势力在幻想乡的胜利"
tkm.125.2:0 "有趣"
tkm.125.3:0 "叛乱分子又下一城"

tkm.126.t:0 "[TKM.GetName]宣布创建[TKM.GetFactionName]"
tkm.126.d:0 "近日，[TKM.GetName]宣布，[TKM.GetName]将建立自己的军事同盟[TKM.GetFactionName]，[TKM.GetName]发言人声称这将有助于进一步扩大下克上理念与激进思想在幻想乡的传播。\n\n从[TKM.GetLeader]在道具政治会议上赢得领导职位以来，[TKM.GetName]的外交政策逐步向[SEJ.GetName]倾斜。然而令人意外的是，[TKM.GetName]最终没有选择加入[SEJ.GetFactionName]。[TKM.GetName]方面否定了与[SEJ.GetName]存在冲突的传言，但幻想乡的激进势力对这一事件的担忧显而易见。\n\n尽管如此，[SEJ.GetName]与仍然[SEJ.GetFactionName]的其他成员国仍然向[TKM.GetName]表示了祝贺。"
tkm.126.1:0 "她们仍然是下克上的一员"
tkm.126.2:0 "有趣"
tkm.126.3:0 "叛乱分子的分裂"

tkm.127.t:0 "[TKM.GetName]公开支持国内激进派"
tkm.127.d:0 "[TKM.GetName]公开宣布了对我国境内泛妖怪激进派的支持。如果我们不能有效遏制这些激进分子，在一次由[TKM.GetName]精心策划的公投后，我们毫无疑问将成为[TKM.GetName]的附庸。"
tkm.127.1:0 "必须阻止这些激进分子!"

tkm.128.t:0 "干涉[SBK.GetName]的尝试失败"
tkm.128.d:0 "由于我们行动的不及时以及[SBK.GetName]境内保守势力的反抗，向[SBK.GetName]输出下克上革命的计划以失败告终。"
tkm.128.1:0 "可惜"

tkm.129.t:0 "[TKM.GetName]要求我们进行公投"
tkm.129.d:0 "随着我国境内激进派数量的增加。[TKM.GetName]要求我国对于接受[TKM.GetName]保护的问题进行公投。毫无疑问的，这将导致我国成为[TKM.GetName]的附庸。"
tkm.129.1:0 "我们最好接受她们的要求"
tkm.129.2:0 "我们绝不向叛乱分子屈服"

tkm.130.t:0 "[SBK.GetName]同意接受我们的保护"
tkm.130.d:0 "我们向[SBK.GetName]提出的公投要求得到了满足，毫无疑问的，公投过后[SBK.GetName]接受了我们的保护。"
tkm.130.1:0 "非常好"

tkm.131.t:0 "[SBK.GetName]拒绝公投"
tkm.131.d:0 "我们向[SBK.GetName]提出的公投要求被拒绝了，她们似乎不愿意接受她们人民的意见。"
tkm.131.1:0 "她们清楚这意味着什么"

tkm.132.t:0 "[TKM.GetName]向我们提出保护提议"
tkm.132.d:0 "[TKM.GetName]向我们发出通牒，声称考虑到幻想乡现在的局势，[TKM.GetName]有责任为[SBK.GetName]提供保护。这一“保护”无疑将使我们丧失相当一部分自主性，然而[TKM.GetName]方面也暗示，拒绝这一提议的结果可能是战争。"
tkm.132.1:0 "我们最好接受她们的要求"
tkm.132.2:0 "我们绝不束手就擒"

tkm.133.t:0 "[SBK.GetName]同意接受我们的保护"
tkm.133.d:0 "我们向[SBK.GetName]提出的要求得到了满足，现在[SBK.GetName]接受了我们的保护。"
tkm.133.1:0 "我们都会从这份友谊中获利"

tkm.134.t:0 "[SBK.GetName]拒绝接受我们的保护"
tkm.134.d:0 "[SBK.GetName]拒绝接受我们的保护，也许她们对我们抱有敌意。"
tkm.134.1:0 "我们必须采取手段保护自己的安全"

tkm.135.t:0 "[TKM.GetName]希望我们解除贸易限制"
tkm.135.d:0 "来自[TKM.GetName]的外交人员向我方提交了一份提议，希望我们解除由[SCA.GetName]与[NMS.GetName]发起的贸易限制。[TKM.GetName]方面声称这一不合理的限制无疑对双方都没有好处，然而退出贸易限制也无疑会恶化我们与[SCA.GetName]和[NMS.GetName]的关系。"
tkm.135.1:0 "这对我们双方都有好处"
tkm.135.2:0 "我们不能承受激怒[SCA.GetName]与[NMS.GetName]的风险"

tkm.136.t:0 "[FROM.GetName]同意解除贸易限制"
tkm.136.d:0 "我们与[FROM.GetName]的协商取得了成效，现在她们将取消对我们的贸易限制。"
tkm.136.1:0 "太好了"

tkm.137.t:0 "[FROM.GetName]拒绝解除贸易限制"
tkm.137.d:0 "尽管我们尽了最大的努力，[FROM.GetName]仍然拒绝解除对我们的贸易限制。"
tkm.137.1:0 "浪费时间"

tkm.138.t:0 "战火蔓延南雾之湖"
tkm.138.d:0 "来自南雾之湖的消息：[TKM.GetName]与[SCA.GetFactionName]之间的战争已经爆发，边境线上已经发生交火。\n\n[TKM.GetName]虽然在上次战争中赢得了独立，但在幻想乡仍被传统势力排斥，[SCA.GetName]与[NMS.GetName]两国均运用自己的影响力限制了[TKM.GetName]的高能灵气进口，而这一资源对于付丧神的生存至关重要。这一公开的敌对最终导致了战争，在上次战争中作为主战场的南雾之湖再度陷入战火。双方都迅速进行了战争动员，并在各自的外交平台上动员盟友参加战争，考虑到战争双方的实力，这场战争的规模将毫不逊色于上一次人类战争。\n\n这场战争的结果无疑会对幻想乡的未来造成深刻影响。"
tkm.138.1:0 "帝国将赢得再一次胜利！"
tkm.138.2:0 "消灭这些威胁和平的付丧神！"
tkm.138.3:0 "为道具的生存而战！"
tkm.138.4:0 "南雾之湖再次被战争笼罩"

tkm.139.t:0 "战火蔓延南雾之湖"
tkm.139.t_escalation:0 "南雾之湖战争扩大"
tkm.139.d:0 "来自南雾之湖的消息：[TKM.GetName]与[NMS.GetName]之间的战争已经爆发，边境线上已经发生交火。\n\n[TKM.GetName]虽然在上次战争中赢得了独立，但在幻想乡仍被传统势力排斥，[SCA.GetName]与[NMS.GetName]两国均运用自己的影响力限制了[TKM.GetName]的高能灵气进口，而这一资源对于付丧神的生存至关重要。这一公开的敌对最终导致了战争，在上次战争中作为主战场的南雾之湖再度陷入战火。双方都迅速进行了战争动员，并在各自的外交平台上动员盟友参加战争，考虑到战争双方的实力，这场战争的规模将毫不逊色于上一次人类战争。\n\n这场战争的结果无疑会对幻想乡的未来造成深刻影响。"
tkm.139.d_escalation:0 "来自南雾之湖的消息：[TKM.GetName]与[SCA.GetName]之间的战争进一步扩大，[NMS.GetName]作为[SCA.GetName]的盟友加入了战争。\n\n与[SCA.GetName]一样，[NMS.GetName]同样运用自己的影响力限制了[TKM.GetName]进口对付丧神的生存至关重要的高能灵气。考虑到这一事实，[TKM.GetName]与[NMS.GetName]之间的战争似乎并不出人意料。[NMS.GetName]迅速进行了战争动员，并进一步动员更多潜在盟友参加战争。\n\n南雾之湖战争的进一步扩大无疑让幻想乡的和平在短期内成为奢望，逃离战区的难民在公路边形成了长队。无人知道幻想乡何时，甚至是否还能恢复和平。"
tkm.139.1:0 "我们必须密切注视付丧神的威胁"
tkm.139.2:0 "她们在自取灭亡"
tkm.139.3:0 "消灭这些威胁和平的付丧神！"
tkm.139.4:0 "她们这是不自量力！"
tkm.139.5:0 "为道具的生存而战！"
tkm.139.6:0 "我们将赢得彻底的胜利！"
tkm.139.7:0 "南雾之湖再次被战争笼罩"
tkm.139.8:0 "和平对于幻想乡已成幻想"

