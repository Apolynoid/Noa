l_simp_chinese:
 #焦点事件
sca.101.t:0 "红魔城庆典准备"
sca.101.d:0 "红魔城，这座由141季妖怪山战争中的战争赔款所建立起的城市，从一开始就彰示着[SCA.GetName]的荣耀与胜利。这座城市以原来的红魔馆为中心，现已成为帝国最大的城市，是帝国繁荣的象征。\n\n我们将在这里举办一场宏大的庆典，用以庆祝帝国所取得的胜利。幻想乡的各方势力都会被邀请到庆典上，我们将向她们展示[SCA.GetName]的伟大与不可战胜。\n\n我们的女皇，蕾米莉亚·斯卡蕾特，将在不久后亲自视察庆典的准备工作。"
sca.101.1:0 "让我们展示帝国的荣耀"

sca.102.t:0 "蕾米莉亚女皇遭遇刺杀"
sca.102.d:0 "蕾米莉亚女皇遇刺了！在视察红魔城庆典的准备时，一名妖精突然从人群中冲出，并用准备好的火器对着女皇连开三枪。万幸，前两发都没有命中，然而第三发击中了蕾米莉亚女皇。目前，蕾米莉亚女皇已经陷入昏迷，尚在抢救中。\n\n我们尚不清楚本次刺杀是何方势力所为。在我们的警卫能够抓住刺客之前，刺客已经服毒自杀了。不过，我们怀疑，这场刺杀完全是[CIR.GetName]的阴谋。"
sca.102.1:0 "天啊..."

sca.103.t:0 "蕾米莉亚·斯卡蕾特遭遇刺杀"
sca.103.d:0 "[SCA.GetName]的领导人，蕾米莉亚·斯卡蕾特，在视察红魔城庆典的准备时，被一名妖精尝试刺杀。目前，蕾米莉亚陷入了昏迷状态，正在抢救中，而妖精刺客已经服毒自杀。\n\n据悉，原本预计通过本次庆典展现[SCA.GetName]的实力。在蕾米莉亚视察庆典准备时，刺客拿出了准备好的火器，瞄准蕾米莉亚连开三枪，其中最后一发命中。由于子弹采用银质子弹，蕾米莉亚受到重伤。刺客在被警卫抓住之前服毒自尽。\n\n[SCA.GetName]怀疑刺杀由[CIR.GetName]发起，而[CIR.GetName]尚未发表任何评论。"
sca.103.1:0 "沉重的新闻"
sca.103.2:0 "可惜偏了一点"
sca.103.3:0 "幻想乡也许不再如往常了"

sca.104.t:0 "帝国境内发生叛乱"
sca.104.d:0 "在蕾米莉亚女皇遭遇刺杀后，显然帝国境内潜藏的反对者认为此时是发动叛乱的好机会。妖精们开始拒绝按照帝国的要求工作，不仅如此，妖精还占据了城市的重要设施，我们的行政系统已经被瘫痪。更加糟糕的是，受叛乱者控制的城市不止一座，而且叛乱还有向四周扩散的趋势。"
sca.104.1:0 "派军队镇压她们！"

sca.105.t:0 "[SCA.GetName]境内发生动荡"
sca.105.d:0 "在[SCA.GetName]的领导人，蕾米莉亚·斯卡蕾特，遭到刺杀后，[SCA.GetName]境内发生了大规模的动荡。帝国的几座重要城市已经受到叛军的控制，且叛乱还有向四周扩散的趋势。\n\n据悉，此次动荡的主要原因是[SCA.GetName]对待妖精严苛的政策。帝国境内的妖精一直没有受到合理的对待，而战争中帝国糟糕的战术指挥造成的大量无谓的伤亡毫无疑问更加激化了妖精对帝国的不满。\n\n有消息称叛乱受到了[CIR.GetName]的资助，然而无论[SCA.GetName]还是[CIR.GetName]均未对此说法发表评论。"
sca.105.1:0 "她们不会有什么结果的"
sca.105.2:0 "继续前进，妖精同胞们！"
sca.105.3:0 "看来帝国的繁荣不过是假象"

sca.106.t:0 "军队中发生抗命事件"
sca.106.d:0 "最糟糕的情况发生了：我们派去镇压叛乱的军队中发生了大规模的抗命现象。许多士兵拒绝执行镇压命令，甚至出现了士兵与低级军官公开支持叛乱者的情况。她们声称帝国的指挥系统已经腐烂，而她们将要和妖精同胞站在一起。除了明面上的抗命以外，军队中暗地里对这些想法的赞同更加广泛，甚至已经出现了有些部队准备前去投靠[CIR.GetName]的传闻。"
sca.106.1:0 "天啊……"

sca.107.t:0 "叛乱带来的损失"
sca.107.d:0 "暴动的妖精近日损坏了帝国的一些工业设施作为抗议手段。"
sca.107.1:0 "还需要多久？"

sca.108.t:0 "叛乱逐渐平息"
sca.108.d:0 "经过帝国的不懈努力，妖精的暴动终于逐渐平息了，军队中的反对者也开始逐渐减少，帝国逐渐开始恢复正常。"
sca.108.1:0 "终于结束了"

sca.109.t:0 "蕾米莉亚女皇的恢复"
sca.109.d:0 "经过长时间的医学治疗与调养，受到刺杀的蕾米莉亚·斯卡蕾特女皇终于从伤势中恢复，并宣布将重新掌控政局。尽管仍有许多人表达了对蕾米莉亚身体状况的担忧，但蕾米莉亚女皇坚持要重新亲政。\n\n由于女皇已经恢复，帝国摄政议会已经准备休会，并正在准备政务的交接相关事宜。"
sca.109.1:0 "太好了"

sca.110.t:0 "[SCA.GetName]提出合作建议"
sca.110.d:0 "来自[SCA.GetName]方面的消息，[SCA.GetName]的外交人员表示，即使两国之间过去有过一些不愉快，但出于现在的形式考虑，[SCA.GetName]提议两国之间签订一份新的外交协议。这份协议要求我们定期为[SCA.GetName]提供一些她们需要的物资，其中包括一定量的血液，与之相对的，[SCA.GetName]方面表示愿意为我们提供所需要的保护，以及一批我们所需要的经济援助。"
sca.110.1:0 "我们接受这一提议"
sca.110.2:0 "我们绝不与恶魔合作"

sca.111.t:0 "[HUM.GetName]接受我们的提议"
sca.111.d:0 "来自[HUM.GetName]方面的消息，[HUM.GetName]接受了我们的提议。"
sca.111.1:0 "合作愉快"

sca.112.t:0 "[HUM.GetName]拒绝我们的提议"
sca.112.d:0 "来自[HUM.GetName]方面的消息，[HUM.GetName]拒绝了我们的提议。"
sca.112.1:0 "愚蠢的决定"

sca.113.t:0 "[SCA.GetName]邀请我们加入科技合作"
sca.113.d:0 "[SCA.GetName]方面邀请我们加入帝国科学院，以期未来的技术交流与合作，这将对我们双方都有好处。"
sca.113.1:0 "我们没有理由拒绝"

sca.114.t:0 "来自[SCA.GetName]的工业援助"
sca.114.d:0 "[SCA.GetName]对我们的工业援助已经抵达，这将改善我们的工业现状。"
sca.114.1:0 "太好了"

sca.115.t:0 "来自[SCA.GetName]的投资"
sca.115.d:0 "[SCA.GetName]对我们的投资已经抵达，这将改善我们的工业现状。"
sca.115.1:0 "太好了"

sca.116.t:0 "来自[SCA.GetName]的军事援助"
sca.116.d:0 "[SCA.GetName]近日与我们分享了一些先进军事经验，这将对我们的武装力量有所帮助。"
sca.116.1:0 "太好了"

sca.117.t:0 "芙兰朵露政变"
sca.117.d:0 "不少军队高层认为是蕾米莉亚的软弱才造成了帝国的动荡。她们在首都发动了一场政变，要求蕾米莉亚退位，并扶持蕾米莉亚的妹妹芙兰朵露成为帝国新的统治者。蕾米莉亚起初感到吃惊，不过很快就平静的接受了事实，宣布退位并将皇位传给了芙兰朵露。\n\n可以想见，在芙兰朵露的统治下，帝国将会变得更加富有侵略性。"
sca.117.1:0 "芙兰朵露女皇万岁！"

sca.118.t:0 "战胜[CIR.GetName]带来的军事进步"
sca.118.d:0 "我们成功战胜[CIR.GetName]了，在这场关乎帝国命运的战争中，我们的军队得到了历练。"
sca.118.1:0 "啊……"
