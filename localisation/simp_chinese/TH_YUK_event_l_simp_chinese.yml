l_simp_chinese:
yuk.101.t:0 "与妖精的商谈"
yuk.101.d:0 "直至几年前，[YUK.GetLeader]仍然是[YUK.GetName]理所当然的统治者。然而，经历了大结界危机与多场战争的幻想乡已不复往日。作为[YUK.GetName]主要种族的妖精受到[CIR.GetName]与[SGS.GetName]成立的影响，开始要求增加妖精在管理事务中的话语权。另一方面，大结界危机也减少了[YUK.GetLeader]与普通妖精之间的力量差别，以往依赖绝对力量的统治方式开始失效。面对力量差距的缩小和妖精们日益增长的不满，[YUK.GetLeader]任命了$YUK_larva$作为新晋行政官僚，又弱化了妖精的实际权力的权谋，然而这只是更增长了妖精的不满。\n\n作为避免国家走向彻底撕裂的最后尝试，[YUK.GetLeader]成功说服了妖精们派出代表举行一次商谈。在商谈中，[YUK.GetLeader]承诺将在未来实现经济、科技、社会发展方面的全面改革，而妖精方面仍在试探各项改革的具体内容与保障措施。商谈最终的结果是……"
yuk.101.1:0 "商谈达成了初步合作意向"
yuk.101.2:0 "商谈未能取得有效结果"

yuk.102.t:0 "花田内战爆发"
yuk.102.d:0 "近日，随着太阳花田方向尝试与妖精妥协的所有尝试失败，太阳花田的妖精决定挑战$YUK_yuk$的权威。妖精夺取了几个地区的控制，骚乱很快蔓延成为一场全面内战。\n\n位处幻想乡边缘的太阳花田在幻想乡过去几年的动荡中没有受到太多影响，但[CIR.GetName]的建立还是影响了妖精的种族意识，同时，西侧的妖精国家带来的示范效应进一步动摇了花田的统治基础，而$YUK_yuk$尝试重新稳定统治的失败权谋只是进一步增加了妖精们的不满。随着几次商议的失败，妖精们对$YUK_yuk$的信心显然已经完全消失，最终演变成了这场全面内战。\n\n双方都在为这场决定太阳花田未来的内战进行战争动员，幻想乡其他势力尚未对此做出评价。"
yuk.102.1:0 "胜利属于我们！"
yuk.102.2:0 "出人意料的发展"

yuk.103.t:0 "激进派赢得花田内战胜利"
yuk.103.d:0 "太阳花田方面的内战已经结束，由$YUK_larva$领导的激进派系取得了胜利，效忠派有组织的抵抗已经完全消失。\n\n妖精觉醒的种族意识与$YUK_yuk$几次失败的政治权谋点燃了太阳花田的战火，而花田灵力革命党在这场战争中赢得了太阳花田的统治地位。$YUK_yuk$在签署投降协议后被逮捕，并将交由战后重建法庭进行审判，这无疑将对残存的效忠派带来巨大打击。$YUK_larva$在战后演讲中呼吁太阳花田重新团结，尽快投入到战后重建中。\n\n这场内战无疑对太阳花田造成了巨大的创伤，而花田灵力革命党正在规划战后的重建计划。幻想乡的激进势力纷纷向$YUK_larva$表示祝贺，而旧有强权对此表示沉默。"
yuk.103.1:0 "我们胜利了！"
yuk.103.2:0 "幻想乡革命再进一步"
yuk.103.3:0 "叛乱分子的威胁进一步增加"

yuk.104.t:0 "效忠派赢得花田内战胜利"
yuk.104.d:0 "太阳花田方面的内战已经结束，由忠于$YUK_yuk$的效忠派取得了胜利，激进派有组织的抵抗已经完全消失。\n\n妖精觉醒的种族意识与$YUK_yuk$几次失败的政治权谋点燃了太阳花田的战火，而$YUK_oldgenso_party_long$在这场战争中维持了太阳花田的统治权。$YUK_larva$在签署投降协议后被逮捕，并将交由战后重建法庭进行审判，这无疑将对残存的激进派带来巨大打击。$YUK_yuk$在战后演讲中呼吁太阳花田重新团结，尽快投入到战后重建中。\n\n这场内战无疑对太阳花田造成了巨大的创伤，而$YUK_oldgenso_party_long$正在规划战后的重建计划。幻想乡的旧有强权纷纷向$YUK_yuk$表示祝贺。"
yuk.104.1:0 "叛乱分子的挣扎是徒劳的"
yuk.104.2:0 "意料之中"

yuk.105.t:0 "叛乱领袖的处置"
yuk.105.d:0 "我们成功镇压了激进分子的叛乱，现在我们应该如何处理这场叛乱的领导者？"
yuk.105.1:0 "她们也许还有用"
yuk.105.2:0 "我们不需要叛徒！"

yuk.106.t:0 "效忠派领袖的处置"
yuk.106.d:0 "我们在革命中成功推翻了旧秩序，现在我们应该如何处理效忠派的领袖？"
yuk.106.1:0 "共和国也许需要她们"
yuk.106.2:0 "共和国不需要她们"

yuk.107.t:0 "内战伤痕"
yuk.107.d:0 "我们赢得了内战的胜利，但战争彻底撕裂了我国社会，社会上弥漫着厌战情绪，国家需要时间得到恢复。"
yuk.107.1:0 "我们还有许多工作要做"

yuk.108.t:0 "叛乱分子的宣传攻势"
yuk.108.d:0 "由于叛乱分子的宣传，我们军队与工厂中一部分人的作战能力与生产能力受到了严重影响。"
yuk.108.1:0 "糟糕"

yuk.109.t:0 "[YUK.GetName]请求同盟"
yuk.109.d:0 "在经历了一场内战后，[YUK.GetName]的领导人[YUK.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
yuk.109.1:0 "我们将并肩作战"
yuk.109.2:0 "革命不需要她们"

yuk.110.t:0 "[GEK.GetName]拒绝了同盟请求"
yuk.110.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
yuk.110.1:0 "我们也许只能依靠自己"

yuk.111.t:0 "经济建设承诺完成"
yuk.111.d:0 "我们向妖精承诺的经济发展得到了实现，现在我们的国家变得更加繁荣了。"
yuk.111.1:0 "我们证明了[THIS.GetLeader]值得信赖"

yuk.112.t:0 "社会稳定承诺完成"
yuk.112.d:0 "我们向妖精承诺的社会稳定得到了实现，现在我们的社会稳定程度得到了巨大的改善。"
yuk.112.1:0 "我们证明了[THIS.GetLeader]值得信赖"

yuk.113.t:0 "生产优化承诺完成"
yuk.113.d:0 "我们向妖精承诺的生产优化得到了实现，现在我国的生产技术已经追上了幻想乡的一流水平。"
yuk.113.1:0 "我们证明了[THIS.GetLeader]值得信赖"

yuk.114.t:0 "科技进步承诺完成"
yuk.114.d:0 "我们向妖精承诺的科技进步得到了实现，现在我国的科学技术水平已经追上了幻想乡的一流水平。"
yuk.114.1:0 "我们证明了[THIS.GetLeader]值得信赖"

yuk.115.t:0 "激进派发动了内战"
yuk.115.d:0 "在激进派的煽动下，原本对我们的统治心怀不满的妖精趁着战争的机会发动了内战。"
yuk.115.1:0 "糟糕"
