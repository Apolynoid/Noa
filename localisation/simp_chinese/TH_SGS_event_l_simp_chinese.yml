l_simp_chinese:
sgs.101.t:0 "西南妖精紧急会议"
sgs.101.d:0 "" 
sgs.101.1:0 "激进派在会议上维持优势"
sgs.101.2:0 "改革派得到了更多认同"
sgs.101.3:0 "种族派掌控了会议走向"

sgs.102.t:0 "激进派掌控[SGS.GetName]政治"
sgs.102.d:0 "" 
sgs.102.1:0 "妖精解放更进一步"
sgs.102.2:0 "有趣"

sgs.103.t:0 "改革派掌控[SGS.GetName]政治"
sgs.103.d:0 "" 
sgs.103.1:0 "我们将为西南带来和平与繁荣"
sgs.103.2:0 "有趣"

sgs.104.t:0 "种族派掌控[SGS.GetName]政治"
sgs.104.d:0 "" 
sgs.104.1:0 "为妖精生存而战！"
sgs.104.2:0 "有趣"

sgs.105.t:0 "[SGS.GetName]请求同盟"
sgs.105.d:0 "[SGS.GetName]的领导人[SGS.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
sgs.105.1:0 "我们将并肩作战"
sgs.105.2:0 "革命不需要她们"

sgs.106.t:0 "[GEK.GetName]拒绝了同盟请求"
sgs.106.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
sgs.106.1:0 "我们也许只能依靠自己"
