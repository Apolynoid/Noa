l_simp_chinese:
sgs.101.t:0 "西南妖精紧急会议"
sgs.101.d:0 "[SGS.GetName]原本是[AKI.GetName]的领土，但在138季的妖怪山战争中，许多红魔馆妖精士兵脱离军队，在这片土地上定居。妖怪山战争结束后，[AKI.GetName]发动的多次尝试夺回领土的小规模冲突均宣告失败。而在之后的人类惩罚战争中，南雾之湖的大量妖精成为战争难民，与先前脱离红魔馆的妖精会合。这两批妖精居民构成了今天[SGS.GetName]的主要居民来源。她们开始模仿[CIR.GetName]的政治体制建立起了自己的国家与社会,[SGS.GetName]正式成立，成为了幻想乡西南的第一个妖精国家。\n\n而现在，[AKI.GetName]公然宣称要夺回西南的土地。为了保卫西南新生的妖精国家，[SGS.GetName]召开了西南妖精紧急会议，三个主要派系在会议上各自争取支持者。\n激进派主张继续遵循[CIR.GetName]的政治体制，以幻想乡的妖精解放为目标，在外交上跟随下克上同盟。\n改革派主张转向在西南影响力更大的改革路线，以建设国家经济与工业为目标，同时争取在西南地区拥有巨大影响力的[TEG.GetName]的支持。\n种族派则主张尽快完成战争动员，以保卫妖精国家为第一要务，在外交上则不倾向任何一方。\n\n现在会议临近尾声，最终的结果是……" 
sgs.101.1:0 "激进派在会议上维持优势"
sgs.101.2:0 "改革派得到了更多认同"
sgs.101.3:0 "种族派掌控了会议走向"

sgs.102.t:0 "激进派掌控[SGS.GetName]政治"
sgs.102.d:0 "[SGS.GetName]近日的政治会议得出了结果：激进派仍然掌控[SGS.GetName]政治，以妖精解放作为政权目标。\n\n[SGS.GetName]原本是[AKI.GetName]的领土，138季妖怪山战争中脱离红魔馆军队的妖精士兵占据了这篇因战争成为废土的地区后，与来自幻想乡中部躲避复权战争的妖精难民会合，组建了[SGS.GetName]。[SGS.GetName]最初推举光之三妖精作为领袖，同时政治结构效仿[CIR.GetName]，由激进派主导政治局势。在为应对幻想乡西南紧张局势召开的西南妖精紧急会议中，激进派保持了优势，继续掌控[SGS.GetName]政治。\n\n由于西南局势的升级，幻想乡其他势力并未发表看法，只有[CIR.GetName]与盟友发表了祝贺。" 
sgs.102.1:0 "妖精解放更进一步"
sgs.102.2:0 "有趣"

sgs.103.t:0 "改革派掌控[SGS.GetName]政治"
sgs.103.d:0 "[SGS.GetName]近日的政治会议得出了结果：改革派掌控了[SGS.GetName]政治，将以妖精政权的繁荣发展作为执政目标。\n\n[SGS.GetName]原本是[AKI.GetName]的领土，138季妖怪山战争中脱离红魔馆军队的妖精士兵占据了这篇因战争成为废土的地区后，与来自幻想乡中部躲避复权战争的妖精难民会合，组建了[SGS.GetName]。[SGS.GetName]最初推举光之三妖精作为领袖，同时政治结构效仿[CIR.GetName]，由激进派主导政治局势。在为应对幻想乡西南紧张局势召开的西南妖精紧急会议中，改革派赢得了优势，成为[SGS.GetName]政治的新掌控者。\n\n由于西南局势的升级，幻想乡其他势力并未发表看法，只有[TEG.GetName]与盟友发表了祝贺。" 
sgs.103.1:0 "我们将为西南带来和平与繁荣"
sgs.103.2:0 "有趣"

sgs.104.t:0 "种族派掌控[SGS.GetName]政治"
sgs.104.d:0 "[SGS.GetName]近日的政治会议得出了结果：种族派出人意料的掌控了[SGS.GetName]政治，将注重发展军事以保证妖精政权的生存。\n\n[SGS.GetName]原本是[AKI.GetName]的领土，138季妖怪山战争中脱离红魔馆军队的妖精士兵占据了这篇因战争成为废土的地区后，与来自幻想乡中部躲避复权战争的妖精难民会合，组建了[SGS.GetName]。[SGS.GetName]最初推举光之三妖精作为领袖，同时政治结构效仿[CIR.GetName]，由激进派主导政治局势。在为应对幻想乡西南紧张局势召开的西南妖精紧急会议中，种族派赢得了优势，成为[SGS.GetName]政治的新掌控者。\n\n由于西南局势的升级，幻想乡其他势力并未发表看法。" 
sgs.104.1:0 "为妖精生存而战！"
sgs.104.2:0 "有趣"

sgs.105.t:0 "[SGS.GetName]请求同盟"
sgs.105.d:0 "[SGS.GetName]的领导人[SGS.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
sgs.105.1:0 "我们将并肩作战"
sgs.105.2:0 "革命不需要她们"

sgs.106.t:0 "[GEK.GetName]拒绝了同盟请求"
sgs.106.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
sgs.106.1:0 "我们也许只能依靠自己"

sgs.107.t:0 "[SGS.GetName]希望与我们合并"
sgs.107.d:0 "考虑到我们两国的意识形态相近，[SGS.GetName]提议两国组建联邦，以应对西南复杂的局势。" 
sgs.107.1:0 "没必要再流更多血了"
sgs.107.2:0 "我们必须保持独立"

sgs.108.t:0 "[ZYD.GetName]接受了合并请求"
sgs.108.d:0 "[ZYD.GetName]同意了与我们组建联邦的请求，我们将在同一面旗帜下并肩作战。"
sgs.108.1:0 "为了自由与繁荣的西南！"

sgs.109.t:0 "[ZYD.GetName]拒绝了合并请求"
sgs.109.d:0 "也许是我们的要求过于激进，[ZYD.GetName]拒绝与我们合并。"
sgs.109.1:0 "最终还是要靠武力解决"

sgs.110.t:0 "[SGS_construction_finish_state.GetName]的计划建设完成"
sgs.110.d:0 "我们在[SGS_construction_finish_state.GetName]的建设完成了，参与建设的工人正在返回，但其中的一部分可能无法返回了……"
sgs.110.1:0 "她们的牺牲不会白白浪费"

sgs.111.t:0 "超新星计划被迫中止"
sgs.111.d:0 "由于在建设计划实施过程中的伤亡过高，公众对超新星计划的不满与日俱增。我们不得不中止计划。"
sgs.111.1:0 "但愿我们已经取得了足够成效"

sgs.112.t:0 "领土损失"
sgs.112.d:0 "我国在战争中失去了大量领土，参谋部正在谋划夺回领土的计划。"
sgs.112.1:0 "我们必须尽快夺回领土"
