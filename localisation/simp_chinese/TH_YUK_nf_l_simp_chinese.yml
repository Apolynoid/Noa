YUK_yao_jing_sao_dong_idea:0 "妖精骚动"
YUK_yao_jing_sao_dong_idea_desc:0 "伴随大结界危机传入的不仅有外界科技，还有来自外界的思想与政治制度。随着雾之湖东岸在人类惩罚战争中独立，妖精革命的思潮也影响到了太阳花田，大量妖精开始对花田的传统制度感到不满。"
