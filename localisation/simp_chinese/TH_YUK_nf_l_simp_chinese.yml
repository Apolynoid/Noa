YUK_DAWN_DESC:0 "幻想乡的大结界危机与几场战争，彻底颠覆了太阳花田的旧秩序。大结界危机减少了大妖怪与妖精之间的力量差别，而雾之湖妖精联合体的成立点燃了妖精的种族意识，生活在太阳花田的妖精开始要求政治话语权。面对力量差距的缩小和妖精们日益增长的不满，风见幽香失败的政治权谋只是进一步强化了妖精们的不满，而西侧新生的妖精国家进一步动摇了花田地区的统治基础。为了避免国家彻底分裂，风见幽香成功劝说妖精们举行商谈，以期达成有效的政治协议。太阳花田的未来将继续掌握在风见幽香手中，还是由妖精们重新书写？"
introduce_YUK_page1:0 "§Y[YUK.GetName]§!一直作为§Y[YUK.GetLeader]§!的居所而在幻想乡闻名，以至于同样在此处生活的§Y妖精§!与§Y幽灵§!常常被忽略。毫无疑问地，§Y[YUK.GetLeader]§!是§Y[YUK.GetName]§!理所当然的统治者，大结界危机也没有改变这一点。138季的§Y妖怪山战争§!和142季的§Y人类惩罚战争§!并没有对这片远离幻想乡中心的土地带来什么改变。天狗在战争中战败，大量难民涌向西南；南雾之湖的厮杀与人类的战后处置——所有这些，都未能影响§Y[YUK.GetName]§!。\n\n然而，经历了大结界危机与多场战争的幻想乡已不复往日。§Y[CIR.GetName]§!的成立彻底改变了幻想乡的势力格局，也增强了全幻想乡妖精的种族意识。作为§Y[YUK.GetName]§!主要种族的妖精也受到了影响，开始要求增加妖精在管理事务中的话语权。另一方面，大结界危机也减少了§Y[YUK.GetLeader]§!与普通妖精之间的力量差别，以往依赖绝对力量的统治方式开始失效。面对力量差距的缩小和妖精们日益增长的不满，§Y[YUK.GetLeader]§!一方面任命§Y$YUK_larva$§!作为新晋行政官僚，另一方面又通过重新划分行政职责弱化了妖精的实际权力，这自然没有起到预计平息不满的效果。与此同时，来自南雾之湖，躲避人类惩罚战争战火的妖精难民与西南脱离红魔馆军队的妖精士兵会合，在幻想乡西南、§Y[YUK.GetName]§!的西侧建立了一个新的妖精国家——§Y[SGS.GetName]§!，这进一步动摇了花田地区的统治基础。\n\n作为避免国家走向彻底撕裂的最后尝试，§Y[YUK.GetLeader]§!成功说服了妖精们，双方将在不久后各自派出代表举行一次商谈，希望能够达成有效的政治协议。§Y[YUK.GetLeader]§!显然希望通过将协议内容转向具体的社会建设来维护自己的统治权力，而即使妖精们同意了这项协商，§Y[YUK.GetLeader]§!方面也需要尽快完成社会建设的承诺才能尽快恢复统治权威。§Y[YUK.GetName]§!会继续在§Y[YUK.GetLeader]§!手中平稳航行，抑或是面对妖精革命的滔天巨浪？"

