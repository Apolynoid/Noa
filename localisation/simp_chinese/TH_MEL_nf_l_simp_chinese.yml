MEL_zai_xi_nan_de_sheng_li_desc:0 "经历了艰苦的战争后，我们成为了西南混战的最终胜利者。通过这场胜利，我们证明了梅蒂欣对于西南无可争辩的统治权力，彻底打消了质疑者对梅蒂欣通知能力的质疑。"
