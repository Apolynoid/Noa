MEL_ling_lan_jun_guo_zhu_yi_idea:0 "铃兰军国主义"
MEL_ling_lan_jun_guo_zhu_yi_idea_desc:0 "由于西南的混乱局势，军事建设在我国受到了极高的重视。不仅社会生产与人员分配优先考虑军事需求，军队也直接控制了我国的政治局势，社会环境将入伍视为个人发展的最佳途径。"
MEL_ling_lan_jun_guo_zhu_yi_a_idea:0 "$MEL_ling_lan_jun_guo_zhu_yi_idea$"
MEL_ling_lan_jun_guo_zhu_yi_a_idea_desc:0 "$MEL_ling_lan_jun_guo_zhu_yi_idea_desc$"
MEL_ling_lan_jun_guo_zhu_yi_b_idea:0 "$MEL_ling_lan_jun_guo_zhu_yi_idea$"
MEL_ling_lan_jun_guo_zhu_yi_b_idea_desc:0 "$MEL_ling_lan_jun_guo_zhu_yi_idea_desc$"
MEL_ling_lan_jun_guo_zhu_yi_c_idea:0 "$MEL_ling_lan_jun_guo_zhu_yi_idea$"
MEL_ling_lan_jun_guo_zhu_yi_c_idea_desc:0 "$MEL_ling_lan_jun_guo_zhu_yi_idea_desc$"
MEL_bo_ruo_de_min_yong_gong_ye_idea:0 "薄弱的民用工业"
MEL_bo_ruo_de_min_yong_gong_ye_idea_desc:0 "我国长期以来以军事建设为首要任务，而相较而言忽视了民用工业的建设。这一忽视直接导致了我国基础工业的建设既缺乏足够的经验，也未能培养出足够的相关技术人员。"
