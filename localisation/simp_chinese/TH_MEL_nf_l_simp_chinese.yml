MEL_zheng_zhi_beng_kui_idea:0 "政治崩溃"
MEL_zheng_zhi_beng_kui_idea_desc:0 "相较于幻想乡的其他国家，我国始终未能建立起一套有效的行政体系，社会政治运作高度依赖于梅蒂欣的个人权威与军队对社会的直接控制，这严重影响了社会稳定与行政能力。"
