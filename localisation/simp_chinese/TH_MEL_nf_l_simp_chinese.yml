MEL_DAWN_DESC:0 "138季的妖怪山战争冲垮了铃兰地区的社会秩序，而梅蒂欣从动乱中崛起，凭借着个人的威望，一小支武装力量和西南特殊作物的应用知识，成为了铃兰地区事实上的统治者，又在人类惩罚战争期间宣布了铃兰地区的名义统一。然而，地方实力派的广泛存在使梅蒂欣不得不依靠军队进行统治，而军队在她授意下高度干预政治，占据了绝大部分社会资源，导致行政体系长期空虚，铃兰地区政治运转几近崩溃；而在外部，不仅神明信仰联盟的扩张矛头威胁着铃兰，西南的其他势力也在暗中伺机而动。梅蒂欣能否度过国内外的威胁，真正坐稳这片动荡西南的王座？"
introduce_MEL_page1:0 "即使不是主战场，138季的§Y妖怪山战争§!仍然对铃兰地区造成了巨大影响。大量战争难民与脱离队伍的士兵冲垮了铃兰地区的社会秩序，而来自地狱的失控幽灵对铃兰地区的局势更是雪上加霜。她们在铃兰地区成立了各式各样的武装团体与土匪组织。这些暴力组织之间冲突几乎从未停歇，当地近乎变为无政府状态。但§Y[MEL.GetLeader]§!同时也敏锐的捕捉到了机遇，很快凭借自己的威望与一小支武装力量，以及一部分西南地区§Y特殊作物§!的应用知识，整合了其他暴力组织，成为了铃兰地区事实上的统治者。趁着§Y人类惩罚战争§!时期幻想乡的主要势力无暇顾及西南局势，梅蒂欣宣布在铃兰地区成立了§Y[MEL.GetName]§!，名义上统一了铃兰地区。\n\n然而梅蒂欣的统治无疑是脆弱的。她首先要面对的问题便是铃兰地区§Y混乱的政治局势§!。虽然铃兰地区名义上得到了统一，但地方实力派依然广泛存在，梅蒂欣不得不依靠军队进行统治。军队则在梅蒂欣的授意下高度干预政治，政权因此呈现§Y军政府统治§!的特征，从而带来了缺乏行政官僚导致的政治能力低下。这一现状同时也导致了社会资源向军队高度倾斜，军队以西南局势混乱为由，占据了铃兰地区的绝大部分资源，使§Y[MEL.GetName]§!维持着与体量完全不相称的军事能力。这一现象进而影响了社会风气，进入军队几乎成为个人发展的唯一途径，行政官僚部门更加不受重视，政治运转几乎崩溃。同时，铃兰地区本就薄弱的工业能力也不得不更加向军事工业倾斜，民用工业几乎没有得到发展。\n\n而西南地区的局势也确实变得复杂起来。§Y[AKI.GetName]§!在战后受到§Y[SCA.GetName]§!的援助，成为了西南地区最强大的势力，其国内存在大量支持向西南扩张的声音。西南的其他势力都不得不面对如何抵抗§Y[AKI.GetName]§!扩张的问题，然而铃兰与这些西南小势力多次尝试组建抵抗§Y[AKI.GetName]§!的防御联盟的协商均由于各方利益难以平衡而宣告失败。现在，与§Y[AKI.GetName]§!的战争近在眼前，也有其他势力对西南虎视眈眈。梅蒂欣的野心能否安然度过外部的炮火与内部的利刃，真正坐稳西南的宝座？"
