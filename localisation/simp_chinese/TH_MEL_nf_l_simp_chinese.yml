MEL_te_shu_zuo_wu_ying_yong:0 "特殊作物应用"
MEL_te_shu_zuo_wu_ying_yong_desc:0 "西南特殊的地理位置使得本地能够生产有特殊效用的作物。通过有针对性的使用这些特殊作物，我们能在战争中取得一定优势。建设§Y种植场§!能增加每个§Y收获周期§!收获的特殊作物数量。同时，在未开发地区建设种植场不仅成本更低，还能解决地区的开发问题。在应用特殊作物时，无论§Y将领§!下辖的部队数量，每次发放消耗§Y一个单位§!的特殊作物。\n\n当前我们储存的§Y特殊作物§!数量为：\n£toxic_crops_texticon §Y特殊作物§!：[?MEL_crop_num]"
