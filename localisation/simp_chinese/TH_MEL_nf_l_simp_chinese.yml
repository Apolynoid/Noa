MEL_te_shu_zuo_wu_zhong_zhi_chang:0 "特殊作物种植场"
MEL_te_shu_zuo_wu_zhong_zhi_chang_desc:0 "无名之丘的特殊自然环境培养出了特殊的植物种类，其中一部分存在军事应用价值。通过有选择性的扩大种植具有军事价值的作物并应用于实战中，我们能有效的提高军队的战斗能力。"
