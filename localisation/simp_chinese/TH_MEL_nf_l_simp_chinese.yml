MEL_qiang_hua_mei_di_xin_quan_wei:0 "强化梅蒂欣权威"
MEL_qiang_hua_mei_di_xin_quan_wei_desc:0 "即使存在种种质疑，梅蒂欣仍然是我国唯一的统治者。通过对梅蒂欣的形象进行宣传，我们也许能够强化社会上对梅蒂欣权威的承认，从而部分弥补当前政府统治能力的不足。"
