l_simp_chinese:
cfa.101.t:0 "启动城市堡垒化计划"
cfa.101.d:0 "由于我们的预先准备，我们能够启动城市堡垒化计划以抵御敌人的进攻。"
cfa.101.1:0 "希望我们能争取到足够时间"

cfa.102.t:0 "[CFA.GetName]成立"
cfa.102.d:0 "在解决了天庭的威胁后，天界妖精政府近日宣布，将正式成立[CFA.GetName]，这标志着天界妖精正式作为一个政治实体登上了幻想乡的舞台。\n\n天界妖精原本被天庭统治，但幻想乡的动荡与妖怪山局势的变化使得天庭内部发生了混乱，天界妖精趁机宣布独立。一直以来，天庭强烈敌视天界妖精政府，宣称这是对天庭合法领土的侵犯。然而，随着天庭失去了对天界的影响力，天界的政治局势逐渐向有利于天界妖精的方向发展。基于这一判断，天界妖精政府决定正式宣布[CFA.GetName]的成立。\n\n幻想乡其他激进与改良政权纷纷向[CFA.GetName]发去祝贺，而幻想乡的旧有强权公开表示了对新生共和国的敌意，并声称这是对幻想乡平衡的破坏。"
cfa.102.1:0 "妖精对天庭强权的胜利！"
cfa.102.2:0 "妖精们什么时候才能消停点？"

cfa.103.t:0 "[CFA.GetName]请求同盟"
cfa.103.d:0 "[CFA.GetName]的领导人[CFA.GetLeader]请求加入我们的阵营，希望共同为一个和平、进步的幻想乡而努力。"
cfa.103.1:0 "我们欢迎她们加入"
cfa.103.2:0 "我们不能答应这项请求"

cfa.104.t:0 "[TEG.GetName]拒绝了同盟请求"
cfa.104.d:0 "尽管我们尽了最大的努力，[TEG.GetName]仍然拒绝与我们构建同盟关系的请求。"
cfa.104.1:0 "我们也许只能依靠自己"

cfa.105.t:0 "[CFA.GetName]请求同盟"
cfa.105.d:0 "[CFA.GetName]的领导人[CFA.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
cfa.105.1:0 "我们将并肩作战"
cfa.105.2:0 "革命不需要她们"

cfa.106.t:0 "[GEK.GetName]拒绝了同盟请求"
cfa.106.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
cfa.106.1:0 "我们也许只能依靠自己"
