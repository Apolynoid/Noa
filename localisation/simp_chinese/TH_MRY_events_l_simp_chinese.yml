l_simp_chinese:
mry.101.t:0 "[MRY.GetName]请求同盟"
mry.101.d:0 "[MRY.GetName]的领导人[MRY.GetLeader]请求加入我们的阵营，希望共同恢复幻想乡的稳定与和平。"
mry.101.1:0 "我们欢迎她们加入"
mry.101.2:0 "我们不能答应这项请求"

mry.102.t:0 "[MRY.GetName]加入[SCA.GetFactionName]"
mry.102.d:0 "近日，[MRY.GetName]与[SCA.GetName]共同宣布，[MRY.GetName]将加入由[SCA.GetName]主导的军事同盟[SCA.GetFactionName]，两国发言人声称这将有助于维护幻想乡的稳定与秩序。\n\n[MRY.GetName]在消灭妖怪山的敌人、取得妖怪山霸权后，即使在下玄武川地区与[SCA.GetName]有领土争议，也选择在外交上逐渐倾向[SCA.GetName]，最终，两国在一系列的谈判与商讨后，通过签订一系列条约，正式决定了[MRY.GetName]将成为[SCA.GetFactionName]的重要成员，从而进一步拉近两国间的外交关系。\n\n相关外交程序仍在进行中，但两国显然对此十分重视。[SCA.GetFactionName]的其他成员国均表示正在计划公开访问[MRY.GetName]。"
mry.102.1:0 "我们将共同维护幻想乡的秩序！"
mry.102.2:0 "我们对大妖怪之间的勾结没有兴趣"
mry.102.3:0 "幻想乡势力的天平开始倾斜"

mry.103.t:0 "[SCA.GetName]拒绝了同盟请求"
mry.103.d:0 "尽管我们尽了最大的努力，[SCA.GetName]仍然拒绝与我们构建同盟关系的请求。"
mry.103.1:0 "我们也许只能依靠自己"

mry.104.t:0 "[MRY.GetName]建立[MRY.GetFactionName]"
mry.104.d:0 "近日，[MRY.GetName]宣布，[MRY.GetName]将建立自己的军事同盟[MRY.GetFactionName]，[MRY.GetName]发言人声称这将有助于维护幻想乡的稳定与秩序。\n\n[MRY.GetName]在消灭妖怪山的敌人、取得妖怪山霸权后，由于在下玄武川地区与[SCA.GetName]有领土争议，[MRY.GetName]没有选择加入[SCA.GetName]的阵营，而是建立了自己的军事同盟。[MRY.GetName]发言人声称这将不会影响两国间的友谊，[MRY.GetName]与[SCA.GetName]两国间仍将保持友好关系，但[SCA.GetName]方面对此的担忧显而易见。\n\n幻想乡其他国家显然将这一行为视为[MRY.GetName]对幻想乡现有势力的挑战，幻想乡的平衡也许就此被打破。"
mry.104.1:0 "我们将维护幻想乡的秩序！"
mry.104.2:0 "大妖怪无聊的权力游戏"
mry.104.3:0 "[MRY.GetName]宣告自身地位的尝试"

mry.105.t:0 "第二次妖怪山战争"
mry.105.d:0 "来自妖怪山的消息：[MRY.GetName]与[TEG.GetName]之间的紧张关系终于被打破，两国之间已经进入战争状态。\n\n\n\n"
mry.105.1:0 "共和分子的末日到了！"
mry.105.2:0 "公民们，保卫祖国！"
mry.105.3:0 "妖怪山再次陷入战火"

mry.106.t:0 "[MRY.GetName]索取下玄武川"
mry.106.d:0 "来自妖怪山的消息：[MRY.GetName]单方面终结了与[SCA.GetName]的友好关系，以帮助河童盟友收复下玄武川的名义向[SCA.GetName]宣战，两国之间已经进入战争状态。\n\n自人类战争以后，[MRY.GetName]在外交上一直与[SCA.GetName]保持友好关系，幻想乡许多国家将两国视作事实上的盟友。然而这种关系现在已经不复存在，[MRY.GetName]似乎对于[SCA.GetName]在幻想乡的领导地位感到不满，决心通过战争夺取幻想乡霸权。[SCA.GetName]方面对突如其来的战争感到震惊，并公开对[MRY.GetName]破坏幻想乡秩序的行为进行了谴责。\n\n目前，两国的盟友已经开始了战争动员，这场战争也许将彻底改变幻想乡的局势。"
mry.106.1:0 "背信弃义！"
mry.106.2:0 "拿回我们应得的！"
mry.106.3:0 "大妖怪间的信任是脆弱的"
