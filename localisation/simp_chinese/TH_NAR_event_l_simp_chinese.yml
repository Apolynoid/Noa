l_simp_chinese:
# SEJ NAR请求加入同盟
nar.101.t:0 "[NAR.GetName]请求同盟"
nar.101.d:0 "在经历了魔法之森内战后，[NAR.GetName]的领导人[NAR.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
nar.101.1:0 "我们将并肩作战"
nar.101.2:0 "革命不需要她们"

# SEJ 请求被拒绝
nar.104.t:0 "[GEK.GetName]拒绝了同盟请求"
nar.104.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
nar.104.1:0 "我们也许只能依靠自己"
