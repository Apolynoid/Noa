l_simp_chinese:
srb.101.t:0 "影子计划的成果"
srb.101.d:0 "由于我们的预先准备，我国在进入战争状态后能够迅速动员一部分军事工业。" 
srb.101.1:0 "幸好我们早有准备"

srb.102.t:0 "[SRB.GetName]请求合并"
srb.102.d:0 "近日，[SRB.GetName]向我国发出请求，声称为了人类的整体利益，[SRB.GetName]方面认为我们最好与[SRB.GetName]合并，以应对幻想乡的动荡局势。[SRB.GetName]同时暗示若谈判失败，[SRB.GetName]可能采取武力措施。"
srb.102.1:0 "也许她们是对的"
srb.102.2:0 "人类不会是她们的附庸"

srb.103.t:0 "[HUM.GetName]拒绝了合并请求"
srb.103.d:0 "尽管我们尽了最大努力，[HKR.GetName]仍然拒绝与我们合并。"
srb.103.1:0 "她们明白另一个选项意味着什么"

srb.104.t:0 "[HUM.GetName]同意了合并请求"
srb.104.d:0 "[HUM.GetName]同意了与我们合并的请求，我们将在同一面旗帜下并肩作战。"
srb.104.1:0 "人类历史新的一页"

srb.105.t:0 "[SRB.GetName]和平进驻人类村落"
srb.105.d:0 ""
srb.105.1:0 "我们是人类的合法统治者！"
srb.105.2:0 "看来[SRB.GetName]的野心不小"

srb.107.t:0 "[FROM.GetName]取消投资"
srb.107.d:0 "由于[FROM.GetName]国内形势，[FROM.GetName]决定取消对我们的投资。"
srb.107.1:0 "可惜"

srb.108.t:0 "[SRB_influencial_overlord.GetName]掌控我国经济"
srb.108.d:0 "[SRB_influencial_overlord.GetName]对我国的经济施加了过多影响，现在她们可以利用这一影响进一步干涉我们的决策。"
srb.108.1:0 "糟糕"

srb.109.t:0 "掌控[SRB.GetName]经济"
srb.109.d:0 "我国对[SRB.GetName]的经济投资逐渐掌控了[SRB.GetName]国内局势，从而能够进一步影响她们的国内局势。"
srb.109.1:0 "我们的投资得到了回报"

srb.110.t:0 "与[SRB.GetName]的贸易"
srb.110.d:0 "[SRB.GetName]近日与我国敲定了贸易协定，双方的贸易往来已经开始。"
srb.110.1:0 "我们都将从中受益"

srb.111.t:0 "[SRB.GetName]全面倒向我们"
srb.111.d:0 "[SRB.GetName]决定在经济上加深与我国的合作，两国间的贸易往来开始常态化。"
srb.111.1:0 "明智的决定"

srb.112.t:0 "[SRB.GetName]倒向[SRB_relying_country.GetName]"
srb.112.d:0 ""
srb.112.1:0 "我们的友谊会带来胜利！"
srb.112.2:0 "她们做出了正确的选择"
srb.112.3:0 "有趣"

srb.113.t:0 "[SRB.GetName]保持中立"
srb.113.d:0 ""
srb.113.1:0 "我们不会参与幻想乡的纷争"
srb.113.2:0 "这种中立能保护她们吗？"

srb.114.t:0 "[SRB.GetName]请求同盟"
srb.114.d:0 "[SRB.GetName]的领导人[SRB.GetLeader]请求加入我们的阵营，希望共同恢复幻想乡的稳定与和平。"
srb.114.1:0 "我们欢迎她们加入"
srb.114.2:0 "我们不能答应这项请求"

srb.115.t:0 "[SCA.GetName]拒绝了同盟请求"
srb.115.d:0 "尽管我们尽了最大的努力，[SCA.GetName]仍然拒绝与我们构建同盟关系的请求。"
srb.115.1:0 "我们也许只能依靠自己"

srb.116.t:0 "[SRB.GetName]请求同盟"
srb.116.d:0 "[SRB.GetName]的领导人[SRB.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
srb.116.1:0 "我们将并肩作战"
srb.116.2:0 "革命不需要她们"

srb.117.t:0 "[GEK.GetName]拒绝了同盟请求"
srb.117.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
srb.117.1:0 "我们也许只能依靠自己"

srb.118.t:0 "[SRB.GetLeader]声索幻想乡统治权"
srb.118.d:0 ""
srb.118.1:0 "我们要书写幻想乡的新秩序！"
srb.118.2:0 "她疯了吗？"

srb.119.t:0 "[SRB.GetName]重启宗教冲突"
srb.119.d:0 ""
srb.119.1:0 "胜利将属于我们！"
srb.119.2:0 "她们是在自取灭亡！"
srb.119.3:0 "宗教不过是借口罢了"

srb.120.t:0 "外交政策失败"
srb.120.d:0 "我们未能在外交窗口期完成解除《军备限制条约》的相关谈判，目前缺乏解除军备限制的外交环境。"
srb.120.1:0 "那我们将采用武力"
