l_simp_chinese:
srb.101.t:0 "影子计划的成果"
srb.101.d:0 "由于我们的预先准备，我国在进入战争状态后能够迅速动员一部分军事工业。" 
srb.101.1:0 "幸好我们早有准备"

srb.102.t:0 "[SRB.GetName]请求合并"
srb.102.d:0 "近日，[SRB.GetName]向我国发出请求，声称为了人类的整体利益，[SRB.GetName]方面认为我们最好与[SRB.GetName]合并，以应对幻想乡的动荡局势。[SRB.GetName]同时暗示若谈判失败，[SRB.GetName]可能采取武力措施。"
srb.102.1:0 "也许她们是对的"
srb.102.2:0 "人类不会是她们的附庸"

srb.103.t:0 "[HUM.GetName]拒绝了合并请求"
srb.103.d:0 "尽管我们尽了最大努力，[HKR.GetName]仍然拒绝与我们合并。"
srb.103.1:0 "她们明白另一个选项意味着什么"

srb.104.t:0 "[HUM.GetName]同意了合并请求"
srb.104.d:0 "[HUM.GetName]同意了与我们合并的请求，我们将在同一面旗帜下并肩作战。"
srb.104.1:0 "人类历史新的一页"

srb.105.t:0 "[SRB.GetName]和平接管人类村落"
srb.105.d:0 "在一系列复杂的协商与文书工作后，近日，[SRB.GetLeader]宣布人类村落将正式与[SRB.GetName]合并，[SRB.GetLeader]宣称这将书写人类在幻想乡历史上的新篇章。\n\n在复权战争期间，[SRB.GetName]不顾妖怪联军的反对，维持了与人类的长期贸易，并因此战后遭受妖怪联军的严厉制裁。[SRB.GetLeader]声称考虑到幻想乡的现实局势，[SRB.GetName]有义务为人类提供必要的保护。最终，人类村落接受了这一提议，[SRB.GetLeader]成为了人类的新统治者。相关的行政交接程序仍在进行中，但[SRB.GetName]方面已经举行了盛大的庆祝仪式。\n\n幻想乡的其他强权对这一合并行为纷纷提出外交抗议，但似乎没有进行实质性干涉的意图。"
srb.105.1:0 "我们是人类的合法统治者！"
srb.105.2:0 "看来[SRB.GetName]的野心不小"

srb.107.t:0 "[FROM.GetName]取消投资"
srb.107.d:0 "由于[FROM.GetName]国内形势，[FROM.GetName]决定取消对我们的投资。"
srb.107.1:0 "可惜"

srb.108.t:0 "[SRB_influencial_overlord.GetName]掌控我国经济"
srb.108.d:0 "[SRB_influencial_overlord.GetName]对我国的经济施加了过多影响，现在她们可以利用这一影响进一步干涉我们的决策。"
srb.108.1:0 "糟糕"

srb.109.t:0 "掌控[SRB.GetName]经济"
srb.109.d:0 "我国对[SRB.GetName]的经济投资逐渐掌控了[SRB.GetName]国内局势，从而能够进一步影响她们的国内局势。"
srb.109.1:0 "我们的投资得到了回报"

srb.110.t:0 "与[SRB.GetName]的贸易"
srb.110.d:0 "[SRB.GetName]近日与我国敲定了贸易协定，双方的贸易往来已经开始。"
srb.110.1:0 "我们都将从中受益"

srb.111.t:0 "[SRB.GetName]全面倒向我们"
srb.111.d:0 "[SRB.GetName]决定在经济上加深与我国的合作，两国间的贸易往来开始常态化。"
srb.111.1:0 "明智的决定"

srb.112.t:0 "[SRB.GetName]倒向[SRB_relying_country.GetName]"
srb.112.d:0 "近日，在[SRB_relying_country.GetName]的支持下，[SRB.GetName]成功废除了严苛的《军备限制条约》。作为交换，[SRB.GetName]承诺将在幻想乡未来可能的冲突中支持[SRB_relying_country.GetName]。\n\n在143季的战争中，[SRB.GetName]虽未直接参战，但由于战时长期维持与人类的贸易关系，战后被迫同意接受苛刻的《军备限制条约》，以换取妖怪联军不进行经济制裁与军事干涉的承诺。此后，[SRB.GetName]致力于通过外交手段废除这一条约。这一外交努力取得了成效，不顾其他国家的反对，[SRB_relying_country.GetName]最终同意支持废止《军备限制条约》。\n\n[SRB.GetName]国内正举国庆祝这场外交胜利，而其他强权似乎对这一结果选择了沉默。"
srb.112.1:0 "我们的友谊会带来胜利！"
srb.112.2:0 "她们做出了正确的选择"
srb.112.3:0 "有趣"

srb.113.t:0 "[SRB.GetName]宣布保持中立"
srb.113.d:0 "近日，在与多方进行了漫长的外交协商后，[SRB.GetName]成功废除了严苛的《军备限制条约》。作为交换，[SRB.GetName]宣称将在幻想乡未来可能的冲突中保持中立。\n\n在143季的战争中，[SRB.GetName]虽未直接参战，但由于战时长期维持与人类的贸易关系，战后被迫同意接受苛刻的《军备限制条约》，以换取妖怪联军不进行经济制裁与军事干涉的承诺。此后，[SRB.GetName]致力于通过外交手段废除这一条约。这一外交努力取得了成效，出于幻想乡局势平衡的考虑，各大强权最终同意废止《军备限制条约》。\n\n[SRB.GetName]国内正举国庆祝这场外交胜利，而各强权似乎对这一结果选择了低调处理。"
srb.113.1:0 "我们不会参与幻想乡的纷争"
srb.113.2:0 "这种中立能保护她们吗？"

srb.114.t:0 "[SRB.GetName]请求同盟"
srb.114.d:0 "[SRB.GetName]的领导人[SRB.GetLeader]请求加入我们的阵营，希望共同恢复幻想乡的稳定与和平。"
srb.114.1:0 "我们欢迎她们加入"
srb.114.2:0 "我们不能答应这项请求"

srb.115.t:0 "[SCA.GetName]拒绝了同盟请求"
srb.115.d:0 "尽管我们尽了最大的努力，[SCA.GetName]仍然拒绝与我们构建同盟关系的请求。"
srb.115.1:0 "我们也许只能依靠自己"

srb.116.t:0 "[SRB.GetName]请求同盟"
srb.116.d:0 "[SRB.GetName]的领导人[SRB.GetLeader]请求加入我们的阵营，希望共同创造一个平等的幻想乡，让动荡的幻想乡能有弱者的一席之地。"
srb.116.1:0 "我们将并肩作战"
srb.116.2:0 "革命不需要她们"

srb.117.t:0 "[GEK.GetName]拒绝了同盟请求"
srb.117.d:0 "尽管我们尽了最大的努力，[GEK.GetName]仍然拒绝与我们构建同盟关系的请求。"
srb.117.1:0 "我们也许只能依靠自己"

srb.118.t:0 "[SRB.GetLeader]声索幻想乡统治权"
srb.118.d:0 "近日，[SRB.GetName]宣称$SRB_mik$作为天照大神直系后裔，拥有对全幻想乡人类乃至全幻想乡的合法统治权，同时单方面宣布废弃《军备限制条约》。\n\n在143季的战争中，[SRB.GetName]虽未直接参战，但由于战时长期维持与人类的贸易关系，战后被迫同意接受苛刻的《军备限制条约》，以换取妖怪联军不进行经济制裁与军事干涉的承诺。战后，[SRB.GetName]致力于通过外交手段废除这一条约。然而，在外交手段失败后，[SRB.GetName]似乎失去了耐心，选择了单方面废弃条约，同时在内部进行了战争动员，“以应对可能的妖怪联军干涉”。\n\n幻想乡的其他势力尚未对此发表看法，但普遍认为[SRB.GetName]的这一宣称可笑而不值一提。"
srb.118.1:0 "我们要书写幻想乡的新秩序！"
srb.118.2:0 "她疯了吗？"

srb.119.t:0 "[SRB.GetName]重启宗教冲突"
srb.119.d:0 "[SRB.GetLeader]近日正式宣布，[SRB.GetName]正式与[NMS.GetName]进入了战争状态，两国边境线上已发生零星交火。\n\n在结界危机前，[SRB.GetName]与[NMS.GetName]之间就因宗教矛盾产生过多次冲突。尽管在143季的战争前两国组建过短暂的邦联，但很快因为对人类与妖怪关系的态度差异而分裂，而143季战争中两国虽然没有直接发生敌对，但[SRB.GetName]对人类的支持也使得两国关系彻底破裂。[SRB.GetName]单方面废弃《军备限制条约》时，幻想乡普遍认为[SRB.GetName]最终会将战争的矛头指向[NMS.GetName]，而现在这份预测应验了。\n\n幻想乡的其他强权对此保持了意味深长的沉默。"
srb.119.1:0 "胜利将属于我们！"
srb.119.2:0 "她们是在自取灭亡！"
srb.119.3:0 "宗教不过是借口罢了"

srb.120.t:0 "外交政策失败"
srb.120.d:0 "我们未能在外交窗口期完成解除《军备限制条约》的相关谈判，目前缺乏解除军备限制的外交环境。"
srb.120.1:0 "那我们将采用武力"
