SCA_yao_jing_bu_man_idea:0 "妖精不满"
SCA_yao_jing_bu_man_idea_desc:0 "长久以来，帝国内为数众多的妖精对于帝国的统治远谈不上满意，而我们在前几次战争中糟糕的指挥造成的巨大伤亡显然不会对这一现状有所改善。琪露诺的叛乱远远不是妖精不满的终点。\n§R如果我们不采取措施，后果将不堪设想！§!"
SCA_yao_jing_bao_dong_idea:0 "妖精暴动"
SCA_bu_zhong_cheng_de_jun_dui_idea:0 "不忠诚的军队"
SCA_di_xiao_de_xing_zheng_ti_xi_idea:0 "低效的行政体系"
SCA_di_xiao_de_xing_zheng_ti_xi_idea_desc:0 "帝国的行政体系早已过度臃肿，处理起帝国的具体事务却十分低效。我们不仅要忍受僵化的行政体系，还不得不为此支付高昂的代价。"
SCA_di_xiao_de_xing_zheng_ti_xi_a_idea:0 "低效的行政体系"
SCA_di_xiao_de_xing_zheng_ti_xi_a_idea_desc:0 "帝国的行政体系早已过度臃肿，处理起帝国的具体事务却十分低效。我们不仅要忍受僵化的行政体系，还不得不为此支付高昂的代价。"
SCA_luo_hou_de_jun_shi_li_lun_idea:0 "落后的军事理论"
SCA_luo_hou_de_jun_shi_li_lun_idea_desc:0 "尽管我们取得了几次战争的胜利，但帝国所有人都心知肚明，帝国采用的军事学说已经远远落后于时代了。我们的军队正在随着时间的推移变得越来越落后。"
SCA_bu_chong_fen_de_zhan_zheng_zhun_bei_idea:0 "不充分的战争准备"
SCA_bu_chong_fen_de_zhan_zheng_zhun_bei_idea_desc:0 "不得不承认，我国军队还远远没有准备好迎接下一场大型战争。军队从指挥层到基层士兵都存在严重的混乱。\n§R如果我们不采取措施，我们将只能从战争中学习战争！§!"
