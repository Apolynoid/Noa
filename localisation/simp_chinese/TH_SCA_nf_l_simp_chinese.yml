SCA_yao_jing_bao_dong_desc:0 "最糟糕的事情发生了。帝国境内的妖精趁着帝国最虚弱的时刻发起了暴动，整个帝国现在都陷入了混乱之中。更加糟糕的是，派遣前去镇压的军队中也出现了拒绝执行命令的情况，军队的忠诚也不再可靠了。我们必须重新审视自己的政策，通过各种方案让暴动平息下来。\n\n当前§R暴动激进度§!：[?SCA.SCA_fairy_rebellion_value]\n当前§G军队忠诚度§!：[?SCA.SCA_army_loyalty_value]"
