l_simp_chinese:
ntr.101.t:0 "[NTR.GetName]希望与我们进行科技合作"
ntr.101.d:0 "来自[NTR.GetName]的外交人员称，她们希望与我国建立一个供两国的科研人员进行合作与交流的机构，以促进两国的科技水平发展。"
ntr.101.1:0 "这对我们都有好处"
ntr.101.2:0 "这没有必要"

ntr.102.t:0 "[TEG.GetName]同意了我们的请求"
ntr.102.d:0 "[TEG.GetName]同意了我方的请求，我们两国都将从中受益。"
ntr.102.1:0 "太好了"

ntr.103.t:0 "[TEG.GetName]拒绝了我们的请求"
ntr.103.d:0 "不幸的是，[TEG.GetName]拒绝了我们的请求，这将成为两国的损失。"
ntr.103.1:0 "可惜"

ntr.104.t:0 "[NTR.GetName]希望与我们共同进行战争模拟"
ntr.104.d:0 "来自[NTR.GetName]的外交人员称，为了应对未来可能发生，甚至近乎不可避免的战争，我们两国可以共同推进一种基于定量推演的桌面战争模拟，这无疑将大大提高我们两国参谋部对未来战争形势的判断能力。"
ntr.104.1:0 "这对我们都有好处"
ntr.104.2:0 "这没有必要"

ntr.105.t:0 "[NTR.GetName]希望与我们举行联合演习"
ntr.105.d:0 "来自[NTR.GetName]的外交人员称，为了应对未来可能发生，甚至近乎不可避免的战争，我们两国可以共同举行一次联合演习，这将为我们两国积累宝贵的军事经验。"
ntr.105.1:0 "这对我们都有好处"
ntr.105.2:0 "这没有必要"

ntr.106.t:0 "[NTR.GetName]请求经济援助"
ntr.106.d:0 "来自[NTR.GetName]的外交人员称，她们希望我们能够为[NTR.GetName]提供一笔经济援助，以便两国未来更好的发展妖怪山的民主制度。"
ntr.106.1:0 "我们当然要援助我们的盟友"
ntr.106.2:0 "我们恐怕不能援助她们"