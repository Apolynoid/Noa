l_simp_chinese:
teg.101.t:0 "天狗共和国大选"
teg.101.d:0 ""
teg.101.1:0 "射命丸文"
teg.101.2:0 "姬海棠果"

teg.102.t:0 "[TEG.GetName]的工业合作"
teg.102.d:0 "我们与[TEG.GetName]的工业合作取得了成效，我国的工业能力因此受益。"
teg.102.1:0 "合作愉快"

teg.103.t:0 "[TEG.GetName]与我国商议援助天界妖精"
teg.103.d:0 "[TEG.GetName]近日与我国商议对[CFA.GetName]的援助事宜。[TEG.GetName]方面表示，愿意向我国提供一笔工业投资，条件是协助维持[CFA.GetName]的独立地位。当[CFA.GetName]丧失独立地位式，[TEG.GetName]方面将终止投资。"
teg.103.1:0 "我们会考虑此事"

teg.104.t:0 "天狗投资终止"
teg.104.d:0 "由于幻想乡的局势变化，[TEG.GetName]方面终止了对我们的投资。"
teg.104.1:0 "可惜"

teg.105.t:0 "总动员状态结束"
teg.105.d:0 "出于形式的变化考虑，国家总动员状态结束了。"
teg.105.1:0 "那就这样了"
