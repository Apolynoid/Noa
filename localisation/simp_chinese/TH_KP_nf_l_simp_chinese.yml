KP_propaganda_tt:0 "解锁§Y宣传攻势§!决议\n§Y宣传攻势§!决议将提高边境地区的§Y民众支持度§!。§Y民众支持度§!能提高我方占领该地区后的§Y顺从度§!。§Y民众支持度§!足够高时，可以通过§Y公投§!获得地区控制权。"
KP_bribery_tt:0 "解锁§Y贿赂行政官员§!决议\n§Y贿赂行政官员§!决议将提高边境地区的§Y行政机构渗透率§!。§Y行政机构渗透率§!能提高§Y公投§!与§Y政变§!的成功率。"
KP_paramilitary_tt:0 "解锁§Y支持准军事组织§!决议\n§Y支持准军事组织§!决议将提高边境地区的§Y准军事组织力量§!。§Y准军事组织力量§!足够高时，将在开战时对驻守部队§Y造成损失§!。§Y准军事组织力量§!足够高时，可以通过§Y政变§!获得地区控制权。"
KP_border_scramble_tt:0 "解锁§Y要求公投§!与§Y发动政变§!决议\n§Y要求公投§!与§Y发动政变§!决议将尝试争夺边境地区的控制权，成功率分别由§Y民众支持度§!与§Y准军事组织力量§!决定，且都受到§Y行政机构渗透率§!影响。"
