KP_he_tong_zai_tong_yi_jin_cheng:0 "河童再统一进程"
KP_he_tong_zai_tong_yi_jin_cheng_desc:0 "作为天狗的传统盟友，河童在139季的天狗革命中也受到影响，南部工业区爆发了革命。但受到守矢支持的效忠派迅速在北部重新构筑了防线，而刚结束内战的[TEG.GetName]无力为共和盟友提供进一步的支援，双方因此达成了停火协议，河童就此分裂为北部的[KAP.GetName]和南部的[NTR.GetName]。随着共和制带来的泛河童主义不断增长，主张将大结界危机前便已脱离河童的山童重新视为河童种族一部分的声音也开始出现。河童的这种分裂状态必须被终结，一场河童再统一战争在所难免。\n\n不同河童政权拥有不同的§Y正统性§!，提高政权§Y正统性§!将§G提高§!政权行政能力，在再统一战争中取得§G优势§!。高§Y正统性§!政权还能降低其他河童政权的相关能力。\n\n§Y正统性§!的获取方式主要包括§Y国力正统性§!、§Y科技正统性§!和§Y特殊正统性§!。\n§Y国力正统性§!通过提高政权的§Y稳定性§!、§Y工业能力§!和§Y服役人数§!来提高。\n§Y科技正统性§!通过研究特定科技获取，包括§Y$houfangyiliao151$§!、§Y$mortar149$§!、§Y$jisuangongju149$§!、§Y$improved_machine_tools$§!。\n§Y特殊正统性§!为其他所有正统性获取方案的统称，其中值得注意的是控制§Y[69.GetName]§!地区能极大提升政权正统性。[NTR_reunification_process_tooltip][KAP_reunification_process_tooltip][YAW_reunification_process_tooltip]"

