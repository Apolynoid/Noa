YYK_ming_jie_nei_zhan_desc:0 "冥界内战爆发了。$YYK_fandong_party_long$与$YYK_oldorder_party_long$之间的战争无疑将决定冥界的未来。\n\n除了最基础的人员与装备补充，$YYK_fandong_party_long$的§Y革命热情§!也将极大影响战争走向。当$YYK_fandong_party_long$在战争中处于优势时，§Y革命热情§!将会§G增加§!，反之则会§R减少§!。此外，双方均有一系列行动可以用来影响$YYK_fandong_party_long$的§Y革命热情§!。\n\n战争优势的判断主要基于双方的投降倾向而决定，此外，§Y白玉楼§!地区被£KNA_flag_texticon $YYK_fandong_party_long$占领时，也将增强§Y革命热情§!。\n\n当前£KNA_flag_texticon $YYK_fandong_party_long$的§Y革命热情§!为：[YYK_get_fervour]\n下周§Y革命热情§!的变化为：[YYK_get_fervour_change]"

