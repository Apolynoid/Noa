YYK_ming_jie_de_ming_yun:0 "冥界的命运"
YYK_ming_jie_de_ming_yun_desc:0 "随着幻想乡旧有秩序的消失，冥界的政治局势也随之变得动荡。由于来自地狱的制裁，冥界的激进程度不断提高，一场决定冥界未来的内战不可避免。$YYK_fandong_party_long$与$YYK_oldorder_party_long$之间争夺冥界未来的决战也将要拉开帷幕。现在，我们必须决定冥界的未来将走向何方。"
