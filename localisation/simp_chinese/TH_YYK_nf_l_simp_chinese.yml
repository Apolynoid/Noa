# idea
YYK_you_ling_ji_jin_pai_xi_idea:0 "幽灵激进派系"
YYK_you_ling_ji_jin_pai_xi_idea_desc:0 "幻想乡的动荡与幻想乡激进派的胜利无疑也对冥界的幽灵造成了影响，受到激进主义影响的幽灵逐渐不满于$YYK_yyk$的统治，建立了名为$YYK_fandong_party_long$的地下组织。尽管遭到了来自白玉楼方面的追查，这些激进的幽灵仍然在地下宣传自己的理念，时机一到，她们就会为自己的激进理想而战。"
YYK_you_ling_ji_jin_pai_xi_a_idea:0 "幽灵激进派系"
YYK_you_ling_ji_jin_pai_xi_a_idea_desc:0 "$YYK_you_ling_ji_jin_pai_xi_idea_desc$"
YYK_ming_jie_dong_dang_idea:0 "冥界动荡"
YYK_ming_jie_dong_dang_idea_desc:0 "幻想乡的动荡无疑对冥界造成了巨大的冲击，大量反对者的出现让我们的行政能力受到极大挑战，在外交与军事方面也处处受到制约。更糟糕的是，这些激进派反对者似乎已经开始准备公开挑战$YYK_yyk$的统治……"
YYK_bu_zhong_cheng_de_jun_dui_idea:0 "不忠诚的军队"
YYK_bu_zhong_cheng_de_jun_dui_idea_desc:0 "我们的军队也受到了激进主义的影响，军队中现在充斥着不可靠的激进分子。激进主义的宣传海报与小册子在军中流传，即使几次查禁仍然于事无补。我们落后的军队建设水平，以及军官与士兵之间的严重隔阂，无疑只会加速激进主义的传播。"
YKO_jun_dui_bei_qing_xi_idea:0 "军队被清洗"
YKO_que_fa_zu_zhi_de_sheng_chan_idea:0 "缺乏组织的生产"
YKO_que_fa_zu_zhi_de_sheng_chan_idea_desc:0 "相较于妖怪科学飞速发展的幻想乡，冥界的生产建设技术水平显得十分落后，各种先进的设备与技术在冥界完全看不到踪影，工厂中的管理水平也十分糟糕。整体看来，我国的工业水平急需提升。"
YYK_ming_jie_nei_zhan_idea:0 "冥界内战"
YKO_que_fa_zu_zhi_de_sheng_chan_a_idea:0 "缺乏组织的生产"
