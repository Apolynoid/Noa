KNA_pan_netherworld_revolution_alliance:0 "泛冥界革命同盟"

YYK_DAWN_DESC:0 "自幻想乡建立以来，冥界一直由居住在白玉楼的西行寺幽幽子统治。然而，大结界危机严重冲击了幻想乡的旧秩序，大量涌入冥界的死者为冥界带来了幻想乡的激进主义。不满于冥界停滞的发展水平与西行寺家僵化统治的幽灵成立了冥界革命阵线，这一激进组织在白玉楼方面的追查与镇压中生存下来，并逐渐壮大自己的力量，开始增强激进主义在地方与军队中的影响力。现在，冥界两股力量的最终斗争即将开始，一场彻底决定冥界未来的内战即将到来，双方都在争取各区域与军队的支持。冥界的未来是会继续掌握在旧秩序手中，还是由新的革命者重新书写？"
introduce_YYK_page1:0 "在大结界危机以前，§Y冥界§!只是死者迈向下一个轮回的中转站。自幻想乡建立以来，冥界一直由居住在白玉楼的§Y$YYK_yyk$§!统治。然而，大结界危机严重冲击了幻想乡的旧秩序，而在§Y人类惩罚战争§!中，§Y$YKR_ykr$§!直接支持妖怪联军的行为引发了异界的普遍不满，而§Y$YYK_yyk$§!对§Y$YKR_ykr$§!的支持也使得冥界与其他异界的关系恶化。在§Y人类惩罚战争§!中崛起的§Y[SEJ.GetName]§!与§Y[CIR.GetName]§!成为了幻想乡激进主义的领袖，也加速了激进主义在全幻想乡的传播，同时大量死者涌入冥界，也为冥界带来了幻想乡的激进主义。这些来自幻想乡的幽灵也带来了有关其灵力科学发展的消息，幻想乡先进的灵力科技成果给冥界幽灵们留下了深刻印象。冥界的幽灵们开始意识到冥界停滞的科技水平与幻想乡的巨大差距，一部分不满于§Y$YYK_oldorder_party_long$§!统治，希望改革冥界政治的幽灵开始形成初步组织。\n\n大结界危机后，幽灵和骚灵间的差距逐渐缩小，许多骚灵也选择来到冥界，这其中也包括§Y$UND_kana$§!。作为来自幻想乡的骚灵，§Y$UND_kana$§!带来了幻想乡的组织结构与新的激进主义理论，逐渐在冥界的§Y激进反对派§!组织中赢得了声望。为了应对白玉楼方面的追查与镇压，松散的激进反对派组织逐渐重组成为了组织更严密的§Y$YYK_fandong_party_long$§!，推举§Y$UND_kana$§!为组织领袖。在与白玉楼方面斗争的过程中，§Y$YYK_fandong_party_long$§!也开始积蓄力量，逐渐在地方与军队中增加影响力，白玉楼方面惊恐的发现旧管理体系难以覆盖到的地区逐渐被激进派占领，军队尽管维持了表面上的忠诚，但基层士兵中开始传阅激进主义与革命的宣传册，在长时间的镇压下§Y$YYK_fandong_party_long$§!的实力甚至日益增长。现在，冥界两股力量的最终斗争即将开始，双方都在争取各区域与军队的支持，一场彻底决定冥界未来的内战即将到来。冥界的未来将继续由§Y$YYK_oldorder_party_long$§!主导，还是由§Y$YYK_fandong_party_long$§!重新书写？"
