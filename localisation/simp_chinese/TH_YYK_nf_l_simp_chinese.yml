KNA_di_yu_ge_ming:0 "地狱革命"
KNA_di_yu_ge_ming_desc:0 "革命绝不能仅仅停留在冥界，与冥界相邻的地狱仍然有压迫与不公的存在。我们作为冥界革命的先行者，有责任与义务解放地狱中的受压迫者。"

