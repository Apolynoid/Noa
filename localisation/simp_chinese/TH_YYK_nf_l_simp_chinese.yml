YYK_ji_jiang_dao_lai_de_nei_zhan_desc:0 "随着幻想乡的旧秩序在战火中灰飞烟灭，冥界的稳定也受到了威胁。不满于$YYK_yyk$的长期统治，冥界的部分幽灵在吸收了幻想乡的激进理论后，建立了反对$YYK_yyk$统治的一个被称为$YYK_fandong_party_long$的地下组织。由于来自地狱的制裁，冥界的激进程度不断提高，一场决定冥界未来的内战不可避免。\n\n当前军队支持情况：\n£KNA_flag_texticon $YYK_fandong_party_long$ [?KNA_army_support]%\n£YKO_flag_texticon $YYK_oldorder_party_long$ [?YKO_army_support]%\n当前武器分配情况：\n£KNA_flag_texticon $YYK_fandong_party_long$ [?KNA_equipment]%\n£YKO_flag_texticon $YYK_oldorder_party_long$ [?YKO_equipment]%\n\n此外，£YKO_flag_texticon $YYK_oldorder_party_long$可以通过加强武器库的安保措施减少被£KNA_flag_texticon $YYK_fandong_party_long$所能夺取的武器占比。\n当前£YKO_flag_texticon $YYK_oldorder_party_long$确保的武器占比为：[?YKO_secured_equipment]%"
