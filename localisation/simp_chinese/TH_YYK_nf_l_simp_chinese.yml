YYK_qing_chu_fan_dui_zhe_di_kang_desc:0 "尽管我们已经取得了内战的胜利，冥界残余的反对者仍然对我们的统治构成了威胁，依然保持了抵抗态度。我们必须尽快清除她们的影响，才能迈向进一步的国家重建。"

