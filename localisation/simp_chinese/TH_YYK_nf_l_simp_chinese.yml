YKO_di_yu_zheng_fu_ji_hua:0 "征服地狱"
YKO_di_yu_zheng_fu_ji_hua_desc:0 "西行寺家的荣耀显然不应当被限制于冥界之内，亡灵的来源——地狱也应当归于西行寺家的统治之下。通过对地狱的征服计划，我们能确保冥界与地狱的两顶皇冠归于$YYK_yyk$一人。"

