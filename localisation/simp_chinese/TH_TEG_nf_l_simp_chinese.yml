TEG_wei_ji_zhong_de_gong_he_guo_idea:0 "危机中的共和国"
TEG_wei_ji_zhong_de_gong_he_guo_idea_desc:0 "推翻腐朽的天魔统治层只是我们革命的第一步。革命后的共和国百废待兴，新政府在庞大的经济与行政任务前几近瘫痪，革命老兵战后缺乏安置，社会的不满正在积累，共和国的人民呼吁我们尽快采取措施解决问题。"
