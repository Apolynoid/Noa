TEG_da_xuan_desc:0 "尽管新生的共和国还处于混乱之中，我们必须兑现我们建立民主制度时许下的诺言，召开一次大选，来满足人民的呼声。这次大选将决定接下来几年中[TEG.GetName]的总统，也许也会决定[TEG.GetName]的民主制度会走向何方..."
