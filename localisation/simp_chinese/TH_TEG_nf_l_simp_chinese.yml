TEG_cui_ruo_de_min_zhu_zhi_du_idea_desc:0 "我们经历了漫长的革命，才推翻了腐朽的天魔政权，仿照外界建立起了一套民主制度。然而新生的民主制度并不稳定，如果不能尽快满足国内民众的诉求，建立一套完整稳定的民主制度，那么我们的民主不过是空话。"
