TEG_liu_wang_ren_lei_ke_xue_jia_idea:0 "流亡人类科学家"
TEG_liu_wang_ren_lei_ke_xue_jia_idea_desc:0 "在143季战争人类村落战败前夕，妖怪联军已经将人类科学家列为战犯。因此，部分人类科学家与天狗达成了交易，这些科学家转移到共和国为天狗服务，而天狗为她们提供人身保护。"
TEG_gui_hua_ren_lei_ke_xue_jia_idea:0 "归化人类科学家"
TEG_gui_hua_ren_lei_ke_xue_jia_idea_desc:0 "在143季战争人类村落战败前夕，妖怪联军已经将人类科学家列为战犯。因此，部分人类科学家与天狗达成了交易，这些科学家转移到共和国为天狗服务，而天狗为她们提供人身保护。"
