TEG_nei_zhan_shang_hen_idea:0 "内战伤痕"
TEG_nei_zhan_shang_hen_idea_desc:0 "天狗内战的惨烈程度远远超过幻想乡所有人的想象，太多英勇的共和战士死在了这场战争中，太多的家庭失去了她们的亲人。人民对再参加一场战争的恐惧甚至超越了复仇主义，天狗社会还远远没有准备好迎接下一场战争"
TEG_nei_zhan_shang_hen_a_idea:0 "$TEG_nei_zhan_shang_hen_idea$"
TEG_nei_zhan_shang_hen_a_idea_desc:0 "$TEG_nei_zhan_shang_hen_idea_desc$"
TEG_gong_ye_tan_huan_idea:0 "工业瘫痪"
TEG_gong_ye_tan_huan_idea_desc:0 "即使我们成功推翻了暴君，革命却并未就此结束。大量技术官僚逃到了守矢神社，而许多优秀的技术工人倒在了街垒上。供应链断裂，物流网也几乎瘫痪，重建过程注定是漫长的，我们还有很多事情要做。"
