l_simp_chinese:
aki.101.t:0 "应对[AKI.GetName]的威胁"
aki.101.d:0 "从[AKI.GetName]的军事调动和政治宣传来看，[AKI.GetName]显然正在谋划一次对西南其他势力的军事入侵。来自三个国家的代表正在协商建立共同防御条约的具体事项，我们应当对此采取何种态度？" 
aki.101.1:0 "我们必须团结一致"
aki.101.2:0 "我们自己就能应付"

aki.103.t:0 "$southwest_mutual_defense_treaty$成立"
aki.103.d:0 "在[AKI.GetName]进攻西南的压力下，由[ZYD.GetName]作为阵营领袖的$southwest_mutual_defense_treaty$终于成立，[ZYD.GetName]、[MEL.GetName]、[SGS.GetName]将在即将到来的战争中共同抵抗[AKI.GetName]。\n\n收复在妖怪山战争中损失的领土并进一步控制西南是[AKI.GetName]战后的第一要务，有鉴于此，此前西南势力间也多次协商过签署防御条约相关事宜，但均由于各方利益难以平衡宣告失败。不过近日迫在眉睫的威胁成功迫使三国团结在一起。这一防御条约显然是临时性的，在[AKI.GetName]的威胁解除后就会自然解散。\n\n[AKI.GetName]方面似乎并没有重视这一防御条约。" 
aki.103.1:0 "团结则存"
aki.103.2:0 "徒劳的挣扎"
aki.103.3:0 "有趣的发展"

aki.104.t:0 "协商破裂"
aki.104.d:0 "由于在协商期间无法达成各方均能接受的条件，建立共同防御条约的尝试宣告失败。" 
aki.104.1:0 "可惜"

aki.106.t:0 "联盟丰收大会"
aki.106.d:0 "在我们成功击溃了西南的其他所有势力后，我们成为了西南名副其实的统治者，现在我们终于可以举行因战争推迟的联盟丰收大会了。" 
aki.106.1:0 "为信仰的胜利欢呼！"
aki.106.2:0 "凋零者在大会上发动了政变！"

aki.107.t:0 "[AKI.GetName]举行联盟丰收大会"
aki.107.d:0 "因战争推迟的联盟丰收大会近日圆满落幕，这标志着[AKI.GetName]在西南地区的统治地位得到最终确立。\n\n[AKI.GetName]在妖怪山战争中不仅遭受了严重损失，同时也损失了大片领土。但在已经结束的西南战争中，[AKI.GetName]不仅成功夺回了失去的领土，同时也成功统一了西南，登上了西南统治者的宝座。[AKI.GetLeader]在大会上感谢了[SCA.GetName]盟友的援助，这一举动造成了凋零者派系的不满，但该派系在战后已被边缘化，无法再对[AKI.GetName]的政治格局造成有意义的影响。\n\n幻想乡的旧有强权，特别是[SCA.GetName]，向[AKI.GetLeader]发去了祝贺。[SCA.GetName]进一步表达了增强两国友谊的愿望。" 
aki.107.1:0 "意料之中的发展"
aki.107.2:0 "我们将为西南带来繁荣"

aki.108.t:0 "联盟丰收大会上的政变"
aki.108.d:0 "在[AKI.GetName]因战争推迟的联盟丰收大会上，凋零者派系出乎意料的发动了政变，在混乱中夺取了[AKI.GetName]的统治权。\n\n[AKI.GetName]在妖怪山战争中不仅遭受了严重损失，同时也损失了大片领土。但在已经结束的西南战争中，[AKI.GetName]不仅成功夺回了失去的领土，同时也成功统一了西南，登上了西南统治者的宝座。[AKI.GetLeader]在大会上谴责了[SCA.GetName]在妖怪山战争中对[AKI.GetName]的伤害，并强调[AKI.GetName]将转向对[SCA.GetName]的复仇。\n\n幻想乡的旧有强权，特别是[SCA.GetName]，对此表示极度惊讶。[SCA.GetName]方面没有更多消息，但据不可靠信息来源，红魔馆方面正在紧急制定处理方案。" 
aki.108.1:0 "出乎意料"
aki.108.2:0 "为妖怪山战争复仇！"
aki.108.3:0 "我们到底还有多少麻烦？"

aki.109.t:0 "怀疑主义蔓延"
aki.109.d:0 "我们的第一轮攻势结束后，许多人对我们是否能取得最终胜利产生了怀疑。" 
aki.109.1:0 "只有胜利才能彻底消除这种怀疑"

aki.110.t:0 "前线士兵逃离岗位"
aki.110.d:0 "由于战事不利，我们前线的士兵出现了逃离岗位的现象。" 
aki.110.1:0 "可耻"
