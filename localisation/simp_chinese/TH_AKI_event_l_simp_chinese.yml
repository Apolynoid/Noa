l_simp_chinese:
aki.101.t:0 "应对[AKI.GetName]的威胁"
aki.101.d:0 "从[AKI.GetName]的军事调动和政治宣传来看，[AKI.GetName]显然正在谋划一次对西南其他势力的军事入侵。来自三个国家的代表正在协商建立共同防御条约的具体事项，我们应当对此采取何种态度？" 
aki.101.1:0 "我们必须团结一致"
aki.101.2:0 "我们自己就能应付"

aki.103.t:0 "$southwest_mutual_defense_treaty$成立"
aki.103.d:0 "" 
aki.103.1:0 "团结则存"
aki.103.2:0 "徒劳的挣扎"
aki.103.3:0 "有趣的发展"

aki.104.t:0 "协商破裂"
aki.104.d:0 "由于在协商期间无法达成各方均能接受的条件，建立共同防御条约的尝试宣告失败。" 
aki.104.1:0 "可惜"

aki.106.t:0 "联盟丰收大会"
aki.106.d:0 "" 
aki.106.1:0 "为信仰的胜利欢呼！"
aki.106.2:0 "凋零者在大会上发动了政变！"
