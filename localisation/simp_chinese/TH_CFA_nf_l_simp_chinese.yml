### desicion
CFA_bao_lei_hua_cheng_shi:0 "堡垒化城市"
CFA_bao_lei_hua_cheng_shi_desc:0 "面对外部入侵的威胁，仅凭我国的常规军事力量难以有效应对。通过对关键枢纽城市进行堡垒化，我们可以有效迟缓敌人的进攻，为盟友的支援争取时间，等待局势变化。\n\n目前，备选堡垒化城市有§Y[68.GetCapitalVictoryPointName]§!、§Y[48.GetCapitalVictoryPointName]§!、§Y[24.GetCapitalVictoryPointName]§!、§Y[15.GetCapitalVictoryPointName]§!、§Y[357.GetCapitalVictoryPointName]§!和§Y[12.GetCapitalVictoryPointName]§!。然而，堡垒化的完成需要时间。我们必须在城市的堡垒化准备完成前尽可能§Y拖延§!敌人，如果城市完成堡垒化前被敌人占领，这座城市将§R失去堡垒化能力§!，即使重新被我们控制也无法再次进行堡垒化。"
CFA_2657_bao_lei_hua:0 "[68.GetCapitalVictoryPointName]堡垒化"
CFA_1390_bao_lei_hua:0 "[48.GetCapitalVictoryPointName]堡垒化"
CFA_1529_bao_lei_hua:0 "[24.GetCapitalVictoryPointName]堡垒化"
CFA_2595_bao_lei_hua:0 "[15.GetCapitalVictoryPointName]堡垒化"
CFA_511_bao_lei_hua:0 "[357.GetCapitalVictoryPointName]堡垒化"
CFA_171_bao_lei_hua:0 "[12.GetCapitalVictoryPointName]堡垒化"
TES_bao_lei_hua_cheng_shi:0 "堡垒化城市"
TES_bao_lei_hua_cheng_shi_desc:0 "不自量力的妖精们显然不会束手就擒，她们准备对关键枢纽城市进行堡垒化以负隅顽抗。如果不能尽快占领这些城市，我们进一步的进攻将会严重受阻。\n\n目前，备选堡垒化城市有§Y[68.GetCapitalVictoryPointName]§!、§Y[48.GetCapitalVictoryPointName]§!、§Y[24.GetCapitalVictoryPointName]§!、§Y[15.GetCapitalVictoryPointName]§!、§Y[357.GetCapitalVictoryPointName]§!和§Y[12.GetCapitalVictoryPointName]§!。堡垒化的完成需要时间，如果我们能在完成堡垒化前占领城市，这座城市将§R失去堡垒化能力§!，即使再次失去控制也无法再次进行堡垒化。"
